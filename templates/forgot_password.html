<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset password — AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #080B18;
            color: #F5F7FF;
            font-family: system-ui, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,.1);
            background: #10152B;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #9CA3AF;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            color: white;
            background: rgba(255,255,255,.05);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
        }

        a {
            color: #60a5fa;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 9px;
            background: rgba(34,197,94,.1);
            color: #bbf7d0;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Forgot password?</h1>

    <p>
        Enter your email and we'll send you a password
        reset link if an account exists.
    </p>

    {% if message %}
    <div class="message">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <button type="submit">
            Send reset link
        </button>

    </form>

    <p>
        <a href="/login">
            ← Back to login
        </a>
    </p>

</div>

</body>
</html>
