<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra — Ask. Get answers.</title>

    <meta
        name="description"
        content="AskOra is a simple AI assistant."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #080b18;
            --sidebar: #0b0f20;
            --panel: #10152b;
            --panel2: #151b35;
            --border: rgba(255,255,255,.08);
            --text: #f5f7ff;
            --muted: #9ca3af;
            --blue: #3b82f6;
            --violet: #7c3aed;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ==================================================
           APP
        ================================================== */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ==================================================
           SIDEBAR
        ================================================== */

        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            flex-shrink: 0;
            z-index: 30;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 6px 18px;
        }

        .brand-icon {
            width: 39px;
            height: 39px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 21px;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 0 25px rgba(59,130,246,.25);
        }

        .brand-text strong {
            display: block;
            font-size: 17px;
            letter-spacing: -.2px;
        }

        .brand-text span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .new-chat {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 11px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
            transition: .2s;
        }

        .new-chat:hover {
            background: var(--panel2);
            border-color: rgba(255,255,255,.13);
        }

        .new-chat-icon {
            font-size: 19px;
            line-height: 1;
        }

        .search {
            margin-bottom: 8px;
        }

        .search input {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.03);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            outline: none;
        }

        .search input::placeholder {
            color: #687087;
        }

        .search input:focus {
            border-color: rgba(59,130,246,.55);
            background: rgba(255,255,255,.045);
        }

        .history-label {
            color: var(--muted);
            font-size: 11px;
            padding: 9px 7px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .history {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .history::-webkit-scrollbar {
            width: 5px;
        }

        .history::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.1);
            border-radius: 10px;
        }

        .chat-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 9px;
            margin-bottom: 3px;
            color: #dfe4f3;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
        }

        .chat-item:hover {
            background: rgba(255,255,255,.05);
        }

        .chat-item.active {
            background: rgba(59,130,246,.13);
            border-color: rgba(59,130,246,.08);
        }

        .chat-icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            text-align: left;
        }

        .delete-chat {
            border: 0;
            background: transparent;
            color: var(--muted);
            opacity: 0;
            padding: 3px 5px;
            border-radius: 5px;
        }

        .delete-chat:hover {
            color: #f87171;
            background: rgba(239,68,68,.08);
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        .empty-history {
            color: #687087;
            font-size: 12px;
            text-align: center;
            padding: 25px 10px;
        }

        /* ==================================================
           ACCOUNT
        ================================================== */

        .account {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 10px;
        }

        .account-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .account-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #202945;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .account-info {
            min-width: 0;
            flex: 1;
        }

        .account-name {
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-email {
            font-size: 10px;
            color: var(--muted);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .account-actions a,
        .account-actions button {
            flex: 1;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
        }

        .account-actions a:hover,
        .account-actions button:hover {
            color: var(--text);
            background: rgba(255,255,255,.04);
        }

        /* ==================================================
           MAIN
        ================================================== */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }

        .topbar {
            height: 60px;
            min-height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-menu {
            display: none;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 22px;
            padding: 4px;
        }

        .model-name {
            font-size: 14px;
            font-weight: 650;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34,197,94,.45);
        }

        /* ==================================================
           MESSAGES
        ================================================== */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 18px 155px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 7px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.08);
            border-radius: 10px;
        }

        .message-wrap {
            max-width: 850px;
            margin: 0 auto 28px;
            display: flex;
            gap: 13px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 700;
        }

        .avatar.user {
            background: #26304d;
        }

        .avatar.ai {
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 0 18px rgba(59,130,246,.14);
        }

        .message-body {
            min-width: 0;
            flex: 1;
        }

        .message-name {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .message-content {
            font-size: 15px;
            line-height: 1.72;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-content strong {
            font-weight: 700;
        }

        .message-content code {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.05);
            padding: 2px 5px;
            border-radius: 5px;
            font-family: monospace;
            font-size: .9em;
        }

        .message-content pre {
            background: #050713;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre;
            margin: 12px 0;
        }

        .message-content pre code {
            background: transparent;
            border: 0;
            padding: 0;
        }

        /* ==================================================
           WELCOME
        ================================================== */

        .welcome {
            min-height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-box {
            max-width: 600px;
            padding: 25px;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
            border-radius: 23px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            font-size: 35px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 0 45px rgba(59,130,246,.2);
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 30px;
            letter-spacing: -.6px;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        /* ==================================================
           COMPOSER
        ================================================== */

        .composer-area {
            position: fixed;
            bottom: 0;
            left: 280px;
            right: 0;
            padding: 20px;
            background:
                linear-gradient(
                    transparent,
                    var(--bg) 34%
                );
            z-index: 10;
        }

        .composer {
            max-width: 850px;
            margin: 0 auto;
            min-height: 60px;
            border: 1px solid rgba(255,255,255,.12);
            background: #10152b;
            border-radius: 17px;
            box-shadow:
                0 12px 40px rgba(0,0,0,.35);
            padding: 9px;
            display: flex;
            align-items: flex-end;
            gap: 7px;
        }

        .composer:focus-within {
            border-color: rgba(59,130,246,.28);
        }

        .composer textarea {
            flex: 1;
            resize: none;
            max-height: 180px;
            min-height: 42px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            padding: 10px 8px;
            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color: #737b91;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            border: 0;
            background: transparent;
            color: #aeb6ca;
            display: grid;
            place-items: center;
            font-size: 19px;
            flex-shrink: 0;
        }

        .icon-button:hover {
            background: rgba(255,255,255,.06);
            color: white;
        }

        .send-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 11px;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            display: grid;
            place-items: center;
            font-size: 17px;
            flex-shrink: 0;
            transition: .2s;
        }

        .send-button:hover {
            transform: translateY(-1px);
            box-shadow:
                0 5px 18px rgba(59,130,246,.2);
        }

        .send-button:disabled {
            opacity: .4;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        /* ==================================================
           RECORDING
        ================================================== */

        .recording {
            display: none;
            align-items: center;
            gap: 12px;
            flex: 1;
            padding: 9px;
        }

        .recording.active {
            display: flex;
        }

        .record-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            50% {
                opacity: .35;
                transform: scale(.75);
            }
        }

        .record-time {
            font-variant-numeric: tabular-nums;
            font-size: 13px;
        }

        .record-text {
            color: var(--muted);
            font-size: 13px;
            flex: 1;
        }

        .record-cancel {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
        }

        .record-cancel:hover {
            color: #f87171;
        }

        /* ==================================================
           TYPING
        ================================================== */

        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8992a8;
            animation: typing 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            50% {
                transform: translateY(-4px);
                opacity: .45;
            }
        }

        /* ==================================================
           MOBILE
        ================================================== */

        .overlay {
            display: none;
        }

        @media (max-width: 760px) {

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: -290px;
                transition: left .25s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,.55);
                z-index: 20;
            }

            .overlay.show {
                display: block;
            }

            .mobile-menu {
                display: block;
            }

            .composer-area {
                left: 0;
                padding: 10px;
            }

            .topbar {
                padding: 0 12px;
            }

            .messages {
                padding: 18px 12px 130px;
            }

            .message-wrap {
                gap: 9px;
                margin-bottom: 22px;
            }

            .message-content {
                font-size: 14px;
                line-height: 1.65;
            }

            .welcome {
                min-height: 60vh;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .welcome-logo {
                width: 62px;
                height: 62px;
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="brand">

            <div class="brand-icon">
                A
            </div>

            <div class="brand-text">

                <strong>
                    AskOra
                </strong>

                <span>
                    Ask. Get answers.
                </span>

            </div>

        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >

            <span class="new-chat-icon">
                ＋
            </span>

            <span>
                New chat
            </span>

        </button>


        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search chats..."
                autocomplete="off"
                oninput="filterChats()"
            >

        </div>


        <div class="history-label">
            History
        </div>


        <div
            class="history"
            id="history"
        ></div>


        <div class="account">

            <div class="account-row">

                <div
                    class="account-avatar"
                    id="accountAvatar"
                >
                    U
                </div>

                <div class="account-info">

                    <div class="account-name">
                        @{{ user.username }}
                    </div>

                    <div class="account-email">
                        {{ user.email }}
                    </div>

                </div>

            </div>


            <div class="account-actions">

                {% if is_admin %}

                <a href="/admin">
                    Admin
                </a>

                {% endif %}

                <button onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </aside>


    <!-- MOBILE OVERLAY -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeSidebar()"
    ></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <header class="topbar">

            <div class="top-left">

                <button
                    class="mobile-menu"
                    onclick="openSidebar()"
                    aria-label="Open menu"
                >
                    ☰
                </button>

                <div class="model-name">
                    AskOra
                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                <span>
                    Online
                </span>

            </div>

        </header>


        <section
            class="messages"
            id="messages"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-box">

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        Ask anything. Get clear,
                        useful answers from AskOra.
                    </p>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     COMPOSER
========================================================= -->

<div class="composer-area">

    <div class="composer">

        <div
            class="recording"
            id="recording"
        >

            <span class="record-dot"></span>

            <span
                class="record-time"
                id="recordTime"
            >
                00:00
            </span>

            <span class="record-text">
                Recording...
            </span>

            <button
                class="record-cancel"
                onclick="cancelRecording()"
            >
                Cancel
            </button>

        </div>


        <textarea
            id="messageInput"
            placeholder="Message AskOra..."
            rows="1"
            onkeydown="handleKey(event)"
        ></textarea>


        <button
            class="icon-button"
            id="micButton"
            onclick="toggleRecording()"
            title="Voice message"
            aria-label="Voice message"
        >
            🎙
        </button>


        <button
            class="send-button"
            id="sendButton"
            onclick="sendMessage()"
            aria-label="Send message"
        >
            ↑
        </button>

    </div>

</div>


<script>

const csrfToken =
    "{{ csrf_token }}";

let currentChatId = null;
let chats = [];

let mediaRecorder = null;
let audioChunks = [];

let recordingTimer = null;
let recordingSeconds = 0;


/* =========================================================
   API
========================================================= */

async function api(
    url,
    options = {}
) {

    options.headers =
        options.headers || {};

    options.headers[
        "X-CSRF-Token"
    ] = csrfToken;

    const response =
        await fetch(
            url,
            options
        );

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );

    if (!response.ok) {

        if (
            response.status === 401
        ) {
            window.location =
                "/login";
        }

        throw new Error(
            data.error
            || "Something went wrong."
        );
    }

    return data;
}


/* =========================================================
   INITIAL LOAD
========================================================= */

async function loadChats() {

    try {

        const data =
            await api(
                "/api/chats"
            );

        chats =
            data.chats || [];

        renderChats();

        if (
            chats.length > 0
            && !currentChatId
        ) {

            await openChat(
                chats[0].id
            );

        }

    } catch (error) {

        console.error(
            error
        );

    }
}


/* =========================================================
   RENDER CHAT HISTORY
========================================================= */

function renderChats() {

    const container =
        document.getElementById(
            "history"
        );

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();

    container.innerHTML = "";

    const filtered =
        chats.filter(
            chat =>
                String(
                    chat.title || ""
                )
                .toLowerCase()
                .includes(search)
        );


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `
            <div class="empty-history">
                ${
                    search
                    ? "No chats found."
                    : "Your chats will appear here."
                }
            </div>
        `;

        return;
    }


    filtered.forEach(
        chat => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "chat-item"
                +
                (
                    Number(chat.id)
                    ===
                    Number(currentChatId)
                    ? " active"
                    : ""
                );


            item.innerHTML = `

                <span class="chat-icon">
                    💬
                </span>

                <span class="chat-title">
                    ${escapeHtml(
                        chat.title
                        || "New chat"
                    )}
                </span>

                <button
                    class="delete-chat"
                    type="button"
                    aria-label="Delete chat"
                >
                    ×
                </button>

            `;


            item.addEventListener(
                "click",
                event => {

                    if (
                        event.target.closest(
                            ".delete-chat"
                        )
                    ) {
                        return;
                    }

                    openChat(
                        chat.id
                    );

                }
            );


            item
                .querySelector(
                    ".delete-chat"
                )
                .addEventListener(
                    "click",
                    event => {

                        deleteChat(
                            event,
                            chat.id
                        );

                    }
                );


            container.appendChild(
                item
            );

        }
    );
}


function filterChats() {
    renderChats();
}


/* =========================================================
   NEW CHAT
========================================================= */

async function newChat() {

    try {

        const data =
            await api(
                "/api/chats",
                {
                    method: "POST"
                }
            );

        chats.unshift(
            data.chat
        );

        currentChatId =
            data.chat.id;

        renderChats();

        clearMessages();

        closeSidebar();

        document
            .getElementById(
                "messageInput"
            )
            .focus();

    } catch (error) {

        alert(
            error.message
        );

    }
}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(
    chatId
) {

    currentChatId =
        chatId;

    renderChats();

    try {

        const data =
            await api(
                `/api/chats/${chatId}/messages`
            );

        const messages =
            document.getElementById(
                "messages"
            );

        messages.innerHTML = "";


        if (
            !data.messages
            ||
            data.messages.length === 0
        ) {

            showWelcome();

        } else {

            data.messages.forEach(
                message => {

                    addMessage(
                        message.role,
                        message.content
                    );

                }
            );

        }

        closeSidebar();

    } catch (error) {

        alert(
            error.message
        );

    }
}


/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(
    event,
    chatId
) {

    event.stopPropagation();

    if (
        !confirm(
            "Delete this chat?"
        )
    ) {
        return;
    }


    try {

        await api(
            `/api/chats/${chatId}`,
            {
                method: "DELETE"
            }
        );


        chats =
            chats.filter(
                chat =>
                    Number(chat.id)
                    !==
                    Number(chatId)
            );


        if (
            Number(currentChatId)
            ===
            Number(chatId)
        ) {

            currentChatId =
                null;


            if (
                chats.length > 0
            ) {

                await openChat(
                    chats[0].id
                );

            } else {

                clearMessages();

            }

        }


        renderChats();

    } catch (error) {

        alert(
            error.message
        );

    }
}

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    role,
    content
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }


    const messages =
        document.getElementById(
            "messages"
        );


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message-wrap";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar "
        +
        (
            role === "assistant"
            ? "ai"
            : "user"
        );

    avatar.textContent =
        role === "assistant"
        ? "A"
        : "You";


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "message-name";

    name.textContent =
        role === "assistant"
        ? "AskOra"
        : "You";


    const contentDiv =
        document.createElement(
            "div"
        );

    contentDiv.className =
        "message-content";


    if (
        role === "assistant"
    ) {

        contentDiv.innerHTML =
            simpleMarkdown(
                content
            );

    } else {

        contentDiv.textContent =
            content;

    }


    body.appendChild(
        name
    );

    body.appendChild(
        contentDiv
    );

    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        body
    );

    messages.appendChild(
        wrapper
    );


    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value = "";

    autoResize();


    if (!currentChatId) {

        const data =
            await api(
                "/api/chats",
                {
                    method: "POST"
                }
            );

        currentChatId =
            data.chat.id;

        chats.unshift(
            data.chat
        );

        renderChats();

    }


    addMessage(
        "user",
        text
    );

    showTyping();

    button.disabled = true;


    try {

        const data =
            await api(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text,
                            chat_id:
                                currentChatId
                        })
                }
            );


        removeTyping();


        addMessage(
            "assistant",
            data.answer
        );


        currentChatId =
            data.chat_id;


        await loadChats();


    } catch (error) {

        removeTyping();


        addMessage(
            "assistant",
            "⚠️ " +
            error.message
        );


    } finally {

        button.disabled = false;

        input.focus();

    }
}

/* =========================================================
   TEXTAREA
========================================================= */

function handleKey(
    event
) {

    if (
        event.key === "Enter"
        &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    setTimeout(

function autoResize() {

    const input =
        document.getElementById(

}


/* =========================================================
   VOICE
========================================================= */

async function toggleRecording() {

    if (
        mediaRecorder
        &&
        mediaRecorder.state
        === "recording"
    ) {

        stopRecording();

        return;

    }


    if (
        !navigator.mediaDevices
        ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Your browser does not support microphone access."
        );

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        audioChunks = [];


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                await uploadRecording();

            };


        mediaRecorder.start();

        startRecordingUI();


    } catch (error) {

        console.error(
            error
        );

        alert(
            "Microphone access was denied or is unavailable."
        );

    }
}


function stopRecording() {

    if (
        mediaRecorder
        &&
        mediaRecorder.state
        === "recording"
    ) {

        mediaRecorder.stop();

    }

    stopRecordingUI();
}


function cancelRecording() {

    audioChunks = [];


    if (
        mediaRecorder
        &&
        mediaRecorder.state
        === "recording"
    ) {

        mediaRecorder.onstop =
            null;

        mediaRecorder.stop();

    }


    stopRecordingUI();

    mediaRecorder = null;
}


function startRecordingUI() {

    document
        .getElementById(
            "recording"
        )
        .classList
        .add("active");


    document
        .getElementById(
            "messageInput"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "sendButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "micButton"
        )
        .textContent =
        "■";


    recordingSeconds = 0;

    updateRecordTime();


    recordingTimer =
        setInterval(
            () => {

                recordingSeconds++;

                updateRecordTime();

            },
            1000
        );
}


function stopRecordingUI() {

    document
        .getElementById(
            "recording"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "messageInput"
        )
        .style.display =
        "";


    document
        .getElementById(
            "sendButton"
        )
        .style.display =
        "";


    document
        .getElementById(
            "micButton"
        )
        .textContent =
        "🎙";


    clearInterval(
        recordingTimer
    );
}


function updateRecordTime() {

    const minutes =
        Math.floor(
            recordingSeconds / 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    const seconds =
        (
            recordingSeconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    document
        .getElementById(
            "recordTime"
        )
        .textContent =
        `${minutes}:${seconds}`;
}


/* =========================================================
   UPLOAD VOICE
========================================================= */

async function uploadRecording() {

    if (
        audioChunks.length === 0
    ) {

        return;

    }


    if (!currentChatId) {

        const data =
            await api(
                "/api/chats",
                {
                    method: "POST"
                }
            );


        currentChatId =
            data.chat.id;


        chats.unshift(
            data.chat
        );


        renderChats();

    }


    const blob =
        new Blob(
            audioChunks,
            {
                type: "audio/webm"
            }
        );


    const formData =
        new FormData();


    formData.append(
        "audio",
        blob,
        "recording.webm"
    );


    formData.append(
        "chat_id",
        currentChatId
    );


    showTyping();


    try {

        const response =
            await fetch(
                "/api/voice",
                {
                    method: "POST",

                    headers: {
                        "X-CSRF-Token":
                            csrfToken
                    },

                    body:
                        formData
                }
            );


        const data =
            await response.json();


        removeTyping();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error
                ||
                "Voice request failed."
            );

        }


        addMessage(
            "user",
            data.transcription
        );


        addMessage(
            "assistant",
            data.answer
        );


        currentChatId =
            data.chat_id;


        await loadChats();


    } catch (error) {

        removeTyping();


        addMessage(
            "assistant",
            "⚠️ " +
            error.message
        );


    } finally {

        audioChunks = [];

        mediaRecorder = null;

    }
}


/* =========================================================
   MARKDOWN
========================================================= */

function escapeHtml(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function simpleMarkdown(
    text
) {

    let html =
        escapeHtml(text);


    html =
        html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );


    html =
        html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    html =
        html.replace(
            /\n/g,
            "<br>"
        );


    return html;
}
