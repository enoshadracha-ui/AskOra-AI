<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>AskOra</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Arial, sans-serif;
            background: #080B18;
            color: #F5F7FF;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 58, 237, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at top left,
                    rgba(59, 130, 246, 0.14),
                    transparent 30%
                ),
                #080B18;
        }

        .header {
            min-height: 70px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(16, 21, 43, 0.88);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
            box-shadow:
                0 0 22px rgba(59, 130, 246, 0.28);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 750;
        }

        .brand-subtitle {
            margin-top: 2px;
            font-size: 11px;
            color: #9CA3AF;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        button {
            border: none;
            font-family: inherit;
            cursor: pointer;
        }

        .header-btn {
            padding: 9px 11px;
            border-radius: 11px;
            color: #F5F7FF;
            background: rgba(255, 255, 255, 0.07);
            font-size: 12px;
            font-weight: 600;
        }

        .header-btn:active {
            transform: scale(0.97);
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 22px 15px 18px;
            scroll-behavior: smooth;
        }

        .welcome {
            text-align: center;
            margin: 55px auto 25px;
            max-width: 330px;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
            box-shadow:
                0 0 35px rgba(59, 130, 246, 0.25);
        }

        .welcome h1 {
            margin: 0;
            font-size: 27px;
        }

        .welcome p {
            margin: 9px 0 0;
            color: #9CA3AF;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-row {
            display: flex;
            margin: 12px 0;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message {
            max-width: 84%;
            padding: 11px 14px;
            border-radius: 17px;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-row.user .message {
            background: linear-gradient(
                135deg,
                #2563EB,
                #4F46E5
            );
            border-bottom-right-radius: 5px;
        }

        .message-row.assistant .message {
            background: #10152B;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-bottom-left-radius: 5px;
        }

        .typing-row {
            display: none;
            justify-content: flex-start;
            margin: 12px 0;
        }

        .typing {
            padding: 12px 15px;
            border-radius: 17px;
            background: #10152B;
            border: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #9CA3AF;
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.45;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        .composer {
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 11, 24, 0.94);
            backdrop-filter: blur(14px);
        }

        .composer-inner {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 700px;
            margin: auto;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            padding: 12px 14px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            outline: none;
            background: #10152B;
            color: #F5F7FF;
            font-family: inherit;
            font-size: 15px;
        }

        textarea::placeholder {
            color: #7d8498;
        }

        textarea:focus {
            border-color: rgba(59, 130, 246, 0.55);
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: #F5F7FF;
            background: #10152B;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
            border: none;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .recording {
            background: #7C3AED !important;
        }

        .status {
            text-align: center;
            font-size: 11px;
            color: #7d8498;
            padding-top: 6px;
            min-height: 18px;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">A</div>

            <div>
                <div class="brand-name">AskOra</div>
                <div class="brand-subtitle">
                    Ask. Get answers.
                </div>
            </div>

        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                onclick="inviteFriend()"
            >
                ✨ Invite
            </button>

            <button
                class="header-btn"
                onclick="resetChat()"
            >
                Clear
            </button>

        </div>

    </header>


    <main
        class="chat"
        id="chat"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">A</div>

            <h1>Welcome to AskOra</h1>

            <p>
                Your simple AI assistant.<br>
                Ask anything by text or voice.
            </p>

        </div>


        <div
            class="typing-row"
            id="typingRow"
        >

            <div class="typing">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    </main>


    <footer class="composer">

        <div class="composer-inner">

            <button
                class="icon-btn"
                id="micButton"
                onclick="toggleRecording()"
                title="Voice"
            >
                🎤
            </button>

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Ask anything..."
                oninput="autoResize(this)"
                onkeydown="handleKey(event)"
            ></textarea>

            <button
                class="icon-btn send-btn"
                onclick="sendMessage()"
                title="Send"
            >
                ➤
            </button>

        </div>

        <div
            class="status"
            id="status"
        ></div>

    </footer>

</div>


<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const typingRow = document.getElementById("typingRow");
    const input = document.getElementById("messageInput");
    const statusText = document.getElementById("status");
    const micButton = document.getElementById("micButton");


    // =========================
    // TELEGRAM AUTH
    // =========================

    function authHeaders() {
        return {
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": tg.initData
        };
    }


    // =========================
    // CHAT UI
    // =========================

    function addMessage(role, text) {

        if (welcome) {
            welcome.style.display = "none";
        }

        const row = document.createElement("div");

        row.className =
            "message-row " +
            (role === "user" ? "user" : "assistant");

        const bubble = document.createElement("div");

        bubble.className = "message";

        bubble.textContent = text;

        row.appendChild(bubble);

        chat.insertBefore(row, typingRow);

        scrollToBottom();
    }


    function showTyping() {

        typingRow.style.display = "flex";

        scrollToBottom();
    }


    function hideTyping() {

        typingRow.style.display = "none";
    }


    function scrollToBottom() {

        chat.scrollTop = chat.scrollHeight;
    }


    function setStatus(text) {

        statusText.textContent = text || "";
    }


    // =========================
    // SEND MESSAGE
    // =========================

    async function sendMessage() {

        const message = input.value.trim();

        if (!message) {
            return;
        }

        input.value = "";

        autoResize(input);

        addMessage("user", message);

        showTyping();

        setStatus("AskOra is thinking...");

        try {

            const response = await fetch(
                "/api/chat",
                {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify({
                        message: message
                    })
                }
            );

            const data = await response.json();

            hideTyping();

            if (!response.ok) {

                throw new Error(
                    data.error || "Something went wrong."
                );
            }

            addMessage(
                "assistant",
                data.answer
            );

            setStatus("");

        } catch (error) {

            hideTyping();

            addMessage(
                "assistant",
                "⚠️ Sorry, something went wrong. Please try again."
            );

            setStatus("");

            console.error(error);
        }
    }


    // =========================
    // ENTER KEY
    // =========================

    function handleKey(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }


    // =========================
    // TEXTAREA
    // =========================

    function autoResize(element) {

        element.style.height = "auto";

        element.style.height =
            Math.min(
                element.scrollHeight,
                120
            ) + "px";
    }


    // =========================
    // LOAD HISTORY
    // =========================

    async function loadHistory() {

        try {

            const response = await fetch(
                "/api/history",
                {
                    method: "GET",
                    headers: {
                        "X-Telegram-Init-Data":
                            tg.initData
                    }
                }
            );

            if (!response.ok) {
                return;
            }

            const data = await response.json();

            if (
                !data.history ||
                data.history.length === 0
            ) {
                return;
            }

            welcome.style.display = "none";

            for (const message of data.history) {

                addMessage(
                    message.role,
                    message.content
                );
            }

        } catch (error) {

            console.error(
                "History error:",
                error
            );
        }
    }


    // =========================
    // CLEAR CHAT
    // =========================

    async function resetChat() {

        const confirmed = confirm(
            "Clear your AskOra conversation?"
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                "/api/reset",
                {
                    method: "POST",
                    headers: authHeaders()
                }
            );

            if (!response.ok) {

                throw new Error(
                    "Unable to clear chat."
                );
            }

            const messages =
                chat.querySelectorAll(
                    ".message-row"
                );

            messages.forEach(
                message => message.remove()
            );

            welcome.style.display = "block";

            hideTyping();

            setStatus("");

            tg.HapticFeedback?.notificationOccurred(
                "success"
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "Could not clear conversation."
            );
        }
    }


    // =========================
    // INVITE
    // =========================

    function inviteFriend() {

        const url =
            "https://t.me/share/url?" +
            new URLSearchParams({
                url: "https://t.me/askora_official_bot",
                text:
                    "Try AskOra 🤖 — a free AI assistant on Telegram!"
            }).toString();

        tg.openTelegramLink(url);
    }


    // =========================
    // VOICE RECORDING
    // =========================

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;


    async function toggleRecording() {

        if (isRecording) {

            stopRecording();

            return;
        }

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(stream);

            mediaRecorder.ondataavailable =
                function(event) {

                    if (event.data.size > 0) {

                        audioChunks.push(
                            event.data
                        );
                    }
                };


            mediaRecorder.onstop =
                async function() {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                    const audioBlob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "audio/webm"
                            }
                        );

                    await sendVoice(
                        audioBlob
                    );
                };


            mediaRecorder.start();

            isRecording = true;

            micButton.classList.add(
                "recording"
            );

            setStatus(
                "Listening..."
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "Microphone permission is required."
            );
        }
    }


    function stopRecording() {

        if (
            mediaRecorder &&
            mediaRecorder.state !== "inactive"
        ) {

            mediaRecorder.stop();
        }

        isRecording = false;

        micButton.classList.remove(
            "recording"
        );
    }


    async function sendVoice(audioBlob) {

        showTyping();

        setStatus(
            "AskOra is processing your voice..."
        );

        try {

            const formData =
                new FormData();

            formData.append(
                "audio",
                audioBlob,
                "voice.webm"
            );

            const response =
                await fetch(
                    "/api/voice",
                    {
                        method: "POST",
                        headers: {
                            "X-Telegram-Init-Data":
                                tg.initData
                        },
                        body: formData
                    }
                );

            const data =
                await response.json();

            hideTyping();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Voice processing failed."
                );
            }

            if (data.transcript) {

                addMessage(
                    "user",
                    "🎤 " +
                    data.transcript
                );
            }

            if (data.answer) {

                addMessage(
                    "assistant",
                    data.answer
                );
            }

            setStatus("");

        } catch (error) {

            hideTyping();

            console.error(error);

            addMessage(
                "assistant",
                "⚠️ Sorry, I couldn't process that voice note."
            );

            setStatus("");
        }
    }


    // =========================
    // START
    // =========================

    loadHistory();

</script>

</body>
</html>
