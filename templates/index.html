<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #080b18;
            --sidebar: #0c1020;
            --panel: #10152b;
            --panel2: #151b35;
            --border: rgba(255,255,255,.08);
            --text: #f5f7ff;
            --muted: #9ca3af;
            --blue: #3b82f6;
            --violet: #7c3aed;
            --danger: #ef4444;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 8px 18px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--violet)
            );
            font-weight: 800;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }

        .new-chat {
            border: 1px solid var(--border);
            background: var(--panel);
            color: white;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            transition: .2s;
        }

        .new-chat:hover {
            background: var(--panel2);
        }

        .search {
            margin-top: 12px;
        }

        .search input {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.03);
            color: white;
            border-radius: 10px;
            padding: 10px 12px;
            outline: none;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin-top: 14px;
        }

        .history-title {
            color: var(--muted);
            font-size: 12px;
            padding: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .chat-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #dce1f0;
            border-radius: 10px;
            padding: 11px;
            text-align: left;
            margin-bottom: 3px;
            display: flex;
            gap: 9px;
            align-items: center;
        }

        .chat-item:hover,
        .chat-item.active {
            background: rgba(255,255,255,.07);
        }

        .chat-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .account {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 10px;
        }

        .account-user {
            padding: 9px;
            margin-bottom: 6px;
        }

        .account-name {
            font-weight: 600;
        }

        .account-email {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .account-buttons a,
        .logout-btn {
            border: 1px solid var(--border);
            background: rgba(255,255,255,.04);
            color: #e8ebf5;
            border-radius: 9px;
            padding: 8px 10px;
            text-decoration: none;
            font-size: 13px;
        }

        .logout-btn:hover,
        .account-buttons a:hover {
            background: rgba(255,255,255,.09);
        }

        /* MAIN */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            height: 58px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: rgba(8,11,24,.85);
            backdrop-filter: blur(15px);
        }

        .mobile-menu {
            display: none;
            border: 0;
            background: transparent;
            color: white;
            font-size: 22px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .online {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px 170px;
        }

        .welcome {
            max-width: 760px;
            margin: 8vh auto 0;
            text-align: center;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            margin: auto;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--violet)
            );
            font-size: 28px;
            font-weight: 800;
            box-shadow:
                0 20px 60px rgba(59,130,246,.2);
        }

        .welcome h1 {
            margin: 20px 0 8px;
            font-size: 32px;
        }

        .welcome p {
            color: var(--muted);
        }

        .message {
            max-width: 850px;
            margin: 0 auto 28px;
            display: flex;
            gap: 14px;
        }

        .avatar {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 700;
            background: var(--panel2);
        }

        .message.user .avatar {
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--violet)
            );
        }

        .message-body {
            min-width: 0;
            flex: 1;
        }

        .message-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .content {
            color: #e7eaf3;
            line-height: 1.72;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        /* MARKDOWN */

        .content h1,
        .content h2,
        .content h3 {
            color: white;
            line-height: 1.3;
            margin: 22px 0 10px;
        }

        .content h1 {
            font-size: 25px;
        }

        .content h2 {
            font-size: 21px;
        }

        .content h3 {
            font-size: 18px;
        }

        .content p {
            margin: 0 0 14px;
        }

        .content ul,
        .content ol {
            margin: 8px 0 16px;
            padding-left: 25px;
        }

        .content li {
            margin: 6px 0;
        }

        .content strong {
            color: white;
        }

        .content blockquote {
            border-left: 3px solid var(--blue);
            margin: 15px 0;
            padding: 5px 15px;
            color: #b9c0d2;
        }

        .content code {
            background: rgba(255,255,255,.08);
            padding: 2px 6px;
            border-radius: 5px;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;
        }

        .code-wrap {
            margin: 16px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #060812;
        }

        .code-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        .copy-code {
            border: 0;
            background: rgba(255,255,255,.07);
            color: white;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
        }

        .code-wrap pre {
            margin: 0;
            padding: 15px;
            overflow-x: auto;
        }

        .code-wrap pre code {
            background: transparent;
            padding: 0;
            color: #e8ecf7;
        }

        .content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
            display: block;
            overflow-x: auto;
        }

        .content th,
        .content td {
            border: 1px solid var(--border);
            padding: 9px 11px;
            text-align: left;
        }

        .content th {
            background: rgba(255,255,255,.06);
        }

        /* IMAGE */

        .image-preview {
            display: none;
            position: absolute;
            bottom: 135px;
            left: 50%;
            transform: translateX(-50%);
            width: min(850px, calc(100% - 30px));
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            z-index: 5;
        }

        .image-preview.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .image-preview img {
            width: 70px;
            height: 70px;
            border-radius: 9px;
            object-fit: cover;
        }

        .image-info {
            flex: 1;
        }

        .image-label {
            font-weight: 600;
        }

        .image-hint {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .remove-image {
            border: 0;
            background: rgba(239,68,68,.12);
            color: #fca5a5;
            border-radius: 8px;
            padding: 8px 10px;
        }

        /* COMPOSER */

        .composer-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 20px 20px;
            background:
                linear-gradient(
                    to top,
                    var(--bg) 70%,
                    transparent
                );
        }

        .composer {
            max-width: 850px;
            margin: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 9px;
            display: flex;
            align-items: flex-end;
            gap: 7px;
            box-shadow:
                0 15px 50px rgba(0,0,0,.25);
        }

        .attach-btn,
        .mic-btn,
        .send-btn {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border: 0;
            border-radius: 12px;
            display: grid;
            place-items: center;
        }

        .attach-btn,
        .mic-btn {
            background: transparent;
            color: #bfc6d8;
        }

        .attach-btn:hover,
        .mic-btn:hover {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .send-btn {
            background: linear-gradient(
                135deg,
                var(--blue),
                var(--violet)
            );
            color: white;
            font-size: 18px;
        }

        .send-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        textarea {
            flex: 1;
            resize: none;
            max-height: 180px;
            min-height: 42px;
            background: transparent;
            color: white;
            border: 0;
            outline: 0;
            padding: 10px 7px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #737b90;
        }

        .recording {
            display: none;
            align-items: center;
            gap: 10px;
            flex: 1;
            padding: 9px;
            color: #fca5a5;
        }

        .recording.active {
            display: flex;
        }

        .record-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .35;
                transform: scale(.7);
            }
        }

        .record-time {
            font-variant-numeric: tabular-nums;
        }

        .stop-record {
            border: 0;
            background: rgba(239,68,68,.15);
            color: #fca5a5;
            border-radius: 8px;
            padding: 7px 10px;
        }

        .typing {
            display: none;
            max-width: 850px;
            margin: 0 auto 25px;
            color: var(--muted);
            font-size: 13px;
        }

        .typing.show {
            display: block;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;
                z-index: 50;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                transition: transform .2s;
                box-shadow: 20px 0 60px rgba(0,0,0,.4);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: block;
            }

            .messages {
                padding-left: 13px;
                padding-right: 13px;
            }

            .composer-area {
                padding-left: 9px;
                padding-right: 9px;
            }

            .message {
                gap: 9px;
            }

            .welcome h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="brand">
            <div class="brand-icon">A</div>

            <div class="brand-name">
                AskOra
            </div>
        </div>

        <button
            class="new-chat"
            id="newChatBtn"
        >
            <span>＋</span>
            <span>New chat</span>
        </button>

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="Search chats..."
            >
        </div>

        <div class="chat-history">

            <div class="history-title">
                History
            </div>

            <div id="chatList"></div>

        </div>

        <div class="account">

            <div class="account-user">

                <div class="account-name">
                    {{ user.username }}
                </div>

                <div class="account-email">
                    {{ user.email }}
                </div>

            </div>

            <div class="account-buttons">

                {% if is_admin %}
                <a href="/admin">
                    Admin
                </a>
                {% endif %}

                <button
                    class="logout-btn"
                    id="logoutBtn"
                >
                    Logout
                </button>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;gap:10px;">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                >
                    ☰
                </button>

                <strong>
                    AskOra
                </strong>

            </div>

            <div class="status">

                <span class="online"></span>

                Online

            </div>

        </header>


        <section
            class="messages"
            id="messages"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    A
                </div>

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask questions, upload images,
                    or use your voice.
                </p>

            </div>

            <div
                class="typing"
                id="typing"
            >
                AskOra is thinking...
            </div>

        </section>


        <!-- IMAGE PREVIEW -->

        <div
            class="image-preview"
            id="imagePreview"
        >

            <img
                id="previewImage"
                alt="Selected image"
            >

            <div class="image-info">

                <div class="image-label">
                    Image attached
                </div>

                <div class="image-hint">
                    Ask AskOra to analyze it.
                </div>

            </div>

            <button
                class="remove-image"
                id="removeImage"
            >
                Remove
            </button>

        </div>


        <!-- COMPOSER -->

        <div class="composer-area">

            <form
                class="composer"
                id="composer"
            >

                <input
                    type="file"
                    id="imageInput"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    hidden
                >

                <button
                    type="button"
                    class="attach-btn"
                    id="attachBtn"
                    title="Upload image"
                >
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Message AskOra..."
                    rows="1"
                ></textarea>

                <div
                    class="recording"
                    id="recording"
                >

                    <span class="record-dot"></span>

                    <span>
                        Recording
                    </span>

                    <span
                        class="record-time"
                        id="recordTime"
                    >
                        00:00
                    </span>

                    <button
                        type="button"
                        class="stop-record"
                        id="stopRecord"
                    >
                        Stop
                    </button>

                </div>

                <button
                    type="button"
                    class="mic-btn"
                    id="micBtn"
                    title="Voice"
                >
                    🎙
                </button>

                <button
                    type="submit"
                    class="send-btn"
                    id="sendBtn"
                    title="Send"
                >
                    ↑
                </button>

            </form>

        </div>

    </main>

</div>


<script>

const csrfToken = {{ csrf_token|tojson }};

let currentChatId = null;
let chats = [];
let selectedImage = null;
let mediaRecorder = null;
let audioChunks = [];
let recordingTimer = null;
let recordingSeconds = 0;


/* ============================================================
   ELEMENTS
   ============================================================ */

const messagesEl =
    document.getElementById("messages");

const welcomeEl =
    document.getElementById("welcome");

const typingEl =
    document.getElementById("typing");

const chatListEl =
    document.getElementById("chatList");

const messageInput =
    document.getElementById("messageInput");

const composer =
    document.getElementById("composer");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const recordingEl =
    document.getElementById("recording");

const stopRecord =
    document.getElementById("stopRecord");

const recordTime =
    document.getElementById("recordTime");

const imageInput =
    document.getElementById("imageInput");

const attachBtn =
    document.getElementById("attachBtn");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");

const logoutBtn =
    document.getElementById("logoutBtn");

const newChatBtn =
    document.getElementById("newChatBtn");

const searchInput =
    document.getElementById("searchInput");

const sidebar =
    document.getElementById("sidebar");

const mobileMenu =
    document.getElementById("mobileMenu");


/* ============================================================
   API
   ============================================================ */

async function api(
    url,
    options = {}
) {

    options.headers = {
        ...(options.headers || {}),
        "X-CSRF-Token": csrfToken,
    };

    const response =
        await fetch(
            url,
            options
        );

    if (
        response.status === 401
    ) {
        window.location.href =
            "/login";

        return null;
    }

    const data =
        await response
            .json()
            .catch(() => ({}));

    if (!response.ok) {

        throw new Error(
            data.error ||
            "Something went wrong."
        );
    }

    return data;
}


/* ============================================================
   LOAD CHATS
   ============================================================ */

async function loadChats() {

    try {

        const data =
            await api(
                "/api/chats"
            );

        chats =
            data.chats || [];

        renderChatList();

        if (
            !currentChatId &&
            chats.length
        ) {

            await openChat(
                chats[0].id
            );

        }

    } catch (error) {

        console.error(error);
    }
}


/* ============================================================
   CHAT LIST
   ============================================================ */

function renderChatList() {

    const search =
        searchInput
            .value
            .toLowerCase()
            .trim();

    chatListEl.innerHTML = "";

    const filtered =
        chats.filter(
            chat =>
                chat.title
                    .toLowerCase()
                    .includes(search)
        );

    filtered.forEach(
        chat => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "chat-item" +
                (
                    chat.id === currentChatId
                        ? " active"
                        : ""
                );

            button.innerHTML = `
                <span>💬</span>
                <span class="chat-title">
                    ${escapeHtml(chat.title)}
                </span>
            `;

            button.addEventListener(
                "click",
                () => {

                    openChat(chat.id);

                    if (
                        window.innerWidth <= 800
                    ) {
                        sidebar.classList.remove(
                            "open"
                        );
                    }

                }
            );

            chatListEl.appendChild(
                button
            );
        }
    );
}


/* ============================================================
   OPEN CHAT
   ============================================================ */

async function openChat(
    chatId
) {

    currentChatId =
        Number(chatId);

    renderChatList();

    messagesEl.innerHTML = "";

    typingEl.className =
        "typing";

    messagesEl.appendChild(
        typingEl
    );

    try {

        const data =
            await api(
                `/api/chats/${chatId}/messages`
            );

        if (
            !data.messages ||
            !data.messages.length
        ) {

            showWelcome();

            return;
        }

        data.messages.forEach(
            message => {

                addMessage(
                    message.role,
                    message.content
                );

            }
        );

        scrollBottom();

    } catch (error) {

        addMessage(
            "assistant",
            "I couldn't load this chat."
        );
    }
}


/* ============================================================
   NEW CHAT
   ============================================================ */

async function createNewChat() {

    try {

        const data =
            await api(
                "/api/chats",
                {
                    method: "POST",
                }
            );

        currentChatId =
            data.chat.id;

        chats.unshift(
            data.chat
        );

        renderChatList();

        showWelcome();

        messageInput.focus();

    } catch (error) {

        alert(
            error.message
        );
    }
}


/* ============================================================
   WELCOME
   ============================================================ */

function showWelcome() {

    messagesEl.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-logo">A</div>

            <h1>
                How can I help?
            </h1>

            <p>
                Ask questions, upload images,
                or use your voice.
            </p>
        </div>

        <div class="typing" id="typing">
            AskOra is thinking...
        </div>
    `;

    typingEl =
        document.getElementById(
            "typing"
        );
}


/* ============================================================
   ADD MESSAGE
   ============================================================ */

function addMessage(
    role,
    content
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        `message ${role}`;

    const avatar =
        role === "assistant"
            ? "A"
            : "You";

    const name =
        role === "assistant"
            ? "AskOra"
            : "You";

    message.innerHTML = `
        <div class="avatar">
            ${avatar}
        </div>

        <div class="message-body">

            <div class="message-name">
                ${name}
            </div>

            <div class="content">
                ${renderMarkdown(content)}
            </div>

        </div>
    `;

    messagesEl.appendChild(
        message
    );

    attachCopyButtons(
        message
    );

    scrollBottom();
}


/* ============================================================
   MARKDOWN RENDERER
   ============================================================ */

function renderMarkdown(
    text
) {

    if (!text) {
        return "";
    }

    let escaped =
        escapeHtml(text);

    const codeBlocks = [];

    escaped =
        escaped.replace(
            /```([\s\S]*?)```/g,
            function(
                match,
                code
            ) {

                const cleaned =
                    code
                        .replace(
                            /^\w+\n/,
                            ""
                        )
                        .trim();

                const index =
                    codeBlocks.length;

                codeBlocks.push(
                    cleaned
                );

                return `@@CODE${index}@@`;
            }
        );

    escaped =
        escaped.replace(
            /^### (.+)$/gm,
            "<h3>$1</h3>"
        );

    escaped =
        escaped.replace(
            /^## (.+)$/gm,
            "<h2>$1</h2>"
        );

    escaped =
        escaped.replace(
            /^# (.+)$/gm,
            "<h1>$1</h1>"
        );

    escaped =
        escaped.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );

    escaped =
        escaped.replace(
            /__(.+?)__/g,
            "<strong>$1</strong>"
        );

    escaped =
        escaped.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

    escaped =
        escaped.replace(
            /^\> (.+)$/gm,
            "<blockquote>$1</blockquote>"
        );

    escaped =
        escaped.replace(
            /^\- (.+)$/gm,
            "<li>$1</li>"
        );

    escaped =
        escaped.replace(
            /^(\d+)\. (.+)$/gm,
            "<li>$2</li>"
        );

    escaped =
        escaped.replace(
            /(<li>.*<\/li>\n?)+/g,
            "<ul>$&</ul>"
        );

    escaped =
        escaped.replace(
            /\n{2,}/g,
            "</p><p>"
        );

    escaped =
        "<p>" +
        escaped +
        "</p>";

    escaped =
        escaped.replace(
            /<p>(<h[1-3]>)/g,
            "$1"
        );

    escaped =
        escaped.replace(
            /(<\/h[1-3]>)<\/p>/g,
            "$1"
        );

    escaped =
        escaped.replace(
            /<p>(<blockquote>)/g,
            "$1"
        );

    escaped =
        escaped.replace(
            /(<\/blockquote>)<\/p>/g,
            "$1"
        );

    escaped =
        escaped.replace(
            /<p>(<ul>)/g,
            "$1"
        );

    escaped =
        escaped.replace(
            /(<\/ul>)<\/p>/g,
            "$1"
        );

    codeBlocks.forEach(
        (
            code,
            index
        ) => {

            const codeHtml =
                escapeHtml(code);

            const block = `
                <div class="code-wrap">

                    <div class="code-head">

                        <span>
                            Code
                        </span>

                        <button
                            class="copy-code"
                            data-code="${encodeURIComponent(code)}"
                        >
                            Copy
                        </button>

                    </div>

                    <pre><code>${codeHtml}</code></pre>

                </div>
            `;

            escaped =
                escaped.replace(
                    `@@CODE${index}@@`,
                    block
                );
        }
    );

    return escaped;
}


/* ============================================================
   COPY CODE
   ============================================================ */

function attachCopyButtons(
    container
) {

    container
        .querySelectorAll(
            ".copy-code"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const code =
                            decodeURIComponent(
                                button.dataset.code
                            );

                        try {

                            await navigator.clipboard.writeText(
                                code
                            );

                            button.textContent =
                                "Copied!";

                            setTimeout(
                                () => {
                                    button.textContent =
                                        "Copy";
                                },
                                1200
                            );

                        } catch {
                            button.textContent =
                                "Copy failed";
                        }

                    }
                );

            }
        );
}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

composer.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const message =
            messageInput.value.trim();

        if (
            !message &&
            !selectedImage
        ) {
            return;
        }

        const formData =
            new FormData();

        formData.append(
            "message",
            message
        );

        if (currentChatId) {

            formData.append(
                "chat_id",
                currentChatId
            );
        }

        if (selectedImage) {

            formData.append(
                "image",
                selectedImage
            );
        }

        const visibleMessage =
            selectedImage
                ? (
                    message
                        ? `${message}\n\n🖼️ Image attached`
                        : "🖼️ Image attached"
                )
                : message;

        addMessage(
            "user",
            visibleMessage
        );

        messageInput.value = "";

        clearSelectedImage();

        sendBtn.disabled = true;

        typingEl.classList.add(
            "show"
        );

        try {

            const data =
                await api(
                    "/api/chat",
                    {
                        method: "POST",
                        body: formData,
                    }
                );

            currentChatId =
                data.chat_id;

            addMessage(
                "assistant",
                data.answer
            );

            await loadChats();

        } catch (error) {

            addMessage(
                "assistant",
                `Sorry, ${error.message}`
            );

        } finally {

            sendBtn.disabled = false;

            typingEl.classList.remove(
                "show"
            );

            messageInput.focus();
        }

    }
);

attachBtn.addEventListener(

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];

        if (!file) {
            return;
        }

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Please select an image."
            );

            imageInput.value = "";

            return;
        }

        if (
            file.size >
            20 * 1024 * 1024
        ) {

            alert(
                "Image must be 20 MB or smaller."
            );

            imageInput.value = "";

            return;
        }

        selectedImage =
            file;

        previewImage.src =
            URL.createObjectURL(
                file
            );

        imagePreview.classList.add(
            "show"
        );

        messageInput.focus();
    }
);


removeImage.addEventListener(
    "click",
    clearSelectedImage
);


function clearSelectedImage() {

    selectedImage = null;

    imageInput.value = "";

    previewImage.src = "";

    imagePreview.classList.remove(
        "show"
    );
}


/* ============================================================
   VOICE
   ============================================================ */

micBtn.addEventListener(
    "click",
    startRecording
);


stopRecord.addEventListener(
    "click",
    stopRecording
);


async function startRecording() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    audio: true
                }
            );

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(
                stream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }
            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType
                                || "audio/webm"
                        }
                    );

                await sendVoice(
                    blob
                );
            };

        mediaRecorder.start();

        recordingEl.classList.add(
            "active"
        );

        micBtn.style.display =
            "none";

        messageInput.style.display =
            "none";

        recordingSeconds = 0;

        recordTime.textContent =
            "00:00";

        recordingTimer =
            setInterval(
                () => {

                    recordingSeconds++;

                    const minutes =
                        String(
                            Math.floor(
                                recordingSeconds /
                                60
                            )
                        ).padStart(
                            2,
                            "0"
                        );

                    const seconds =
                        String(
                            recordingSeconds %
                            60
                        ).padStart(
                            2,
                            "0"
                        );

                    recordTime.textContent =
                        `${minutes}:${seconds}`;

                },
                1000
            );

    } catch (error) {

        alert(
            "Microphone access was not allowed."
        );
    }
}


function stopRecording() {

    if (
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ) {
        return;
    }

    clearInterval(
        recordingTimer
    );

    mediaRecorder.stop();

    recordingEl.classList.remove(
        "active"
    );

    micBtn.style.display =
        "grid";

    messageInput.style.display =
        "block";
}


async function sendVoice(
    blob
) {

    const formData =
        new FormData();

    formData.append(
        "audio",
        blob,
        "recording.webm"
    );

    if (currentChatId) {

        formData.append(
            "chat_id",
            currentChatId
        );
    }

    typingEl.classList.add(
        "show"
    );

    try {

        const data =
            await api(
                "/api/voice",
                {
                    method: "POST",
                    body: formData,
                }
            );

        currentChatId =
            data.chat_id;

        addMessage(
            "user",
            data.transcription
        );

        addMessage(
            "assistant",
            data.answer
        );

        await loadChats();

    } catch (error) {

        addMessage(
            "assistant",
            `Sorry, ${error.message}`
        );

    } finally {

        typingEl.classList.remove(
            "show"
        );
    }
}

/* ============================================================
   HELPERS
   ============================================================ */

function scrollBottom() {

    messagesEl.scrollTop =
        messagesEl.scrollHeight;
}


function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
