<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>AskOra</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background: #080B18;
            color: #F5F7FF;
        }

        body {
            position: relative;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(59, 130, 246, 0.18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(124, 58, 237, 0.18),
                    transparent 30%
                ),
                #080B18;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.28;
        }

        .orb.one {
            width: 180px;
            height: 180px;
            background: #3B82F6;
            top: -70px;
            left: -50px;
        }

        .orb.two {
            width: 220px;
            height: 220px;
            background: #7C3AED;
            right: -80px;
            top: 180px;
        }

        .orb.three {
            width: 180px;
            height: 180px;
            background: #2563EB;
            bottom: -80px;
            left: 20%;
        }

        /* =========================
           APP
        ========================= */

        .app {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(12px + env(safe-area-inset-top))
                16px
                12px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.07);

            background:
                rgba(8, 11, 24, 0.78);

            backdrop-filter: blur(20px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 43px;
            height: 43px;
            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-weight: 900;

            background:
                linear-gradient(
                    145deg,
                    rgba(59, 130, 246, 0.95),
                    rgba(124, 58, 237, 0.95)
                );

            box-shadow:
                0 8px 30px
                rgba(59, 130, 246, 0.25);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
        }

        .brand-tagline {
            margin-top: 2px;
            color: #9CA3AF;
            font-size: 11px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;

            color: #9CA3AF;
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22C55E;

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.7);
        }

        /* =========================
           BUTTONS
        ========================= */

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 12px;

            color: #F5F7FF;
            background:
                rgba(255, 255, 255, 0.07);

            font-size: 17px;
            cursor: pointer;
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;
            overflow-y: auto;

            padding:
                20px
                15px
                18px;

            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar {
            width: 0;
        }

        .welcome {
            max-width: 430px;
            margin: 28px auto 25px;
            text-align: center;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 17px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 39px;
            font-weight: 900;

            background:
                linear-gradient(
                    145deg,
                    #3B82F6,
                    #7C3AED
                );

            box-shadow:
                0 18px 50px
                rgba(59, 130, 246, 0.22);
        }

        .welcome h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: -0.7px;
        }

        .welcome p {
            margin: 9px auto 0;
            max-width: 320px;

            color: #9CA3AF;
            line-height: 1.55;
            font-size: 14px;
        }

        .welcome-card {
            margin-top: 20px;
            padding: 15px;

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 17px;

            background:
                rgba(255, 255, 255, 0.045);

            text-align: left;
        }

        .welcome-card-title {
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .suggestions {
            display: grid;
            gap: 8px;
        }

        .suggestion {
            border: 0;
            border-radius: 11px;
            padding: 11px;

            color: #DDE4FF;
            text-align: left;
            background:
                rgba(255, 255, 255, 0.055);

            cursor: pointer;
        }

        .suggestion:active {
            transform: scale(0.98);
        }

        /* =========================
           MESSAGES
        ========================= */

        .message-row {
            display: flex;
            margin: 9px 0;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message {
            max-width: 87%;

            padding:
                11px 13px;

            border-radius: 16px;

            line-height: 1.55;
            font-size: 14px;

            overflow-wrap: anywhere;
        }

        .message.user {
            background:
                linear-gradient(
                    135deg,
                    #2563EB,
                    #4F46E5
                );

            border-bottom-right-radius: 5px;
        }

        .message.assistant {
            background:
                rgba(255, 255, 255, 0.065);

            border:
                1px solid
                rgba(255, 255, 255, 0.065);

            border-bottom-left-radius: 5px;
        }

        .message p {
            margin: 0 0 8px;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message ul,
        .message ol {
            margin:
                7px 0
                7px 20px;

            padding: 0;
        }

        .message li {
            margin: 4px 0;
        }

        .message strong {
            color: #FFFFFF;
        }

        .message code {
            padding: 2px 5px;
            border-radius: 5px;
            background:
                rgba(0, 0, 0, 0.28);
            font-family: monospace;
        }

        .message pre {
            overflow-x: auto;
            padding: 11px;
            border-radius: 10px;
            background: #070A13;
        }

        /* =========================
           THINKING
        ========================= */

        .thinking {
            display: none;
            align-items: center;
            gap: 9px;

            width: fit-content;

            margin: 10px 0;

            padding: 10px 13px;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.055);

            color: #9CA3AF;
            font-size: 12px;
        }

        .thinking.show {
            display: flex;
        }

        .dots {
            display: flex;
            gap: 3px;
        }

        .dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #9CA3AF;

            animation:
                bounce 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-area {
            flex-shrink: 0;

            padding:
                9px 12px
                calc(9px + env(safe-area-inset-bottom));

            background:
                linear-gradient(
                    to top,
                    rgba(8, 11, 24, 0.98),
                    rgba(8, 11, 24, 0.82)
                );

            border-top:
                1px solid
                rgba(255, 255, 255, 0.06);
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 7px;

            max-width: 800px;
            margin: auto;
        }

        .input-wrap {
            flex: 1;

            display: flex;
            align-items: flex-end;

            min-height: 48px;

            padding:
                5px 6px 5px 13px;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 17px;

            background:
                rgba(255, 255, 255, 0.055);
        }

        textarea {
            flex: 1;

            width: 100%;
            max-height: 120px;

            resize: none;
            border: 0;
            outline: none;

            padding:
                8px 4px;

            background: transparent;
            color: #F5F7FF;

            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;
        }

        textarea::placeholder {
            color: #71788D;
        }

        .send-btn,
        .mic-btn {
            width: 39px;
            height: 39px;

            flex-shrink: 0;

            border: 0;
            border-radius: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
        }

        .send-btn {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #7C3AED
                );
        }

        .mic-btn {
            color: #D8DEEF;
            background:
                rgba(255, 255, 255, 0.06);
        }

        .send-btn:active,
        .mic-btn:active {
            transform: scale(0.93);
        }

        .mic-btn.recording {
            background:
                rgba(239, 68, 68, 0.2);

            color: #F87171;
        }

        .footer {
            text-align: center;
            color: #555D73;
            font-size: 9px;
            margin-top: 5px;
        }

        /* =========================
           INVITE POPUP
        ========================= */

        .toast {
            position: fixed;
            z-index: 20;

            left: 50%;
            bottom: 95px;

            transform:
                translate(-50%, 20px);

            opacity: 0;
            pointer-events: none;

            padding: 10px 15px;

            border-radius: 12px;

            background:
                rgba(25, 30, 50, 0.95);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            color: #F5F7FF;
            font-size: 12px;

            transition:
                opacity 0.2s,
                transform 0.2s;
        }

        .toast.show {
            opacity: 1;
            transform:
                translate(-50%, 0);
        }

        @media (min-width: 700px) {
            .chat {
                padding-left: 25%;
                padding-right: 25%;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>
                <div class="brand-name">
                    AskOra
                </div>

                <div class="brand-tagline">
                    Ask. Get answers.
                </div>
            </div>

        </div>

        <div class="header-actions">

            <button
                class="icon-btn"
                id="inviteBtn"
                title="Invite"
            >
                ✨
            </button>

            <button
                class="icon-btn"
                id="clearBtn"
                title="Clear"
            >
                ↻
            </button>

        </div>

    </header>


    <!-- CHAT -->
    <main
        class="chat"
        id="chat"
    >

        <section
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                A
            </div>

            <h1>
                Welcome to AskOra
            </h1>

            <p>
                Your simple AI assistant on Telegram.
                Ask anything and get a clear answer.
            </p>

            <div class="welcome-card">

                <div class="welcome-card-title">
                    Try asking
                </div>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-question="Explain artificial intelligence in simple terms."
                    >
                        🤖 Explain AI simply
                    </button>

                    <button
                        class="suggestion"
                        data-question="Help me understand something I'm learning."
                    >
                        📚 Help me learn
                    </button>

                    <button
                        class="suggestion"
                        data-question="Give me an interesting fact."
                    >
                        💡 Give me an interesting fact
                    </button>

                </div>

            </div>

        </section>

        <div id="messages"></div>

        <div
            class="thinking"
            id="thinking"
        >

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            AskOra is thinking

        </div>

    </main>


    <!-- COMPOSER -->
    <section class="composer-area">

        <div class="composer">

            <div class="input-wrap">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ask AskOra anything..."
                ></textarea>

                <button
                    class="mic-btn"
                    id="micBtn"
                    title="Voice"
                >
                    🎤
                </button>

            </div>

            <button
                class="send-btn"
                id="sendBtn"
                title="Send"
            >
                ➤
            </button>

        </div>

        <div class="footer">
            AskOra • Advanced AI, made simple.
        </div>

    </section>

</div>


<div
    class="toast"
    id="toast"
>
    Copied!
</div>


<script>
    // ========================================================
    // TELEGRAM
    // ========================================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ========================================================
    // ELEMENTS
    // ========================================================

    const chat = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const thinking = document.getElementById("thinking");

    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    const inviteBtn = document.getElementById("inviteBtn");
    const clearBtn = document.getElementById("clearBtn");

    const toast = document.getElementById("toast");


    // ========================================================
    // HELPERS
    // ========================================================

    function escapeHtml(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    function markdown(text) {

        let html = escapeHtml(text);

        // Code blocks
        html = html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );

        // Inline code
        html = html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

        // Bold
        html = html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

        // Italic
        html = html.replace(
            /(^|[^*])\*([^*]+)\*/g,
            "$1<em>$2</em>"
        );

        // Headings
        html = html.replace(
            /^### (.*)$/gm,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /^## (.*)$/gm,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /^# (.*)$/gm,
            "<strong>$1</strong>"
        );

        // Unordered lists
        html = html.replace(
            /(?:^|\n)[-*] (.*)(?=\n|$)/g,
            "\n<li>$1</li>"
        );

        html = html.replace(
            /(<li>.*<\/li>)/gs,
            "<ul>$1</ul>"
        );

        // Paragraphs
        html = html
            .split(/\n\n+/)
            .map(block => {

                if (
                    block.startsWith("<pre>") ||
                    block.startsWith("<ul>")
                ) {
                    return block;
                }

                return "<p>" +
                    block.replace(/\n/g, "<br>") +
                    "</p>";
            })
            .join("");

        return html;
    }


    function scrollBottom() {

        setTimeout(() => {

            chat.scrollTo({
                top: chat.scrollHeight,
                behavior: "smooth"
            });

        }, 50);
    }


    function showToast(text) {

        toast.textContent = text;

        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 1800);
    }


    function setThinking(value) {

        if (value) {
            thinking.classList.add("show");
        } else {
            thinking.classList.remove("show");
        }

        scrollBottom();
    }


    function addMessage(
        role,
        text
    ) {

        welcome.style.display = "none";

        const row =
            document.createElement("div");

        row.className =
            "message-row " + role;

        const bubble =
            document.createElement("div");

        bubble.className =
            "message " + role;

        if (role === "assistant") {
            bubble.innerHTML =
                markdown(text);
        } else {
            bubble.textContent = text;
        }

        row.appendChild(bubble);

        messages.appendChild(row);

        scrollBottom();
    }


    // ========================================================
    // API
    // ========================================================

    async function api(
        url,
        options = {}
    ) {

        const headers = {
            ...(options.headers || {}),
            "X-Telegram-Init-Data":
                tg.initData || ""
        };

        return fetch(
            url,
            {
                ...options,
                headers
            }
        );
    }


    // ========================================================
    // SEND MESSAGE
    // ========================================================

    async function sendMessage(
        customText = null
    ) {

        const text =
            customText !== null
                ? customText.trim()
                : input.value.trim();

        if (!text) {
            return;
        }

        input.value = "";
        input.style.height = "auto";

        addMessage(
            "user",
            text
        );

        setThinking(true);

        sendBtn.disabled = true;

        try {

            const response =
                await api(
                    "/api/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message: text
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.ok) {

                throw new Error(
                    data.error ||
                    "Request failed."
                );
            }

            addMessage(
                "assistant",
                data.answer
            );

        } catch (error) {

            console.error(error);

            addMessage(
                "assistant",
                "⚠️ Sorry, something went wrong. Please try again."
            );

        } finally {

            setThinking(false);
            sendBtn.disabled = false;

            input.focus();
        }
    }


    // ========================================================
    // LOAD HISTORY
    // ========================================================

    async function loadHistory() {

        try {

            const response =
                await api(
                    "/api/history"
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.ok
            ) {
                return;
            }

            if (
                data.history &&
                data.history.length
            ) {

                welcome.style.display =
                    "none";

                data.history.forEach(
                    item => {

                        addMessage(
                            item.role === "user"
                                ? "user"
                                : "assistant",
                            item.content
                        );

                    }
                );
            }

        } catch (error) {

            console.error(
                "History error:",
                error
            );
        }
    }


    // ========================================================
    // CLEAR
    // ========================================================

    async function clearConversation() {

        try {

            const response =
                await api(
                    "/api/reset",
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.ok
            ) {
                throw new Error(
                    data.error ||
                    "Could not clear conversation."
                );
            }

            messages.innerHTML = "";

            welcome.style.display =
                "block";

            showToast(
                "Conversation cleared"
            );

        } catch (error) {

            console.error(error);

            showToast(
                "Could not clear conversation"
            );
        }
    }


    // ========================================================
    // INVITE
    // ========================================================

    function inviteFriend() {

        const url =
            "https://t.me/share/url" +
            "?url=" +
            encodeURIComponent(
                "https://t.me/askora_official_bot"
            ) +
            "&text=" +
            encodeURIComponent(
                "Try AskOra 🤖 — a free AI assistant on Telegram!"
            );

        if (
            tg.openTelegramLink
        ) {

            tg.openTelegramLink(
                url
            );

        } else {

            window.open(
                url,
                "_blank"
            );
        }
    }


    // ========================================================
    // TEXTAREA
    // ========================================================

    input.addEventListener(
        "input",
        () => {

            input.style.height =
                "auto";

            input.style.height =
                Math.min(
                    input.scrollHeight,
                    120
                ) + "px";
        }
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    sendBtn.addEventListener(
        "click",
        () => sendMessage()
    );


    clearBtn.addEventListener(
        "click",
        clearConversation
    );


    inviteBtn.addEventListener(
        "click",
        inviteFriend
    );


    // ========================================================
    // SUGGESTIONS
    // ========================================================

    document
        .querySelectorAll(".suggestion")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    sendMessage(
                        button.dataset.question
                    );
                }
            );

        });


    // ========================================================
    // VOICE RECORDING
    // ========================================================

    let mediaRecorder = null;
    let audioChunks = [];
    let recording = false;


    async function startRecording() {

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(
                    stream
                );

            mediaRecorder.ondataavailable =
                event => {

                    if (
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );
                    }
                };

            mediaRecorder.onstop =
                async () => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    "audio/webm"
                            }
                        );

                    await sendVoice(
                        blob
                    );
                };

            mediaRecorder.start();

            recording = true;

            micBtn.classList.add(
                "recording"
            );

            micBtn.textContent =
                "⏹";

            showToast(
                "Recording..."
            );

        } catch (error) {

            console.error(error);

            showToast(
                "Microphone permission is needed"
            );
        }
    }


    function stopRecording() {

        if (
            mediaRecorder &&
            recording
        ) {

            mediaRecorder.stop();

            recording = false;

            micBtn.classList.remove(
                "recording"
            );

            micBtn.textContent =
                "🎤";

            showToast(
                "Processing voice..."
            );
        }
    }


    async function sendVoice(blob) {

        addMessage(
            "user",
            "🎤 Voice message"
        );

        setThinking(true);

        try {

            const formData =
                new FormData();

            formData.append(
                "audio",
                blob,
                "voice.webm"
            );

            const response =
                await api(
                    "/api/voice",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.ok
            ) {

                throw new Error(
                    data.error ||
                    "Voice request failed."
                );
            }

            addMessage(
                "assistant",
                data.answer
            );

        } catch (error) {

            console.error(error);

            addMessage(
                "assistant",
                "⚠️ Sorry, I couldn't process that voice message."
            );

        } finally {

            setThinking(false);
        }
    }


    micBtn.addEventListener(
        "click",
        () => {

            if (recording) {
                stopRecording();
            } else {
                startRecording();
            }

        }
    );


    // ========================================================
    // START
    // ========================================================

    loadHistory();

    input.focus();

</script>

</body>
</html>
