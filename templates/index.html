<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080B18"
    >

    <title>AskOra — Ask. Get answers.</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(59,130,246,.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(124,58,237,.16),
                    transparent 30%
                ),
                #080B18;

            color: #F5F7FF;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            border-bottom: 1px solid rgba(255,255,255,.08);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            backdrop-filter: blur(20px);

            position: sticky;
            top: 0;
            z-index: 20;

            background: rgba(8,11,24,.78);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #7C3AED
                );

            box-shadow:
                0 0 25px rgba(59,130,246,.35);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
        }

        .brand-tagline {
            color: #9CA3AF;
            font-size: 11px;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .small-btn {
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            color: #F5F7FF;

            padding: 9px 12px;
            border-radius: 10px;

            cursor: pointer;
        }

        .small-btn:hover {
            background: rgba(255,255,255,.1);
        }

        main {
            width: min(900px, 100%);
            margin: auto;
            padding: 28px 16px 120px;
            flex: 1;
        }

        .welcome {
            text-align: center;
            padding: 45px 15px 30px;
        }

        .welcome h1 {
            font-size: clamp(30px, 8vw, 52px);
            line-height: 1.05;
            margin-bottom: 14px;

            background:
                linear-gradient(
                    135deg,
                    #F5F7FF,
                    #8BB9FF,
                    #B28AFF
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            color: #9CA3AF;
            font-size: 15px;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 82%;
            padding: 13px 15px;

            border-radius: 18px;

            line-height: 1.55;
            font-size: 15px;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #2563EB,
                    #4F46E5
                );

            border-bottom-right-radius: 5px;
        }

        .assistant .bubble {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.07);

            border-bottom-left-radius: 5px;
        }

        .thinking {
            display: none;
            align-items: center;
            gap: 8px;

            color: #9CA3AF;
            font-size: 13px;

            margin: 15px 5px;
        }

        .thinking.show {
            display: flex;
        }

        .dots {
            display: flex;
            gap: 4px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #7C3AED;

            animation: bounce 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        .composer-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            padding: 12px 15px 15px;

            background:
                linear-gradient(
                    to top,
                    #080B18 65%,
                    transparent
                );

            z-index: 30;
        }

        .composer {
            width: min(900px, 100%);
            margin: auto;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px;

            border-radius: 18px;

            background: rgba(16,21,43,.94);

            border: 1px solid rgba(255,255,255,.1);

            box-shadow:
                0 10px 40px rgba(0,0,0,.35);
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #F5F7FF;

            padding: 11px 8px;

            font-size: 15px;
        }

        #messageInput::placeholder {
            color: #6B7280;
        }

        .action-btn {
            width: 42px;
            height: 42px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,.08);

            background: rgba(255,255,255,.06);

            color: #F5F7FF;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(255,255,255,.11);
        }

        .send-btn {
            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #7C3AED
                );

            border: none;
        }

        .send-btn:hover {
            opacity: .9;
        }

        .recording {
            background: #DC2626 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 0 0 7px rgba(220,38,38,.15);
            }
        }

        .footer {
            text-align: center;
            color: #6B7280;
            font-size: 11px;
            margin-top: 25px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;

            transform:
                translateX(-50%)
                translateY(20px);

            opacity: 0;

            background: #151A31;
            border: 1px solid rgba(255,255,255,.1);

            color: #F5F7FF;

            padding: 11px 15px;

            border-radius: 12px;

            font-size: 13px;

            transition: .25s;

            z-index: 100;
        }

        .toast.show {
            transform:
                translateX(-50%)
                translateY(0);

            opacity: 1;
        }

        @media (max-width: 600px) {

            header {
                padding: 0 13px;
            }

            .brand-tagline {
                display: none;
            }

            .small-btn {
                padding: 8px 9px;
            }

            main {
                padding-left: 10px;
                padding-right: 10px;
            }

            .bubble {
                max-width: 90%;
            }

            .welcome {
                padding-top: 35px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>

                <div class="brand-name">
                    AskOra
                </div>

                <div class="brand-tagline">
                    Ask. Get answers.
                </div>

            </div>

        </div>

        <div class="header-actions">

            <button
                class="small-btn"
                onclick="clearChat()"
            >
                Clear
            </button>

            <button
                class="small-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <main>

        <section
            class="welcome"
            id="welcome"
        >

            <h1>
                Ask anything.
            </h1>

            <p>
                Advanced AI, made simple.
            </p>

        </section>


        <section
            class="messages"
            id="messages"
        ></section>


        <div
            class="thinking"
            id="thinking"
        >

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            AskOra is thinking...

        </div>


        <div class="footer">
            AskOra • Free AI assistant
        </div>

    </main>


    <div class="composer-wrap">

        <div class="composer">

            <input
                id="messageInput"
                type="text"
                autocomplete="off"
                placeholder="Ask AskOra anything..."
            >

            <button
                class="action-btn"
                id="micButton"
                title="Voice"
            >
                🎙️
            </button>

            <button
                class="action-btn send-btn"
                id="sendButton"
                title="Send"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

const csrfToken =
    "{{ csrf_token }}";

const messagesBox =
    document.getElementById("messages");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const thinking =
    document.getElementById("thinking");

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}


function addMessage(role, content) {

    welcome.style.display = "none";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        content;

    wrapper.appendChild(bubble);

    messagesBox.appendChild(wrapper);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


function setThinking(value) {

    if (value) {
        thinking.classList.add("show");
    } else {
        thinking.classList.remove("show");
    }
}


async function loadHistory() {

    try {

        const response =
            await fetch("/api/history");

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        messagesBox.innerHTML = "";

        if (!data.messages.length) {

            welcome.style.display = "block";

            return;
        }

        welcome.style.display = "none";

        for (const message of data.messages) {

            addMessage(
                message.role,
                message.content
            );
        }

    } catch (error) {

        console.error(error);

    }
}


async function sendMessage() {

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    input.value = "";

    addMessage(
        "user",
        message
    );

    setThinking(true);

    sendButton.disabled = true;

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-CSRF-Token":
                            csrfToken
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.error ||
                "Something went wrong."
            );
        }

        addMessage(
            "assistant",
            data.answer
        );

    } catch (error) {

        addMessage(
            "assistant",
            "⚠️ " + error.message
        );

    } finally {

        setThinking(false);

        sendButton.disabled = false;

        input.focus();
    }
}


async function clearChat() {

    if (!confirm(
        "Clear your conversation?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/reset",
                {
                    method: "POST",

                    headers: {
                        "X-CSRF-Token":
                            csrfToken
                    }
                }
            );

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(
                data.error
            );
        }

        messagesBox.innerHTML = "";

        welcome.style.display =
            "block";

        showToast(
            "Conversation cleared."
        );

    } catch (error) {

        showToast(
            error.message
        );
    }
}


async function logout() {

    const form =
        document.createElement("form");

    form.method = "POST";
    form.action = "/logout";

    const token =
        document.createElement("input");

    token.type = "hidden";
    token.name = "csrf_token";
    token.value = csrfToken;

    form.appendChild(token);

    document.body.appendChild(form);

    form.submit();
}


async function startRecording() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        showToast(
            "Voice recording isn't supported here."
        );

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(stream);

        mediaRecorder.ondataavailable =
            event => {

                if (event.data.size > 0) {
                    audioChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(track => track.stop());

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                await sendVoice(blob);
            };

        mediaRecorder.start();

        isRecording = true;

        micButton.classList.add(
            "recording"
        );

        showToast(
            "Recording... tap 🎙️ again to stop."
        );

    } catch (error) {

        showToast(
            "Microphone permission was denied."
        );
    }
}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

        isRecording = false;

        micButton.classList.remove(
            "recording"
        );

        setThinking(true);
    }
}


async function sendVoice(blob) {

    const formData =
        new FormData();

    formData.append(
        "audio",
        blob,
        "askora-recording.webm"
    );

    try {

        const response =
            await fetch(
                "/api/voice",
                {
                    method: "POST",

                    headers: {
                        "X-CSRF-Token":
                            csrfToken
                    },

                    body: formData
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.error ||
                "Voice processing failed."
            );
        }

        addMessage(
            "user",
            "🎙️ " + data.transcript
        );

        addMessage(
            "assistant",
            data.answer
        );

    } catch (error) {

        addMessage(
            "assistant",
            "⚠️ " + error.message
        );

    } finally {

        setThinking(false);
    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


micButton.addEventListener(
    "click",
    () => {

        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
        }
    }
);


loadHistory();

input.focus();

</script>

</body>
</html>
