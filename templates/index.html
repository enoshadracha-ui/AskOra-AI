<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>AskOra — Ask. Get answers.</title>

    <meta
        name="description"
        content="AskOra is your simple, fast and friendly AI assistant."
    >

    <style>
        :root {
            --bg: #080b18;
            --panel: #10152b;
            --panel-2: #141a33;
            --border: rgba(255,255,255,.08);
            --text: #f5f7ff;
            --muted: #9ca3af;
            --blue: #3b82f6;
            --violet: #7c3aed;
            --danger: #ef4444;
            --success: #22c55e;
            --shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(124,58,237,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(59,130,246,.10),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 280px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(10,14,30,.96);
            border-right: 1px solid var(--border);
            position: relative;
            z-index: 50;
        }

        .brand {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 22px;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 8px 25px rgba(59,130,246,.25);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .sidebar-content {
            flex: 1;
            min-height: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
        }

        .new-chat-btn {
            width: 100%;
            border: 1px solid rgba(59,130,246,.35);
            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,.18),
                    rgba(124,58,237,.18)
                );
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(59,130,246,.65);
        }

        .search-box {
            margin-top: 12px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.035);
            color: var(--text);
            outline: none;
            border-radius: 10px;
            padding: 10px 12px 10px 36px;
        }

        .search-box span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .section-title {
            margin: 18px 4px 8px;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 700;
        }

        .chat-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 3px;
        }

        .chat-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 4px;
            text-align: left;
            transition: .15s;
        }

        .chat-item:hover {
            background: rgba(255,255,255,.045);
        }

        .chat-item.active {
            background: rgba(59,130,246,.10);
            border-color: rgba(59,130,246,.18);
        }

        .chat-item-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .chat-delete {
            opacity: 0;
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 4px;
        }

        .chat-item:hover .chat-delete {
            opacity: 1;
        }

        .chat-delete:hover {
            color: var(--danger);
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding: 12px;
        }

        .account-card {
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 11px;
            margin-bottom: 10px;
        }

        .account-name {
            font-weight: 700;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-email {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bottom-actions {
            display: grid;
            gap: 5px;
        }

        .side-action {
            width: 100%;
            padding: 9px 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 9px;
            text-align: left;
        }

        .side-action:hover {
            background: rgba(255,255,255,.04);
            color: var(--text);
        }

        .side-action.danger:hover {
            color: var(--danger);
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 68px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: rgba(8,11,24,.88);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            z-index: 20;
        }

        .mobile-menu {
            display: none;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 22px;
        }

        .topbar-brand {
            min-width: 0;
        }

        .topbar-title {
            font-weight: 800;
            font-size: 16px;
        }

        .topbar-subtitle {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .online {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px rgba(34,197,94,.7);
        }

        /* =========================
           CHAT AREA
        ========================= */

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 30px 20px 140px;
        }

        .messages-inner {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .welcome {
            min-height: calc(100vh - 230px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-inner {
            max-width: 620px;
        }

        .welcome-logo {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
            font-size: 34px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 15px 50px rgba(59,130,246,.22);
        }

        .welcome h1 {
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            animation: messageIn .2s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 800;
            background: var(--panel-2);
            border: 1px solid var(--border);
        }

        .message.user .avatar {
            order: 2;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
        }

        .bubble {
            max-width: min(760px, 82%);
            border-radius: 15px;
            padding: 12px 15px;
            line-height: 1.6;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .message.assistant .bubble {
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
        }

        .message.user .bubble {
            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,.20),
                    rgba(124,58,237,.20)
                );
            border: 1px solid rgba(59,130,246,.20);
        }

        .bubble p {
            margin-bottom: 9px;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble ul,
        .bubble ol {
            margin: 7px 0 9px 20px;
        }

        .bubble li {
            margin: 4px 0;
        }

        .bubble code {
            background: rgba(0,0,0,.25);
            padding: 2px 5px;
            border-radius: 5px;
            font-size: .9em;
        }

        .bubble pre {
            margin: 10px 0;
            padding: 12px;
            overflow-x: auto;
            background: #070a14;
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .bubble pre code {
            background: transparent;
            padding: 0;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: typing .9s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: .25;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-wrap {
            position: fixed;
            left: 280px;
            right: 0;
            bottom: 0;
            padding: 16px 20px 20px;
            background:
                linear-gradient(
                    to top,
                    rgba(8,11,24,1) 50%,
                    rgba(8,11,24,.0)
                );
            z-index: 30;
        }

        .composer {
            width: min(900px, 100%);
            margin: 0 auto;
            background: rgba(16,21,43,.96);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 9px;
        }

        .composer textarea {
            flex: 1;
            min-width: 0;
            max-height: 160px;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            padding: 10px;
            line-height: 1.45;
        }

        .composer textarea::placeholder {
            color: #687086;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            display: grid;
            place-items: center;
            font-size: 18px;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,.05);
            color: var(--text);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 10px;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            display: grid;
            place-items: center;
            font-size: 17px;
        }

        .send-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .recording {
            display: none;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
        }

        .recording.active {
            display: flex;
        }

        .recording-pulse {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 0 0 rgba(239,68,68,.6);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 9px rgba(239,68,68,0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239,68,68,0);
            }
        }

        .recording-time {
            color: var(--muted);
            font-size: 13px;
            flex: 1;
        }

        .recording-stop,
        .recording-cancel {
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 12px;
        }

        .recording-stop {
            background: var(--blue);
            color: white;
        }

        .recording-cancel {
            background: rgba(255,255,255,.06);
            color: var(--muted);
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 95px;
            transform: translateX(-50%) translateY(15px);
            opacity: 0;
            pointer-events: none;
            background: #171c32;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            font-size: 13px;
            z-index: 100;
            transition: .2s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 40;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform .22s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-overlay.open {
                display: block;
            }

            .mobile-menu {
                display: block;
            }

            .composer-wrap {
                left: 0;
                padding: 10px;
            }

            .topbar {
                padding: 0 14px;
            }

            .messages {
                padding: 20px 12px 125px;
            }

            .bubble {
                max-width: 88%;
            }
        }

        @media (max-width: 500px) {
            .online {
                display: none;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .welcome p {
                font-size: 14px;
            }

            .bubble {
                font-size: 13px;
            }

            .composer {
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         MOBILE OVERLAY
    ========================== -->

    <div
        id="mobileOverlay"
        class="mobile-overlay"
        onclick="closeSidebar()"
    ></div>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside id="sidebar" class="sidebar">

        <div class="brand">
            <div class="logo">A</div>

            <div>
                <div class="brand-name">AskOra</div>
                <div class="brand-subtitle">Ask. Get answers.</div>
            </div>
        </div>

        <div class="sidebar-content">

            <button
                class="new-chat-btn"
                onclick="createNewChat()"
            >
                <span>＋</span>
                <span>New Chat</span>
            </button>

            <div class="search-box">
                <span>⌕</span>

                <input
                    id="chatSearch"
                    type="text"
                    placeholder="Search chats..."
                    autocomplete="off"
                >
            </div>

            <div class="section-title">
                Previous chats
            </div>

            <div
                id="chatList"
                class="chat-list"
            ></div>

        </div>

        <div class="sidebar-bottom">

            <div class="account-card">

                <div
                    id="accountName"
                    class="account-name"
                >
                    Loading...
                </div>

                <div
                    id="accountEmail"
                    class="account-email"
                >
                    Loading...
                </div>

            </div>

            <div class="bottom-actions">

                <button
                    id="adminButton"
                    class="side-action"
                    style="display:none"
                    onclick="window.location.href='/admin'"
                >
                    ⚙️ Admin Dashboard
                </button>

                <button
                    class="side-action"
                    onclick="logoutUser()"
                >
                    🚪 Logout
                </button>

                <button
                    class="side-action danger"
                    onclick="deleteAccount()"
                >
                    🗑️ Delete account
                </button>

            </div>

        </div>

    </aside>

    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <header class="topbar">

            <button
                class="mobile-menu"
                onclick="toggleSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="topbar-brand">

                <div class="topbar-title">
                    AskOra
                </div>

                <div class="topbar-subtitle">
                    Ask. Get answers.
                </div>

            </div>

            <div class="online">
                <span class="online-dot"></span>
                <span>Online</span>
            </div>

        </header>

        <section
            id="messages"
            class="messages"
        >

            <div
                id="messagesInner"
                class="messages-inner"
            >

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-inner">

                        <div class="welcome-logo">
                            A
                        </div>

                        <h1>
                            How can I help?
                        </h1>

                        <p>
                            Ask me anything. Get clear,
                            useful answers with AskOra.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- =========================
     COMPOSER
========================== -->

<div class="composer-wrap">

    <div class="composer">

        <div
            id="normalComposer"
            style="
                width:100%;
                display:flex;
                align-items:flex-end;
                gap:8px;
            "
        >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Ask AskOra anything..."
                autocomplete="off"
            ></textarea>

            <button
                id="micButton"
                class="icon-btn"
                title="Voice input"
                type="button"
                onclick="startRecording()"
            >
                🎙️
            </button>

            <button
                id="sendButton"
                class="send-btn"
                type="button"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div
            id="recordingBar"
            class="recording"
        >

            <span class="recording-pulse"></span>

            <span
                id="recordingTime"
                class="recording-time"
            >
                Recording 00:00
            </span>

            <button
                class="recording-cancel"
                type="button"
                onclick="cancelRecording()"
            >
                Cancel
            </button>

            <button
                class="recording-stop"
                type="button"
                onclick="stopRecording()"
            >
                Stop
            </button>

        </div>

    </div>

</div>

<div
    id="toast"
    class="toast"
></div>


<script>
"use strict";

/* =========================================================
   ASKORA FRONTEND
========================================================= */

let CSRF = "";
let currentUser = null;
let chats = [];
let currentChatId = null;
let isSending = false;
let isInitializing = false;

let mediaRecorder = null;
let mediaStream = null;
let recordedChunks = [];
let recordingStartedAt = null;
let recordingTimer = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}


function showToast(message) {
    const toast = $("toast");

    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2800);
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   SIMPLE MARKDOWN
========================================================= */

function renderMarkdown(text) {

    let html = escapeHtml(text);

    html = html.replace(
        /```([\s\S]*?)```/g,
        function(_, code) {
            return "<pre><code>" +
                code.trim() +
                "</code></pre>";
        }
    );

    html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );

    html = html.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^## (.*)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^# (.*)$/gm,
        "<h2>$1</h2>"
    );

    html = html.replace(
        /^\s*[-*] (.*)$/gm,
        "<li>$1</li>"
    );

    html = html.replace(
        /(<li>.*<\/li>)/gs,
        "<ul>$1</ul>"
    );

    html = html.replace(
        /\n{2,}/g,
        "</p><p>"
    );

    html = html.replace(
        /\n/g,
        "<br>"
    );

    return "<p>" + html + "</p>";
}


/* =========================================================
   API
========================================================= */

async function apiFetch(url, options = {}) {

    const config = {
        credentials: "same-origin",
        ...options,
        headers: {
            ...(options.headers || {})
        }
    };

    if (CSRF) {
        config.headers["X-CSRF-Token"] = CSRF;
    }

    let response;

    try {

        response = await fetch(url, config);

    } catch (error) {

        console.error("Network error:", error);

        throw new Error(
            "Unable to connect to AskOra."
        );
    }

    /*
       IMPORTANT:

       Do NOT redirect automatically on 401.

       Automatic redirects were causing the
       login -> home -> login refresh loop.

       Authentication is handled once during init().
    */

    if (response.status === 401) {
        throw new Error("AUTH_REQUIRED");
    }

    return response;
}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function checkAuthentication() {

    try {

        const response = await fetch(
            "/api/me",
            {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        if (!response.ok) {

            console.error(
                "Authentication check failed:",
                response.status
            );

            return false;
        }

        const data = await response.json();

        console.log(
            "AskOra authentication:",
            data.authenticated
        );

        if (
            data.authenticated === true &&
            data.user
        ) {

            CSRF = data.csrf_token || "";
            currentUser = data.user;

            return true;
        }

        return false;

    } catch (error) {

        console.error(
            "Authentication check error:",
            error
        );

        return false;
    }
}


/* =========================================================
   ACCOUNT UI
========================================================= */

function updateAccountUI() {

    if (!currentUser) return;

    $("accountName").textContent =
        currentUser.username || "User";

    $("accountEmail").textContent =

    }

/* =========================================================
   CHAT LIST
========================================================= */

async function loadChats() {

    const response = await apiFetch(
        "/api/chats"
    );

    if (!response.ok) {
        throw new Error(
            "Unable to load chats."
        );
    }

    const data = await response.json();

    chats = Array.isArray(data.chats)
        ? data.chats
        : [];

    renderChatList();
}


function renderChatList(filter = "") {

    const list = $("chatList");

    if (!list) return;

    const search = filter
        .trim()
        .toLowerCase();

    const filtered = chats.filter(chat => {

        if (!search) return true;

        return String(
            chat.title || ""
        )
            .toLowerCase()
            .includes(search);

    });

    if (!filtered.length) {

        list.innerHTML = `
            <div style="
                color:#687086;
                font-size:12px;
                padding:12px 8px;
            ">
                No chats found.
            </div>
        `;

        return;
    }

    list.innerHTML = filtered.map(chat => {

        const active =
            Number(chat.id) ===
            Number(currentChatId);

        return `
            <div
                class="chat-item ${active ? "active" : ""}"
                data-chat-id="${chat.id}"
            >

                <button
                    style="
                        flex:1;
                        min-width:0;
                        border:none;
                        background:none;
                        color:inherit;
                        text-align:left;
                    "
                    onclick="openChat(${chat.id})"
                >
                    <div class="chat-item-title">
                        ${escapeHtml(
                            chat.title ||
                            "New conversation"
                        )}
                    </div>
                </button>

                <button
                    class="chat-delete"
                    title="Delete chat"
                    onclick="
                        event.stopPropagation();
                        deleteChat(${chat.id});
                    "
                >
                    ×
                </button>

            </div>
        `;

    }).join("");
}


/* =========================================================
   CREATE / OPEN CHAT
========================================================= */

async function createOrLoadInitialChat() {

    if (chats.length > 0) {

        const newest = chats[0];

        await openChat(
            newest.id,
            false
        );

        return;
    }

    await createNewChat(false);
}


async function createNewChat(closeMobile = true) {

    try {

        const response = await apiFetch(
            "/api/chats",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    title: "New conversation"
                })
            }
        );

        if (!response.ok) {

            const text =
                await response.text();

            console.error(
                "Create chat failed:",
                text
            );

            throw new Error(
                "Unable to create chat."
            );
        }

        const data =
            await response.json();

        if (!data.chat) {
            throw new Error(
                "Invalid chat response."
            );
        }

        chats.unshift(data.chat);

        currentChatId =
            data.chat.id;

        renderChatList();

        clearMessages();

        if (closeMobile) {
            closeSidebar();
        }

        return data.chat;

    } catch (error) {

        console.error(error);

        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {
            showToast(
                "Your session has expired. Please log in again."
            );

            return;
        }

        showToast(
            error.message ||
            "Unable to create chat."
        );
    }
}


async function openChat(
    chatId,
    closeMobileMenu = true
) {

    try {

        currentChatId = chatId;

        renderChatList();

        const response =
            await apiFetch(
                `/api/chats/${chatId}/messages`
            );

        if (!response.ok) {
            throw new Error(
                "Unable to load conversation."
            );
        }

        const data =
            await response.json();

        clearMessages();

        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        if (!messages.length) {

            showWelcome();

        } else {

            messages.forEach(message => {

                addMessage(
                    message.role,
                    message.content
                );

            });
        }

        scrollToBottom();

        if (closeMobileMenu) {
            closeSidebar();
        }

    } catch (error) {

        console.error(error);

        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {
            showToast(
                "Your session has expired. Please log in again."
            );

            return;
        }

        showToast(
            error.message ||
            "Unable to load chat."
        );
    }
}


/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(chatId) {

    const confirmed =
        confirm(
            "Delete this conversation?"
        );

    if (!confirmed) return;

    try {

        const response =
            await apiFetch(
                `/api/chats/${chatId}`,
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Unable to delete chat."
            );
        }

        chats =
            chats.filter(
                chat =>
                    Number(chat.id) !==
                    Number(chatId)
            );

        if (
            Number(currentChatId) ===
            Number(chatId)
        ) {

            currentChatId = null;

            if (chats.length) {

                await openChat(
                    chats[0].id,
                    false
                );

            } else {

                await createNewChat(false);

            }
        }

        renderChatList();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Unable to delete chat."
        );
    }
}


/* =========================================================
   MESSAGE UI
========================================================= */

function clearMessages() {

    $("messagesInner").innerHTML = "";

}


function showWelcome() {

    $("messagesInner").innerHTML = `
        <div id="welcome" class="welcome">

            <div class="welcome-inner">

                <div class="welcome-logo">
                    A
                </div>

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask me anything. Get clear,
                    useful answers with AskOra.
                </p>

            </div>

        </div>
    `;
}


function addMessage(
    role,
    content
) {

    const welcome =
        $("welcome");

    if (welcome) {
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "U"
            : "A";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    if (role === "assistant") {

        bubble.innerHTML =
            renderMarkdown(content);

    } else {

        bubble.textContent =
            content;

    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    $("messagesInner")
        .appendChild(wrapper);

    scrollToBottom();

    return wrapper;
}


function addTypingMessage() {

    const welcome =
        $("welcome");

    if (welcome) {
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.id =
        "typingMessage";

    wrapper.className =
        "message assistant";

    wrapper.innerHTML = `
        <div class="avatar">A</div>

        <div class="bubble">

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    $("messagesInner")
        .appendChild(wrapper);

    scrollToBottom();

    return wrapper;
}


function scrollToBottom() {

    const messages =
        $("messages");

    if (!messages) return;

    requestAnimationFrame(() => {

        messages.scrollTop =
            messages.scrollHeight;

    });
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (isSending) return;

    const input =
        $("messageInput");

    const message =
        input.value.trim();

    if (!message) return;

    if (!currentChatId) {

        await createNewChat(false);

        if (!currentChatId) {
            return;
        }
    }

    isSending = true;

    $("sendButton").disabled = true;
    $("micButton").disabled = true;

    input.value = "";
    resizeTextarea();

    addMessage(
        "user",
        message
    );

    const typing =
        addTypingMessage();

    try {

        const response =
            await apiFetch(
                "/api/chat",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        chat_id:
                            currentChatId,
                        message:
                            message
                    })
                }
            );

        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Chat error:",
                errorText
            );

            throw new Error(
                "Unable to get a response."
            );
        }

        const data =
            await response.json();

        typing.remove();

        const answer =
            data.answer ||
            data.message ||
            "I couldn't generate a response.";

        addMessage(
            "assistant",
            answer
        );

        /*
           Update chat title if backend
           returns the updated chat.
        */

        if (data.chat) {

            const index =
                chats.findIndex(
                    chat =>
                        Number(chat.id) ===
                        Number(data.chat.id)
                );

            if (index >= 0) {
                chats[index] =
                    data.chat;
            } else {
                chats.unshift(
                    data.chat
                );
            }

            renderChatList();
        }

    } catch (error) {

        console.error(error);

        if (typing) {
            typing.remove();
        }

        if (
            error.message ===
            "AUTH_REQUIRED"
        ) {

            showToast(
                "Your session has expired. Please log in again."
            );

        } else {

            addMessage(
                "assistant",
                "Sorry, something went wrong while generating the response."
            );
        }

    } finally {

        isSending = false;

        $("sendButton").disabled =
            false;

        $("micButton").disabled =
            false;

        input.focus();
    }
}


/* =========================================================
   TEXTAREA
========================================================= */

function resizeTextarea() {

    const input =
        $("messageInput");

    input.style.height = "auto";

    input.style.height =
        Math.min(

        ) + "px";

/* =========================================================
   VOICE INPUT
========================================================= */

async function startRecording() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showToast(
            "Voice recording is not supported on this device."
        );

        return;
    }

    if (mediaRecorder) return;

    try {

        mediaStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        recordedChunks = [];

        mediaRecorder =
            new MediaRecorder(
                mediaStream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {
                    recordedChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async () => {

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                cleanupRecording();

                await sendVoice(
                    blob
                );
            };

        mediaRecorder.start();

        recordingStartedAt =
            Date.now();

        $("normalComposer")
            .style.display = "none";

        $("recordingBar")
            .classList.add("active");

        updateRecordingTimer();

        recordingTimer =
            setInterval(
                updateRecordingTimer,
                500
            );

    } catch (error) {

        console.error(error);

        cleanupRecording();

        showToast(
            "Microphone permission was not granted."
        );
    }
}


function updateRecordingTimer() {

    if (!recordingStartedAt)
        return;

    const elapsed =
        Math.floor(
            (Date.now() -
                recordingStartedAt) /
            1000
        );

    const minutes =
        String(
            Math.floor(elapsed / 60)
        ).padStart(2, "0");

    const seconds =
        String(
            elapsed % 60
        ).padStart(2, "0");

    $("recordingTime")
        .textContent =
        `Recording ${minutes}:${seconds}`;
}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();
    }
}


function cancelRecording() {

    if (mediaRecorder) {

        mediaRecorder.onstop = null;

        if (
            mediaRecorder.state !==
            "inactive"
        ) {
            mediaRecorder.stop();
        }
    }

    cleanupRecording();
}


function cleanupRecording() {

    clearInterval(
        recordingTimer
    );

    recordingTimer = null;

    recordingStartedAt = null;

    if (mediaStream) {

        mediaStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }

    mediaStream = null;
    mediaRecorder = null;
    recordedChunks = [];

    $("normalComposer")
        .style.display = "flex";

    $("recordingBar")
        .classList.remove("active");
}


async function sendVoice(blob) {

    if (!blob || !blob.size) {

        showToast(
            "No recording was captured."
        );

        return;
    }

    if (!currentChatId) {

        await createNewChat(false);

        if (!currentChatId)
            return;
    }

    const typing =
        addTypingMessage();

    try {

        const formData =
            new FormData();

        formData.append(
            "audio",
            blob,
            "voice.webm"
        );

        formData.append(
            "chat_id",
            String(currentChatId)
        );

        const response =
            await apiFetch(
                "/api/voice",
                {
                    method: "POST",
                    body: formData
                }
            );

        if (!response.ok) {

            throw new Error(
                "Voice request failed."
            );
        }

        const data =
            await response.json();

        typing.remove();

        if (data.transcript) {

            addMessage(
                "user",
                data.transcript
            );
        }

        addMessage(
            "assistant",
            data.answer ||
            "I couldn't process that voice message."
        );

        if (data.chat) {

            const index =
                chats.findIndex(
                    chat =>
                        Number(chat.id) ===
                        Number(data.chat.id)
                );

            if (index >= 0) {

                chats[index] =
                    data.chat;

            } else {

                chats.unshift(
                    data.chat
                );
            }

            renderChatList();
        }

    } catch (error) {

        console.error(error);

        if (typing) {
            typing.remove();
        }

        addMessage(
            "assistant",
            "Sorry, I couldn't process your voice message."
        );
    }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logoutUser() {

    try {

        const response =
            await fetch(
                "/logout",
                {
                    method: "GET",
                    credentials:
                        "same-origin"
                }
            );

        /*
           Do not manually redirect repeatedly.
           The server handles the final destination.
        */

        if (
            response.redirected
        ) {

            window.location.replace(
                response.url
            );

        } else {

            window.location.replace(
                "/login"
            );
        }

    } catch (error) {

        console.error(error);

        window.location.replace(
            "/login"
        );
    }
}


/* =========================================================
   DELETE ACCOUNT
========================================================= */

async function deleteAccount() {

    const first =
        confirm(
            "Are you sure you want to permanently delete your AskOra account?"
        );

    if (!first) return;

    const second =
        confirm(
            "This will delete your AskOra chats and account data. Continue?"
        );

    if (!second) return;

    try {

        const response =
            await apiFetch(
                "/api/account/delete",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({})
                }
            );

        if (!response.ok) {

            throw new Error(
                "Unable to delete account."
            );
        }

        window.location.replace(
            "/login"
        );

    } catch (error) {

        console.error(error);

        showToast(
            "Unable to delete your account."
        );
    }
}

/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {

    /*
       Prevent multiple initialization calls.
       This is important for avoiding duplicate
       requests and refresh loops.
    */

    if (isInitializing) {
        return;
    }

    isInitializing = true;

    try {

        /*
           FIRST:
           Check authentication exactly once.
        */

        const authenticated =
            await checkAuthentication();

        if (!authenticated) {

            /*
               Do NOT repeatedly redirect.

               Show a message instead.
               If the browser truly has no
               valid session, the user can
               manually go to login.
            */

            $("messagesInner").innerHTML = `
                <div class="welcome">

                    <div class="welcome-inner">

                        <div class="welcome-logo">
                            A
                        </div>

                        <h1>
                            Session unavailable
                        </h1>

                        <p style="margin-bottom:20px;">
                            Your AskOra login session could
                            not be verified.
                        </p>

                        <button
                            onclick="window.location.replace('/login')"
                            style="
                                border:none;
                                border-radius:10px;
                                padding:11px 18px;
                                color:white;
                                font-weight:700;
                                background:
                                    linear-gradient(
                                        135deg,
                                        #3b82f6,
                                        #7c3aed
                                    );
                            "
                        >
                            Go to Login
                        </button>

                    </div>

                </div>
            `;

            return;
        }

        /*
           Authentication succeeded.
        */

        updateAccountUI();

        await loadChats();

        await createOrLoadInitialChat();

    } catch (error) {

        console.error(
            "AskOra initialization error:",
            error
        );

        $("messagesInner").innerHTML = `
            <div class="welcome">

                <div class="welcome-inner">

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>
                        AskOra
                    </h1>

                    <p>
                        Something went wrong while
                        loading your account.
                    </p>

                    <button
                        onclick="location.reload()"
                        style="
                            margin-top:18px;
                            border:none;
                            border-radius:10px;
                            padding:11px 18px;
                            color:white;
                            font-weight:700;
                            background:
                                linear-gradient(
                                    135deg,
                                    #3b82f6,
                                    #7c3aed
                                );
                        "
                    >
                        Try Again
                    </button>

                </div>

            </div>
        `;

    } finally {

        isInitializing = false;
    }
}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        init();

    }
);
