<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#080B18">

    <title>AskOra — Ask. Get answers.</title>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --deep: #080B18;
            --midnight: #10152B;
            --blue: #3B82F6;
            --violet: #7C3AED;
            --white: #F5F7FF;
            --gray: #9CA3AF;
            --border: rgba(255,255,255,.09);
            --panel: rgba(16,21,43,.88);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--deep);
            color: var(--white);
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(
                    180deg,
                    #0c1124,
                    #080B18
                );
            border-right: 1px solid var(--border);
            z-index: 30;
        }

        .brand {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 22px;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 0 30px rgba(59,130,246,.25);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.4px;
        }

        .new-chat {
            margin: 0 16px 14px;
            width: calc(100% - 32px);
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.05);
            color: white;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            transition: .2s;
        }

        .new-chat:hover {
            background: rgba(59,130,246,.13);
            border-color: rgba(59,130,246,.4);
        }

        .search-box {
            padding: 0 16px 14px;
        }

        .search-box input {
            width: 100%;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;
            color: white;
            background: rgba(255,255,255,.045);
        }

        .search-box input:focus {
            border-color: rgba(59,130,246,.65);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
            border-radius: 10px;
            transition: .2s;
        }

        .chat-open {
            flex: 1;
            min-width: 0;
            border: 0;
            background: transparent;
            color: #dfe5f5;
            padding: 11px 10px;
            text-align: left;
            border-radius: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chat-open:hover,
        .chat-item.active .chat-open {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .chat-delete {
            border: 0;
            background: transparent;
            color: #68728d;
            width: 34px;
            height: 34px;
            border-radius: 8px;
        }

        .chat-delete:hover {
            color: #ff6b81;
            background: rgba(255,107,129,.08);
        }

        .empty-chats {
            color: #68728d;
            text-align: center;
            padding: 30px 15px;
            font-size: 13px;
        }

        .account {
            border-top: 1px solid var(--border);
            padding: 14px;
        }

        .account-name {
            font-weight: 700;
            margin-bottom: 3px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .account-email {
            color: var(--gray);
            font-size: 12px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .account-actions {
            display: flex;
            gap: 7px;
            margin-top: 12px;
        }

        .account-actions a,
        .account-actions button {
            flex: 1;
            padding: 9px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.04);
            color: #dfe5f5;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }

        .account-actions a:hover,
        .account-actions button:hover {
            background: rgba(255,255,255,.08);
        }

        /* MAIN */

        .main {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(59,130,246,.08),
                    transparent 35%
                ),
                var(--deep);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(8,11,24,.85);
            backdrop-filter: blur(18px);
        }

        .menu-btn {
            display: none;
            border: 0;
            background: transparent;
            color: white;
            font-size: 22px;
            margin-right: 10px;
        }

        .top-title {
            font-weight: 800;
            font-size: 16px;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
            color: #7f8aa5;
            font-size: 12px;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .tagline {
            margin-left: auto;
            color: #6f7890;
            font-size: 12px;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .messages-inner {
            width: min(900px, calc(100% - 30px));
            margin: 0 auto;
            padding: 35px 0 180px;
        }

        .welcome {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 15px;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            font-size: 35px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            box-shadow:
                0 0 60px rgba(59,130,246,.18);
            margin-bottom: 24px;
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1.5px;
        }

        .welcome p {
            margin: 0;
            color: var(--gray);
            max-width: 520px;
            line-height: 1.7;
        }

        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 28px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 800;
        }

        .message.user .avatar {
            background: rgba(255,255,255,.1);
        }

        .message.assistant .avatar {
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
        }

        .message-body {
            min-width: 0;
            flex: 1;
            line-height: 1.7;
            color: #e8ecf7;
        }

        .message-body p:first-child {
            margin-top: 0;
        }

        .message-body p:last-child {
            margin-bottom: 0;
        }

        .message-body h1,
        .message-body h2,
        .message-body h3 {
            line-height: 1.3;
            margin-top: 1.3em;
        }

        .message-body ul,
        .message-body ol {
            padding-left: 24px;
        }

        .message-body code {
            background: rgba(255,255,255,.08);
            padding: 2px 5px;
            border-radius: 5px;
            font-size: .9em;
        }

        .message-body pre {
            overflow-x: auto;
            background: #070a14;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 11px;
        }

        .message-body pre code {
            background: transparent;
            padding: 0;
        }

        .message-body blockquote {
            border-left: 3px solid var(--blue);
            margin-left: 0;
            padding-left: 15px;
            color: #aeb7ca;
        }

        .message-body table {
            border-collapse: collapse;
            width: 100%;
            overflow: hidden;
            margin: 15px 0;
        }

        .message-body th,
        .message-body td {
            border: 1px solid var(--border);
            padding: 8px 10px;
            text-align: left;
        }

        /* COMPOSER */

        .composer-area {
            position: absolute;
            bottom: 0;
            left: 280px;
            right: 0;
            padding: 20px 20px 24px;
            pointer-events: none;
            background:
                linear-gradient(
                    to top,
                    var(--deep) 55%,
                    transparent
                );
        }

        .composer {
            pointer-events: auto;
            width: min(900px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 9px;
            border-radius: 17px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(16,21,43,.94);
            box-shadow:
                0 15px 50px rgba(0,0,0,.3);
        }

        textarea {
            flex: 1;
            min-width: 0;
            max-height: 180px;
            resize: none;
            border: 0;
            outline: none;
            color: white;
            background: transparent;
            padding: 10px 8px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #69738b;
        }

        .composer-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border: 0;
            border-radius: 11px;
            color: white;
            background: rgba(255,255,255,.07);
        }

        .composer-btn:hover {
            background: rgba(255,255,255,.13);
        }

        .send-btn {
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
        }

        .send-btn:hover {
            opacity: .9;
        }

        .recording {
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 13px;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            background: rgba(16,21,43,.97);
            box-shadow: 0 15px 50px rgba(0,0,0,.4);
        }

        .recording.active {
            display: flex;
        }

        .recording-dot {
            width: 11px;
            height: 11px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.35);
                opacity: .5;
            }
        }

        .record-time {
            min-width: 45px;
            font-variant-numeric: tabular-nums;
        }

        .record-stop,
        .record-cancel {
            border: 0;
            border-radius: 8px;
            padding: 7px 10px;
            color: white;
        }

        .record-stop {
            background: #ef4444;
        }

        .record-cancel {
            background: rgba(255,255,255,.08);
        }

        .typing {
            color: #7f8aa5;
            font-size: 13px;
        }

        /* MOBILE */

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0,0,0,.6);
        }

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform .25s ease;
                box-shadow: 20px 0 60px rgba(0,0,0,.4);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .overlay.open {
                display: block;
            }

            .menu-btn {
                display: block;
            }

            .topbar {
                padding: 0 14px;
            }

            .tagline {
                display: none;
            }

            .composer-area {
                left: 0;
                padding: 12px 10px 15px;
            }

            .messages-inner {
                width: calc(100% - 20px);
                padding-top: 22px;
            }

            .message {
                gap: 10px;
                margin-bottom: 22px;
            }

            .avatar {
                width: 31px;
                height: 31px;
            }

            .welcome {
                min-height: 65vh;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div
        id="overlay"
        class="overlay"
        onclick="closeSidebar()"
    ></div>

    <aside id="sidebar" class="sidebar">

        <div class="brand">
            <div class="brand-logo">A</div>
            <div class="brand-name">AskOra</div>
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ New chat
        </button>

        <div class="search-box">
            <input
                id="chatSearch"
                type="search"
                placeholder="Search chats..."
                oninput="filterChats()"
            >
        </div>

        <div id="chatList" class="chat-list">
            <div class="empty-chats">
                Loading chats...
            </div>
        </div>

        <div class="account">

            <div
                id="accountName"
                class="account-name"
            >
                Account
            </div>

            <div
                id="accountEmail"
                class="account-email"
            >
                ...
            </div>

            <div class="account-actions">

                {% if is_admin %}
                <a href="/admin">Admin</a>
                {% endif %}

                <button onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <button
                class="menu-btn"
                onclick="openSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="top-title">
                AskOra
            </div>

            <div class="online">
                <span class="online-dot"></span>
                Online
            </div>

            <div class="tagline">
                Ask. Get answers.
            </div>

        </header>


        <section
            id="messages"
            class="messages"
        >

            <div
                id="messagesInner"
                class="messages-inner"
            >

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>
                        How can I help?
                    </h1>

                    <p>
                        Ask anything. Get clear, useful answers
                        powered by advanced AI.
                    </p>

                </div>

            </div>

        </section>


        <div class="composer-area">

            <div class="composer">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message AskOra..."
                    onkeydown="handleInputKey(event)"
                ></textarea>

                <button
                    id="voiceBtn"
                    class="composer-btn"
                    onclick="startRecording()"
                    title="Voice input"
                >
                    🎙
                </button>

                <button
                    id="sendBtn"
                    class="composer-btn send-btn"
                    onclick="sendMessage()"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<div
    id="recording"
    class="recording"
>

    <div class="recording-dot"></div>

    <span>Recording</span>

    <span
        id="recordTime"
        class="record-time"
    >
        00:00
    </span>

    <button
        class="record-stop"
        onclick="stopRecording()"
    >
        Stop
    </button>

    <button
        class="record-cancel"
        onclick="cancelRecording()"
    >
        Cancel
    </button>

</div>


<script>
const CSRF = {{ csrf_token|tojson }};

let chats = [];
let activeChatId = null;
let mediaRecorder = null;
let mediaStream = null;
let audioChunks = [];
let recordingStarted = null;
let recordingTimer = null;


const messages = document.getElementById("messages");
const messagesInner = document.getElementById("messagesInner");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");


/* ============================================================
   FETCH
   ============================================================ */

async function api(url, options = {}) {

    const headers = {
        ...(options.headers || {})
    };

    if (
        options.method &&
        options.method !== "GET"
    ) {
        headers["X-CSRF-Token"] = CSRF;
    }

    if (
        options.body &&
        !(options.body instanceof FormData)
    ) {
        headers["Content-Type"] = "application/json";
    }

    const response = await fetch(
        url,
        {
            ...options,
            headers
        }
    );

    if (response.status === 401) {
        window.location.href = "/login";
        return null;
    }

    const data = await response.json().catch(
        () => ({})
    );

    if (!response.ok) {
        throw new Error(
            data.error || "Something went wrong."
        );
    }

    return data;
}


/* ============================================================
   ACCOUNT
   ============================================================ */

async function loadAccount() {

    try {

        const user = await api("/api/me");

        if (!user) return;

        document.getElementById(
            "accountName"
        ).textContent = user.username;

        document.getElementById(
            "accountEmail"
        ).textContent = user.email;

    } catch (error) {
        console.error(error);
    }
}


/* ============================================================
   CHATS
   ============================================================ */

async function loadChats() {

    try {

        chats = await api("/api/chats");

        renderChatList();

    } catch (error) {

        console.error(error);

        document.getElementById(
            "chatList"
        ).innerHTML = `
            <div class="empty-chats">
                Could not load chats.
            </div>
        `;
    }
}


function renderChatList() {

    const list = document.getElementById(
        "chatList"
    );

    const search = document.getElementById(
        "chatSearch"
    ).value
        .trim()
        .toLowerCase();

    const filtered = chats.filter(
        chat =>
            chat.title
                .toLowerCase()
                .includes(search)
    );

    if (!filtered.length) {

        list.innerHTML = `
            <div class="empty-chats">
                No chats found.
            </div>
        `;

        return;
    }

    list.innerHTML = filtered.map(
        chat => `
            <div
                class="chat-item ${
                    Number(chat.id) === Number(activeChatId)
                        ? "active"
                        : ""
                }"
            >

                <button
                    class="chat-open"
                    onclick="openChat(${chat.id})"
                >
                    ${escapeHtml(chat.title)}
                </button>

                <button
                    class="chat-delete"
                    onclick="deleteChat(${chat.id}, event)"
                    title="Delete chat"
                >
                    ×
                </button>

            </div>
        `
    ).join("");
}


function filterChats() {
    renderChatList();
}


async function newChat() {

    try {

        const chat = await api(
            "/api/chats",
            {
                method: "POST",
                body: JSON.stringify({
                    title: "New chat"
                })
            }
        );

        activeChatId = chat.id;

        clearMessages();

        await loadChats();

        closeSidebar();

        input.focus();

    } catch (error) {
        alert(error.message);
    }
}


async function openChat(chatId) {

    try {

        const data = await api(
            `/api/chats/${chatId}/messages`
        );

        activeChatId = chatId;

        clearMessages();

        for (const message of data.messages) {

            appendMessage(
                message.role,
                message.content
            );
        }

        renderChatList();

        closeSidebar();

        scrollToBottom();

    } catch (error) {
        alert(error.message);
    }
}


async function deleteChat(chatId, event) {

    event.stopPropagation();

    if (
        !confirm(
            "Delete this conversation?"
        )
    ) {
        return;
    }

    try {

        await api(
            `/api/chats/${chatId}`,
            {
                method: "DELETE"
            }
        );

        if (
            Number(activeChatId) === Number(chatId)
        ) {
            activeChatId = null;
            clearMessages();
        }

        await loadChats();

    } catch (error) {
        alert(error.message);
    }
}


/* ============================================================
   MESSAGES
   ============================================================ */

function clearMessages() {

    messagesInner.innerHTML = `
        <div
            id="welcome"
            class="welcome"
        >

            <div class="welcome-logo">
                A
            </div>

            <h1>
                How can I help?
            </h1>

            <p>
                Ask anything. Get clear, useful answers
                powered by advanced AI.
            </p>

        </div>
    `;
}


function appendMessage(role, content) {

    const welcome = document.getElementById(
        "welcome"
    );

    if (welcome) {
        welcome.remove();
    }

    const wrapper = document.createElement("div");

    wrapper.className =
        `message ${role}`;

    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user"
            ? "You"
            : "A";

    const body = document.createElement("div");

    body.className = "message-body";

    if (role === "assistant") {

        body.innerHTML = renderMarkdown(
            content
        );

    } else {

        body.textContent = content;
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(body);

    messagesInner.appendChild(wrapper);

    return wrapper;
}


function appendTyping() {

    const welcome = document.getElementById(
        "welcome"
    );

    if (welcome) {
        welcome.remove();
    }

    const wrapper = document.createElement("div");

    wrapper.className =
        "message assistant";

    wrapper.id = "typingMessage";

    wrapper.innerHTML = `
        <div class="avatar">A</div>

        <div class="message-body">
            <span class="typing">
                AskOra is thinking...
            </span>
        </div>
    `;

    messagesInner.appendChild(wrapper);

    scrollToBottom();
}


function removeTyping() {

    const element = document.getElementById(
        "typingMessage"
    );

    if (element) {
        element.remove();
    }
}


function scrollToBottom() {

    requestAnimationFrame(() => {

        messages.scrollTop =
            messages.scrollHeight;

    });
}


/* ============================================================
   MARKDOWN
   ============================================================ */

function renderMarkdown(text) {

    const html = marked.parse(
        text,
        {
            breaks: true,
            gfm: true
        }
    );

    return DOMPurify.sanitize(
        html,
        {
            FORBID_TAGS: [
                "img",
                "svg",
                "iframe",
                "object",
                "embed",
                "video",
                "audio",
                "source",
                "form"
            ],
            FORBID_ATTR: [
                "style",
                "src",
                "srcset",
                "onerror",
                "onclick"
            ]
        }
    );
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   SEND
   ============================================================ */

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    input.value = "";
    resizeTextarea();

    appendMessage(
        "user",
        message
    );

    appendTyping();

    sendBtn.disabled = true;

    try {

        const data = await api(
            "/api/chat",
            {
                method: "POST",
                body: JSON.stringify({
                    chat_id: activeChatId,
                    message
                })
            }
        );

        removeTyping();

        activeChatId = data.chat_id;

        appendMessage(
            "assistant",
            data.answer
        );

        await loadChats();

        scrollToBottom();

    } catch (error) {

        removeTyping();

        appendMessage(
            "assistant",
            `⚠️ ${error.message}`
        );

    } finally {

        sendBtn.disabled = false;

        input.focus();
    }
}


/* ============================================================
   INPUT
   ============================================================ */

function handleInputKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {
        event.preventDefault();

        sendMessage();
    }

    setTimeout(
        resizeTextarea,
        0
    );
}


function resizeTextarea() {

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}


/* ============================================================
   VOICE
   ============================================================ */

async function startRecording() {

    if (!navigator.mediaDevices) {

        alert(
            "Your browser does not support microphone access."
        );

        return;
    }

    try {

        mediaStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(
                mediaStream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (event.data.size > 0) {
                    audioChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async () => {

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                cleanupRecording();

                if (
                    !blob.size ||
                    blob.size < 100
                ) {
                    return;
                }

                await sendVoice(blob);
            };

        mediaRecorder.start();

        recordingStarted =
            Date.now();

        document
            .getElementById("recording")
            .classList.add("active");

        updateRecordingTimer();

        recordingTimer =
            setInterval(
                updateRecordingTimer,
                1000
            );

    } catch (error) {

        console.error(error);

        alert(
            "Microphone permission was not granted."
        );
    }
}


function updateRecordingTimer() {

    if (!recordingStarted) return;

    const elapsed =
        Math.floor(
            (Date.now() - recordingStarted)
            / 1000
        );

    const minutes =
        String(
            Math.floor(elapsed / 60)
        ).padStart(2, "0");

    const seconds =
        String(
            elapsed % 60
        ).padStart(2, "0");

    document.getElementById(
        "recordTime"
    ).textContent =
        `${minutes}:${seconds}`;
}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {
        mediaRecorder.stop();
    }
}


function cancelRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
    }

    cleanupRecording();
}


function cleanupRecording() {

    if (recordingTimer) {

        clearInterval(
            recordingTimer
        );

        recordingTimer = null;
    }

    if (mediaStream) {

        mediaStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        mediaStream = null;
    }

    mediaRecorder = null;
    recordingStarted = null;
    audioChunks = [];

    document
        .getElementById("recording")
        .classList.remove("active");

    document.getElementById(
        "recordTime"
    ).textContent = "00:00";
}


async function sendVoice(blob) {

    appendTyping();

    const formData =
        new FormData();

    formData.append(
        "audio",
        blob,
        "recording.webm"
    );

    if (activeChatId) {

        formData.append(
            "chat_id",
            activeChatId
        );
    }

    try {

        const response =
            await fetch(
                "/api/voice",
                {
                    method: "POST",
                    headers: {
                        "X-CSRF-Token": CSRF
                    },
                    body: formData
                }
            );

        if (response.status === 401) {
            window.location.href =
                "/login";
            return;
        }

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Voice request failed."
            );
        }

        removeTyping();

        activeChatId =
            data.chat_id;

        appendMessage(
            "user",
            data.transcription
        );

        appendMessage(
            "assistant",
            data.answer
        );

        await loadChats();

        scrollToBottom();

    } catch (error) {

        removeTyping();

        appendMessage(
            "assistant",
            `⚠️ ${error.message}`
        );
    }
}


/* ============================================================
   MOBILE SIDEBAR
   ============================================================ */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("open");
}

    document
        .getElementById("sidebar")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("open");
}

async function logout() {

    try {

        await api(
            "/logout",
            {
                method: "POST"
            }
        );

        window.location.href =
            "/login";

    } catch (error) {

        alert(error.message);
    }
}

   INIT
   ============================================================ */

async function init() {

    resizeTextarea();

    await loadAccount();

    await loadChats();

    input.focus();
}

init();
