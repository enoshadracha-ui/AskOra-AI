<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AskOra — Ask. Get answers.</title>

    <style>
        :root {
            --bg: #080b18;
            --panel: #10152b;
            --panel-2: #0d1225;
            --blue: #3b82f6;
            --violet: #7c3aed;
            --white: #f5f7ff;
            --muted: #9ca3af;
            --border: rgba(255,255,255,.08);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(circle at 50% -10%, rgba(59,130,246,.13), transparent 35%),
                radial-gradient(circle at 90% 90%, rgba(124,58,237,.08), transparent 30%),
                var(--bg);
            color: var(--white);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(10,14,31,.96);
            border-right: 1px solid var(--border);
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 20px 18px 16px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            font-size: 21px;
            font-weight: 800;
            color: white;
            background:
                linear-gradient(135deg, rgba(59,130,246,.95), rgba(124,58,237,.95));
            box-shadow:
                0 8px 25px rgba(59,130,246,.18),
                inset 0 1px 0 rgba(255,255,255,.25);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .brand-subtitle {
            margin-top: 2px;
            font-size: 11px;
            color: var(--muted);
        }

        .new-chat {
            margin: 4px 14px 14px;
            min-height: 44px;
            border: 1px solid rgba(59,130,246,.25);
            border-radius: 12px;
            color: white;
            background: rgba(59,130,246,.11);
            transition: .2s ease;
        }

        .new-chat:hover {
            background: rgba(59,130,246,.2);
            border-color: rgba(59,130,246,.5);
        }

        .search-wrap {
            padding: 0 14px 12px;
        }

        .search-box {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            color: white;
            outline: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255,255,255,.035);
        }

        .search-box::placeholder {
            color: #697084;
        }

        .search-box:focus {
            border-color: rgba(59,130,246,.45);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 2px 10px 12px;
        }

        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-thumb,
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.1);
            border-radius: 20px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
            padding: 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            color: #dce3f5;
            background: transparent;
            text-align: left;
            transition: .18s ease;
        }

        .chat-item:hover {
            background: rgba(255,255,255,.045);
        }

        .chat-item.active {
            background: rgba(59,130,246,.11);
            border-color: rgba(59,130,246,.15);
        }

        .chat-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .chat-delete {
            width: 27px;
            height: 27px;
            flex: 0 0 27px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 7px;
            color: #70798d;
            background: transparent;
            opacity: 0;
        }

        .chat-item:hover .chat-delete {
            opacity: 1;
        }

        .chat-delete:hover {
            color: #ff7777;
            background: rgba(239,68,68,.1);
        }

        .empty-history {
            padding: 25px 15px;
            color: #687188;
            text-align: center;
            font-size: 12px;
        }

        /* =========================
           ACCOUNT
        ========================= */

        .account-section {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .account-card {
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,.025);
        }

        .account-name {
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .account-email {
            margin-top: 3px;
            font-size: 11px;
            color: var(--muted);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .side-action {
            width: 100%;
            min-height: 38px;
            margin-top: 5px;
            border: 1px solid transparent;
            border-radius: 9px;
            color: #cbd3e5;
            background: transparent;
            text-align: left;
            padding: 0 11px;
        }

        .side-action:hover {
            background: rgba(255,255,255,.05);
        }

        .side-action.danger:hover {
            color: #ff8585;
            background: rgba(239,68,68,.08);
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 62px;
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(8,11,24,.78);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 800;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #aeb7ca;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34,197,94,.65);
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .messages-inner {
            width: min(900px, 100%);
            min-height: 100%;
            margin: 0 auto;
            padding: 35px 22px 160px;
        }

        .welcome {
            min-height: calc(100vh - 220px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px 10px;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 22px;
            font-size: 34px;
            font-weight: 900;
            background:
                linear-gradient(135deg, #3b82f6, #7c3aed);
            box-shadow:
                0 20px 50px rgba(59,130,246,.2),
                inset 0 1px 0 rgba(255,255,255,.25);
        }

        .welcome h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1.3px;
        }

        .welcome p {
            max-width: 550px;
            margin: 12px auto 0;
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }

        .welcome-note {
            margin-top: 22px;
            color: #707990;
            font-size: 12px;
        }

        .message-row {
            display: flex;
            width: 100%;
            margin: 0 0 20px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: min(78%, 720px);
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .message-row.user .message-bubble {
            color: white;
            background: linear-gradient(
                135deg,
                rgba(59,130,246,.85),
                rgba(59,130,246,.65)
            );
            border-bottom-right-radius: 5px;
        }

        .message-row.assistant .message-bubble {
            color: #e7ebf7;
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }

        .message-bubble p {
            margin: 0 0 10px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble ul,
        .message-bubble ol {
            margin: 8px 0;
            padding-left: 22px;
        }

        .message-bubble code {
            padding: 2px 5px;
            border-radius: 5px;
            background: rgba(0,0,0,.25);
            font-family: monospace;
        }

        .message-bubble pre {
            margin: 10px 0;
            padding: 12px;
            overflow-x: auto;
            border-radius: 9px;
            background: #070a13;
            border: 1px solid rgba(255,255,255,.07);
        }

        .message-bubble pre code {
            padding: 0;
            background: transparent;
        }

        .typing {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 10px 13px;
            border-radius: 12px;
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8290ad;
            animation: typing 1.1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .45;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 15;
            padding: 18px 20px 20px;
            background:
                linear-gradient(
                    to top,
                    var(--bg) 55%,
                    transparent
                );
        }

        .composer {
            width: min(850px, 100%);
            margin: 0 auto;
        }

        .composer-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 9px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 17px;
            background: rgba(16,21,43,.94);
            box-shadow: 0 15px 40px rgba(0,0,0,.28);
            backdrop-filter: blur(15px);
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            max-height: 150px;
            min-height: 42px;
            resize: none;
            padding: 11px 7px;
            border: 0;
            outline: none;
            color: white;
            background: transparent;
            line-height: 1.45;
            font-size: 14px;
        }

        #messageInput::placeholder {
            color: #687188;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.035);
            color: #dce7ff;
            transition: .2s ease;
        }

        .icon-btn:hover {
            background: rgba(59,130,246,.14);
            border-color: rgba(59,130,246,.4);
            color: #fff;
        }

        #sendButton {
            background: linear-gradient(
                135deg,
                rgba(59,130,246,.95),
                rgba(124,58,237,.9)
            );
            border-color: transparent;
            color: white;
        }

        #sendButton:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(59,130,246,.2);
        }

        #micButton svg,
        .recording-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #micButton.recording-ready {
            background: rgba(255,255,255,.035);
            color: #dce7ff;
            box-shadow: none;
        }

        #micButton.recording-ready:hover {
            background: rgba(59,130,246,.14);
            color: #fff;
            box-shadow: 0 0 0 4px rgba(59,130,246,.07);
        }

        .composer-hint {
            padding-top: 7px;
            text-align: center;
            color: #596277;
            font-size: 10px;
        }

        /* =========================
           RECORDING
        ========================= */

        .recording-bar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 13px;
            border: 1px solid rgba(239,68,68,.22);
            border-radius: 15px;
            background: rgba(31,14,25,.96);
        }

        .recording-bar.active {
            display: flex;
        }

        .recording-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            color: #ff7777;
            background: rgba(239,68,68,.1);
        }

        .recording-pulse {
            width: 9px;
            height: 9px;
            margin-left: 2px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 0 0 rgba(239,68,68,.7);
            animation: pulse 1.3s infinite;
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 9px rgba(239,68,68,0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239,68,68,0);
            }
        }

        .recording-info {
            flex: 1;
        }

        .recording-title {
            font-size: 12px;
            font-weight: 700;
        }

        .recording-time {
            margin-top: 2px;
            color: #ff8181;
            font-size: 11px;
        }

        .recording-actions {
            display: flex;
            gap: 7px;
        }

        .record-btn {
            height: 36px;
            padding: 0 12px;
            border-radius: 9px;
            border: 1px solid var(--border);
            color: #dbe2f2;
            background: rgba(255,255,255,.04);
        }

        .record-btn.send {
            border-color: rgba(59,130,246,.25);
            color: white;
            background: rgba(59,130,246,.18);
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            z-index: 100;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            background: #151b31;
            box-shadow: 0 10px 35px rgba(0,0,0,.3);
            font-size: 12px;
            transition: .25s ease;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-menu {
            display: none;
        }

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 760px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform .25s ease;
                box-shadow: 20px 0 50px rgba(0,0,0,.35);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                z-index: 19;
                background: rgba(0,0,0,.55);
                backdrop-filter: blur(2px);
            }

            .sidebar-overlay.show {
                display: block;
            }

            .mobile-menu {
                width: 38px;
                height: 38px;
                display: grid;
                place-items: center;
                margin-right: 8px;
                border: 1px solid var(--border);
                border-radius: 9px;
                color: white;
                background: rgba(255,255,255,.04);
            }

            .topbar {
                padding: 0 14px;
            }

            .messages-inner {
                padding-left: 14px;
                padding-right: 14px;
                padding-top: 22px;
                padding-bottom: 150px;
            }

            .message-bubble {
                max-width: 88%;
            }

            .composer-area {
                padding: 12px 10px 13px;
            }

            .composer-hint {
                display: none;
            }

            .welcome {
                min-height: calc(100vh - 180px);
            }

            .welcome-logo {
                width: 60px;
                height: 60px;
                font-size: 29px;
            }
        }

        @media (max-width: 430px) {
            .topbar-title {
                font-size: 15px;
            }

            .online {
                font-size: 10px;
            }

            .message-bubble {
                font-size: 13px;
            }

            .recording-actions {
                gap: 4px;
            }

            .record-btn {
                padding: 0 9px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <aside id="sidebar" class="sidebar">

        <div class="brand">
            <div class="brand-logo">A</div>
            <div>
                <div class="brand-name">AskOra</div>
                <div class="brand-subtitle">Advanced AI, made simple.</div>
            </div>
        </div>

        <button class="new-chat" onclick="createNewChat()">
            ＋ New Chat
        </button>

        <div class="search-wrap">
            <input
                id="chatSearch"
                class="search-box"
                type="text"
                placeholder="Search chats..."
                oninput="searchChats()"
            >
        </div>

        <div id="chatList" class="chat-list"></div>

        <div class="account-section">

            <div class="account-card">
                <div id="accountName" class="account-name">Loading...</div>
                <div id="accountEmail" class="account-email"></div>
            </div>

            <button
                id="adminButton"
                class="side-action"
                style="display:none"
                onclick="window.location.href='/admin'"
            >
                📊 Admin Dashboard
            </button>

            <button
                class="side-action"
                type="button"
                onclick="logoutUser()"
            >
                🚪 Logout
            </button>

            <button
                class="side-action danger"
                type="button"
                onclick="deleteAccount()"
            >
                🗑️ Delete Account
            </button>

        </div>
    </aside>

    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;">
                <button
                    id="mobileMenu"
                    class="mobile-menu"
                    type="button"
                    onclick="toggleSidebar()"
                    aria-label="Open menu"
                >
                    ☰
                </button>

                <div class="topbar-title">
                    AskOra
                </div>
            </div>

            <div class="online">
                <span class="online-dot"></span>
                Online
            </div>

        </header>

        <section id="messages" class="messages">
            <div id="messagesInner" class="messages-inner">

                <div id="welcomeScreen" class="welcome">

                    <div class="welcome-logo">A</div>

                    <h1>Ask. Get answers.</h1>

                    <p>
                        AskOra is your AI assistant for questions,
                        ideas, explanations, writing, coding and more.
                    </p>

                    <div class="welcome-note">
                        Advanced AI, made simple.
                    </div>

                </div>

            </div>
        </section>

        <div class="composer-area">

            <div class="composer">

                <div id="normalComposer" class="composer-box">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message AskOra..."
                        autocomplete="off"
                    ></textarea>

                    <button
                        id="micButton"
                        class="icon-btn recording-ready"
                        title="Voice input"
                        type="button"
                        aria-label="Voice input"
                        onclick="startRecording()"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"></path>
                            <path d="M19 11a7 7 0 0 1-14 0"></path>
                            <path d="M12 18v4"></path>
                            <path d="M8 22h8"></path>
                        </svg>
                    </button>

                    <button
                        id="sendButton"
                        class="icon-btn"
                        title="Send"
                        type="button"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>

                <div id="recordingBar" class="recording-bar">

                    <div class="recording-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"></path>
                            <path d="M19 11a7 7 0 0 1-14 0"></path>
                            <path d="M12 18v4"></path>
                            <path d="M8 22h8"></path>
                        </svg>
                    </div>

                    <div class="recording-pulse"></div>

                    <div class="recording-info">
                        <div class="recording-title">
                            Listening...
                        </div>

                        <div id="recordingTime" class="recording-time">
                            00:00
                        </div>
                    </div>

                    <div class="recording-actions">

                        <button
                            class="record-btn"
                            type="button"
                            onclick="cancelRecording()"
                        >
                            Cancel
                        </button>

                        <button
                            class="record-btn send"
                            type="button"
                            onclick="stopAndSendRecording()"
                        >
                            Send
                        </button>

                    </div>

                </div>

                <div class="composer-hint">
                    AskOra can answer questions, explain things and help you create.
                </div>

            </div>

        </div>

    </main>

</div>

<div id="toast" class="toast"></div>

<script>
    /* =========================
       STATE
    ========================= */

    let CSRF = "";
    let currentUser = null;

    let chats = [];
    let currentChatId = null;

    let isSending = false;
    let isInitializing = true;

    let mediaRecorder = null;
    let audioChunks = [];
    let recordingTimer = null;
    let recordingSeconds = 0;
    let currentRecordingBlob = null;


    /* =========================
       HELPERS
    ========================= */

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    }


    function formatMarkdown(text) {
        let html = escapeHtml(text);

        html = html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );

        html = html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

        html = html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );

        html = html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );

        html = html.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );

        html = html.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );

        html = html.replace(
            /^\- (.*)$/gm,
            "<li>$1</li>"
        );

        html = html.replace(
            /(<li>.*<\/li>)/gs,
            "<ul>$1</ul>"
        );

        html = html.replace(
            /\n\n/g,
            "</p><p>"
        );

        html = html.replace(
            /\n/g,
            "<br>"
        );

        return "<p>" + html + "</p>";
    }


    function showToast(message) {
        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(window.toastTimer);

        window.toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 2800);
    }


    async function apiFetch(url, options = {}) {

        options.credentials = "same-origin";

        options.headers = {
            ...(options.headers || {}),
            "X-CSRF-Token": CSRF
        };

        const response = await fetch(url, options);

        if (response.status === 401) {
            window.location.replace("/login");
            throw new Error("AUTH_REQUIRED");
        }

        return response;
    }


    function scrollMessagesToBottom() {
        const messages = document.getElementById("messages");

        requestAnimationFrame(() => {
            messages.scrollTop = messages.scrollHeight;
        });
    }


    /* =========================
       WELCOME
    ========================= */

    function showWelcome() {

        const inner = document.getElementById("messagesInner");

        inner.innerHTML = `
            <div id="welcomeScreen" class="welcome">
                <div class="welcome-logo">A</div>

                <h1>Ask. Get answers.</h1>

                <p>
                    AskOra is your AI assistant for questions,
                    ideas, explanations, writing, coding and more.
                </p>

                <div class="welcome-note">
                    Advanced AI, made simple.
                </div>
            </div>
        `;
    }


    function clearMessages() {
        document.getElementById("messagesInner").innerHTML = "";
    }


    function hideWelcome() {
        const welcome = document.getElementById("welcomeScreen");

        if (welcome) {
            welcome.remove();
        }
    }


    /* =========================
       AUTHENTICATION
    ========================= */

    async function checkAuthentication() {

        const response = await fetch("/api/me", {
            credentials: "same-origin"
        });

        const data = await response.json();

        if (!data.authenticated || !data.user) {
            window.location.replace("/login");
            return false;
        }

        currentUser = data.user;
        CSRF = data.csrf_token || "";

        return true;
    }


    /* =========================
       LOGOUT
    ========================= */

    async function logoutUser() {

        if (isSending) {
            showToast("Please wait for the current request to finish.");
            return;
        }

        try {

            const response = await fetch("/logout", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "X-CSRF-Token": CSRF
                }
            });

            if (!response.ok) {
                throw new Error("Logout failed");
            }

            window.location.replace("/login");

        } catch (error) {

            console.error("Logout error:", error);

            /*
             * Fallback in case the backend logout route
             * uses a normal browser GET route.
             */
            window.location.replace("/logout");
        }
    }


    /* =========================
       CHAT LIST
    ========================= */

    async function loadChats() {

        try {

            const response = await apiFetch("/api/chats");

            const data = await response.json();

            chats = Array.isArray(data.chats)
                ? data.chats
                : [];

            renderChatList();

        } catch (error) {

            if (error.message !== "AUTH_REQUIRED") {
                console.error("Load chats error:", error);
            }
        }
    }


    function renderChatList() {

        const list = document.getElementById("chatList");
        const search = document
            .getElementById("chatSearch")
            .value
            .trim()
            .toLowerCase();

        list.innerHTML = "";

        const filtered = chats.filter(chat => {

            const title = (
                chat.title ||
                "New conversation"
            ).toLowerCase();

            return title.includes(search);
        });

        if (!filtered.length) {

            list.innerHTML = `
                <div class="empty-history">
                    No previous chats
                </div>
            `;

            return;
        }

        filtered.forEach(chat => {

            const item = document.createElement("div");

            item.className =
                "chat-item" +
                (String(chat.id) === String(currentChatId)
                    ? " active"
                    : "");

            item.onclick = () => openChat(chat.id);

            item.innerHTML = `
                <div class="chat-title">
                    ${escapeHtml(
                        chat.title || "New conversation"
                    )}
                </div>

                <button
                    class="chat-delete"
                    type="button"
                    title="Delete chat"
                    onclick="event.stopPropagation(); deleteChat(${chat.id})"
                >
                    ×
                </button>
            `;

            list.appendChild(item);
        });
    }


    function searchChats() {
        renderChatList();
    }


    /* =========================
       NEW CHAT
    ========================= */

    async function createNewChat(showToastMessage = true) {

        try {

            const response = await apiFetch("/api/chats", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: "New chat"
                })
            });

            const data = await response.json();

            if (!response.ok || !data.chat) {
                throw new Error(
                    data.error || "Could not create chat."
                );
            }

            chats.unshift(data.chat);

            currentChatId = data.chat.id;

            clearMessages();
            showWelcome();

            renderChatList();

            closeSidebar();

            if (showToastMessage) {
                showToast("New chat created");
            }

        } catch (error) {

            console.error("Create chat error:", error);

            if (error.message !== "AUTH_REQUIRED") {
                showToast(
                    error.message ||
                    "Could not create a new chat."
                );
            }
        }
    }


    /* =========================
       OPEN CHAT
    ========================= */

    async function openChat(chatId) {

        try {

            const response = await apiFetch(
                `/api/chats/${chatId}/messages`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Could not open chat."
                );
            }

            currentChatId = chatId;

            clearMessages();

            const messages = Array.isArray(data.messages)
                ? data.messages
                : [];

            if (!messages.length) {

                showWelcome();

            } else {

                messages.forEach(message => {

                    addMessage(
                        message.role,
                        message.content
                    );

                });
            }

            renderChatList();
            closeSidebar();
            scrollMessagesToBottom();

        } catch (error) {

            console.error("Open chat error:", error);

            if (error.message !== "AUTH_REQUIRED") {
                showToast(
                    error.message ||
                    "Could not open chat."
                );
            }
        }
    }


    /* =========================
       DELETE CHAT
    ========================= */

    async function deleteChat(chatId) {

        if (!confirm("Delete this chat?")) {
            return;
        }

        try {

            const response = await apiFetch(
                `/api/chats/${chatId}`,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Could not delete chat."
                );
            }

            chats = chats.filter(
                chat => String(chat.id) !== String(chatId)
            );

            if (String(currentChatId) === String(chatId)) {

                currentChatId = null;

                clearMessages();
                showWelcome();
            }

            renderChatList();

            showToast("Chat deleted");

        } catch (error) {

            console.error("Delete chat error:", error);

            if (error.message !== "AUTH_REQUIRED") {
                showToast(
                    error.message ||
                    "Could not delete chat."
                );
            }
        }
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(role, content) {

        hideWelcome();

        const inner = document.getElementById("messagesInner");

        const row = document.createElement("div");

        row.className =
            "message-row " +
            (role === "user" ? "user" : "assistant");

        const bubble = document.createElement("div");

        bubble.className = "message-bubble";

        if (role === "user") {
            bubble.textContent = content;
        } else {
            bubble.innerHTML = formatMarkdown(content);
        }

        row.appendChild(bubble);
        inner.appendChild(row);

        scrollMessagesToBottom();

        return row;
    }


    function addTypingIndicator() {

        hideWelcome();

        const inner = document.getElementById("messagesInner");

        const row = document.createElement("div");

        row.id = "typingIndicator";
        row.className = "message-row assistant";

        row.innerHTML = `
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        inner.appendChild(row);

        scrollMessagesToBottom();
    }


    function removeTypingIndicator() {

        const indicator =
            document.getElementById("typingIndicator");

        if (indicator) {
            indicator.remove();
        }
    }


    /* =========================
       SEND TEXT
    ========================= */

    async function sendMessage() {

        if (isSending) {
            return;
        }

        const input =
            document.getElementById("messageInput");

        const message = input.value.trim();

        if (!message) {
            return;
        }

        isSending = true;

        input.value = "";
        input.style.height = "auto";

        /*
         * Important:
         * We only create a database chat when the user
         * actually sends a message.
         *
         * This keeps the welcome screen visible when
         * AskOra first opens.
         */
        if (!currentChatId) {

            try {

                const response = await apiFetch(
                    "/api/chats",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: message.slice(0, 60)
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.chat) {
                    throw new Error(
                        data.error ||
                        "Could not create chat."
                    );
                }

                currentChatId = data.chat.id;

                chats.unshift(data.chat);

                renderChatList();

            } catch (error) {

                console.error("Create chat error:", error);

                isSending = false;

                input.value = message;

                if (error.message !== "AUTH_REQUIRED") {
                    showToast(
                        error.message ||
                        "Could not start chat."
                    );
                }

                return;
            }
        }

        addMessage("user", message);

        addTypingIndicator();

        try {

            const response = await apiFetch(
                "/api/chat",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: currentChatId,
                        message: message
                    })
                }
            );

            const data = await response.json();

            removeTypingIndicator();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Something went wrong."
                );
            }

            addMessage(
                "assistant",
                data.answer || "I couldn't generate an answer."
            );

            if (data.chat) {

                const index = chats.findIndex(
                    chat =>
                        String(chat.id) ===
                        String(data.chat.id)
                );

                if (index >= 0) {
                    chats[index] = data.chat;
                } else {
                    chats.unshift(data.chat);
                }

                renderChatList();
            }

        } catch (error) {

            removeTypingIndicator();

            console.error("Send message error:", error);

            if (error.message !== "AUTH_REQUIRED") {

                addMessage(
                    "assistant",
                    "Sorry, something went wrong while generating the response."
                );

                showToast(
                    error.message ||
                    "Something went wrong."
                );
            }

        } finally {

            isSending = false;
            input.focus();
        }
    }


    /* =========================
       VOICE RECORDING
    ========================= */

    async function startRecording() {

        if (isSending) {
            return;
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            showToast(
                "Voice recording is not supported on this device."
            );

            return;
        }

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            audioChunks = [];
            currentRecordingBlob = null;

            mediaRecorder =
                new MediaRecorder(stream);

            mediaRecorder.ondataavailable = event => {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {

                const blob = new Blob(
                    audioChunks,
                    {
                        type:
                            mediaRecorder.mimeType ||
                            "audio/webm"
                    }
                );

                currentRecordingBlob = blob;

                stream.getTracks().forEach(
                    track => track.stop()
                );
            };

            mediaRecorder.start();

            recordingSeconds = 0;

            updateRecordingTime();

            recordingTimer = setInterval(
                updateRecordingTime,
                1000
            );

            document
                .getElementById("normalComposer")
                .style.display = "none";

            document
                .getElementById("recordingBar")
                .classList.add("active");

        } catch (error) {

            console.error("Microphone error:", error);

            showToast(
                "Microphone permission is required."
            );
        }
    }


    function updateRecordingTime() {

        const minutes =
            Math.floor(recordingSeconds / 60)
                .toString()
                .padStart(2, "0");

        const seconds =
            (recordingSeconds % 60)
                .toString()
                .padStart(2, "0");

        document.getElementById("recordingTime")
            .textContent =
            `${minutes}:${seconds}`;

        recordingSeconds++;
    }


    function stopRecordingOnly() {

        if (recordingTimer) {

            clearInterval(recordingTimer);
            recordingTimer = null;
        }

        if (
            mediaRecorder &&
            mediaRecorder.state !== "inactive"
        ) {
            mediaRecorder.stop();
        }
    }


    function cancelRecording() {

        stopRecordingOnly();

        setTimeout(() => {

            audioChunks = [];
            currentRecordingBlob = null;

            document
                .getElementById("recordingBar")
                .classList.remove("active");

            document
                .getElementById("normalComposer")
                .style.display = "flex";

        }, 100);
    }


    function stopAndSendRecording() {

        if (!mediaRecorder) {
            return;
        }

        stopRecordingOnly();

        setTimeout(async () => {

            document
                .getElementById("recordingBar")
                .classList.remove("active");

            document
                .getElementById("normalComposer")
                .style.display = "flex";

            if (currentRecordingBlob) {

                await sendVoice(
                    currentRecordingBlob
                );
            }

        }, 150);
    }


    /* =========================
       SEND VOICE
    ========================= */

    async function sendVoice(blob) {

        if (isSending) {
            return;
        }

        isSending = true;

        addTypingIndicator();

        /*
         * Create a chat only when voice is actually sent.
         */
        if (!currentChatId) {

            try {

                const response = await apiFetch(
                    "/api/chats",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: "Voice chat"
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.chat) {
                    throw new Error(
                        data.error ||
                        "Could not create chat."
                    );
                }

                currentChatId = data.chat.id;

                chats.unshift(data.chat);

                renderChatList();

            } catch (error) {

                removeTypingIndicator();

                isSending = false;

                if (error.message !== "AUTH_REQUIRED") {
                    showToast(
                        error.message ||
                        "Could not start voice chat."
                    );
                }

                return;
            }
        }

        try {

            const formData = new FormData();

            formData.append(
                "chat_id",
                currentChatId
            );

            formData.append(
                "audio",
                blob,
                "voice.webm"
            );

            const response = await apiFetch(
                "/api/voice",
                {
                    method: "POST",
                    body: formData,
                    headers: {
                        "X-CSRF-Token": CSRF
                    }
                }
            );

            const data = await response.json();

            removeTypingIndicator();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Voice request failed."
                );
            }

            if (data.transcript) {

                addMessage(
                    "user",
                    data.transcript
                );
            }

            if (data.answer) {

                addMessage(
                    "assistant",
                    data.answer
                );
            }

            if (data.chat) {

                const index = chats.findIndex(
                    chat =>
                        String(chat.id) ===
                        String(data.chat.id)
                );

                if (index >= 0) {
                    chats[index] = data.chat;
                } else {
                    chats.unshift(data.chat);
                }

                renderChatList();
            }

        } catch (error) {

            removeTypingIndicator();

            console.error(
                "Voice request error:",
                error
            );

            if (error.message !== "AUTH_REQUIRED") {

                addMessage(
                    "assistant",
                    "Sorry, I couldn't process that voice message."
                );

                showToast(
                    error.message ||
                    "Voice request failed."
                );
            }

        } finally {

            isSending = false;
            currentRecordingBlob = null;
            audioChunks = [];
        }
    }


    /* =========================
       ACCOUNT DELETE
    ========================= */

    async function deleteAccount() {

        const confirmed = confirm(
            "Are you sure you want to permanently delete your account and chats?"
        );

        if (!confirmed) {
            return;
        }

        const confirmedAgain = confirm(
            "This cannot be undone. Continue?"
        );

        if (!confirmedAgain) {
            return;
        }

        try {

            const response = await apiFetch(
                "/api/account",
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Could not delete account."
                );
            }

            window.location.replace("/login");

        } catch (error) {

            console.error(
                "Delete account error:",
                error
            );

            if (error.message !== "AUTH_REQUIRED") {
                showToast(
                    error.message ||
                    "Could not delete account."
                );
            }
        }
    }


    /* =========================
       SIDEBAR
    ========================= */

    function toggleSidebar() {

        document
            .getElementById("sidebar")
            .classList.toggle("open");

        document
            .getElementById("sidebarOverlay")
            .classList.toggle("show");
    }


    function closeSidebar() {

        document
            .getElementById("sidebar")
            .classList.remove("open");

        document
            .getElementById("sidebarOverlay")
            .classList.remove("show");
    }


    /* =========================
       INPUT AUTO RESIZE
    ========================= */

    document
        .getElementById("messageInput")
        .addEventListener("input", function () {

            this.style.height = "auto";

            this.style.height =
                Math.min(this.scrollHeight, 150) +
                "px";
        });


    document
        .getElementById("messageInput")
        .addEventListener("keydown", function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        });


    /* =========================
       INIT
    ========================= */

    async function init() {

        try {

            const authenticated =
                await checkAuthentication();

            if (!authenticated) {
                return;
            }

            document.getElementById("accountName")
                .textContent =
                currentUser.username || "User";

            document.getElementById("accountEmail")
                .textContent =
                currentUser.email || "";

            if (currentUser.is_admin) {

                document.getElementById("adminButton")
                    .style.display = "block";
            }

            /*
             * Load previous conversations,
             * but DO NOT automatically create/open one.
             *
             * This is what keeps the welcome screen
             * visible when AskOra first opens.
             */
            await loadChats();

            currentChatId = null;

            clearMessages();
            showWelcome();

            isInitializing = false;

        } catch (error) {

            console.error("Initialization error:", error);

            if (error.message !== "AUTH_REQUIRED") {
                showToast(
                    "Could not load AskOra."
                );
            }
        }
    }


    init();
</script>
