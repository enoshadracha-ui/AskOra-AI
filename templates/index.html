<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra</title>

    <meta
        name="theme-color"
        content="#080B18"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #080B18;
            color: #F5F7FF;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ==================================================
           APP
        ================================================== */

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            background: #080B18;
        }

        /* ==================================================
           SIDEBAR
        ================================================== */

        .sidebar {
            width: 280px;
            height: 100%;
            background: #10152B;
            border-right: 1px solid rgba(255,255,255,0.07);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
        }

        .sidebar-top {
            padding: 16px;
        }

        .new-chat {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #F5F7FF;
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: rgba(255,255,255,0.08);
        }

        .new-chat-icon {
            font-size: 20px;
        }

        .history-title {
            padding: 8px 16px;
            color: #9CA3AF;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px 10px;
        }

        .chat-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #DDE2F0;
            padding: 10px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            margin-bottom: 3px;
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .chat-item.active {
            background: rgba(59,130,246,0.15);
        }

        .chat-item-content {
            min-width: 0;
            flex: 1;
        }

        .chat-item-title {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-chat {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #9CA3AF;
            opacity: 0;
            flex-shrink: 0;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        .delete-chat:hover {
            background: rgba(239,68,68,0.15);
            color: #F87171;
        }

        .sidebar-bottom {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .account-box {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 11px;
            background: rgba(255,255,255,0.03);
        }

        .account-name {
            font-weight: 700;
            font-size: 14px;
        }

        .account-email {
            margin-top: 3px;
            color: #9CA3AF;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .account-actions a,
        .account-actions button {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: #DDE2F0;
            padding: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
        }

        .account-actions a:hover,
        .account-actions button:hover {
            background: rgba(255,255,255,0.08);
        }

        /* ==================================================
           MAIN
        ================================================== */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ==================================================
           FIXED HEADER
        ================================================== */

        .topbar {
            height: 72px;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(8,11,24,0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            position: relative;
            z-index: 10;
        }

        .topbar-inner {
            text-align: center;
        }

        .brand {
            font-size: 18px;
            line-height: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .online {
            margin-top: 2px;
            color: #22C55E;
            font-size: 11px;
            font-weight: 600;
        }

        .online::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22C55E;
            margin-right: 5px;
            vertical-align: 1px;
        }

        .mobile-menu {
            display: none;
            position: absolute;
            left: 12px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,0.05);
            color: #F5F7FF;
            font-size: 20px;
        }

        /* ==================================================
           CHAT AREA
        ================================================== */

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .messages {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 28px 24px 140px;
        }

        .welcome {
            min-height: 55vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 10px;
        }

        .welcome-title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .welcome-text {
            margin-top: 10px;
            color: #9CA3AF;
            font-size: 15px;
        }

        /* ==================================================
           MESSAGE
        ================================================== */

        .message {
            display: flex;
            gap: 14px;
            margin: 0 0 28px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
        }

        .avatar.user {
            background: #3B82F6;
            color: white;
        }

        .avatar.ai {
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
            color: white;
        }

        .message-body {
            flex: 1;
            min-width: 0;
        }

        .message-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .message-content {
            color: #DDE2F0;
            font-size: 15px;
            line-height: 1.7;
            word-wrap: break-word;
        }

        .message-content p {
            margin: 0 0 12px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content strong {
            color: #F5F7FF;
        }

        .message-content code {
            background: rgba(255,255,255,0.08);
            border-radius: 5px;
            padding: 2px 5px;
            font-size: 13px;
        }

        .message-content pre {
            background: #050712;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 14px;
            overflow-x: auto;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 22px;
        }

        /* ==================================================
           TYPING
        ================================================== */

        .typing {
            display: none;
            align-items: center;
            gap: 6px;
            color: #9CA3AF;
            font-size: 13px;
            margin-left: 48px;
            margin-bottom: 20px;
        }

        .typing.show {
            display: flex;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #9CA3AF;
            animation: typing 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ==================================================
           COMPOSER
        ================================================== */

        .composer-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 20px 20px;
            background: linear-gradient(
                to top,
                #080B18 65%,
                transparent
            );
            pointer-events: none;
        }

        .composer {
            max-width: 850px;
            margin: 0 auto;
            pointer-events: auto;
            background: #10152B;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 9px;
            box-shadow:
                0 12px 45px rgba(0,0,0,0.3);
        }

        .composer textarea {
            flex: 1;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #F5F7FF;
            min-height: 40px;
            max-height: 180px;
            padding: 9px 8px;
            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color: #6B7280;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-button:hover {
            background: rgba(255,255,255,0.06);
            color: #F5F7FF;
        }

        .send-button {
            background: #3B82F6;
            color: white;
        }

        .send-button:hover {
            background: #2563EB;
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* ==================================================
           RECORDING
        ================================================== */

        .recording-panel {
            display: none;
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: min(400px, calc(100% - 30px));
            background: #10152B;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 15px;
            z-index: 30;
            box-shadow: 0 15px 45px rgba(0,0,0,0.45);
        }

        .recording-panel.show {
            display: block;
        }

        .recording-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            background: #EF4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.35;
            }
        }

        .recording-time {
            font-size: 14px;
            color: #F5F7FF;
        }

        .recording-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .recording-actions button {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 9px;
            padding: 9px;
            background: rgba(255,255,255,0.04);
            color: #F5F7FF;
        }

        .recording-actions .stop {
            background: #3B82F6;
            border-color: #3B82F6;
        }

        /* ==================================================
           MOBILE
        ================================================== */

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;
                left: -290px;
                top: 0;
                bottom: 0;
                transition: left 0.25s ease;
                box-shadow: 15px 0 50px rgba(0,0,0,0.4);
            }

            .sidebar.open {
                left: 0;
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.55);
                z-index: 15;
            }

            .sidebar-overlay.show {
                display: block;
            }

            .mobile-menu {
                display: block;
            }

            .messages {
                padding-left: 15px;
                padding-right: 15px;
            }

            .composer-wrap {
                padding-left: 10px;
                padding-right: 10px;
            }

            .welcome-title {
                font-size: 28px;
            }

            .message {
                gap: 10px;
            }

            .avatar {
                width: 30px;
                height: 30px;
                border-radius: 8px;
            }

            .message-content {
                font-size: 14px;
            }

            .delete-chat {
                opacity: 1;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-top">

            <button
                class="new-chat"
                id="newChatButton"
            >
                <span class="new-chat-icon">＋</span>
                <span>New chat</span>
            </button>

        </div>

        <div class="history-title">
            Chats
        </div>

        <div
            class="chat-history"
            id="chatHistory"
        >
        </div>

        <div class="sidebar-bottom">

            <div class="account-box">

                <div class="account-name">
                    {{ user.username }}
                </div>

                <div class="account-email">
                    {{ user.email }}
                </div>

                <div class="account-actions">

                    {% if is_admin %}
                    <a href="/admin">
                        Admin
                    </a>
                    {% endif %}

                    <button id="logoutButton">
                        Logout
                    </button>

                </div>

            </div>

        </div>

    </aside>

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main">

        <!-- FIXED HEADER -->

        <header class="topbar">

            <button
                class="mobile-menu"
                id="mobileMenu"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="topbar-inner">

                <div class="brand">
                    AskOra
                </div>

                <div class="online">
                    Online
                </div>

            </div>

        </header>


        <!-- SCROLLING CHAT -->

        <div
            class="chat-scroll"
            id="chatScroll"
        >

            <div
                class="messages"
                id="messages"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div>

                        <div class="welcome-title">
                            How can I help you?
                        </div>

                        <div class="welcome-text">
                            Ask. Get answers.
                        </div>

                    </div>

                </div>

                <div
                    class="typing"
                    id="typing"
                >

                    <span>AskOra is thinking</span>

                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>

                </div>

            </div>

        </div>


        <!-- RECORDING -->

        <div
            class="recording-panel"
            id="recordingPanel"
        >

            <div class="recording-top">

                <div class="recording-dot"></div>

                <div class="recording-time">
                    Recording
                    <span id="recordingTime">
                        00:00
                    </span>
                </div>

            </div>

            <div class="recording-actions">

                <button id="cancelRecording">
                    Cancel
                </button>

                <button
                    class="stop"
                    id="stopRecording"
                >
                    Stop & send
                </button>

            </div>

        </div>


        <!-- COMPOSER -->

        <div class="composer-wrap">

            <form
                class="composer"
                id="composer"
            >

                <button
                    type="button"
                    class="icon-button"
                    id="micButton"
                    title="Voice"
                    aria-label="Voice"
                >
                    🎙️
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="12000"
                    placeholder="Message AskOra..."
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    class="icon-button send-button"
                    id="sendButton"
                    title="Send"
                    aria-label="Send"
                >
                    ➤
                </button>

            </form>

        </div>

    </main>

</div>


<script>

    const csrfToken = {{ csrf_token|tojson }};

    let currentChatId = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStartedAt = null;
    let recordingTimer = null;


    // ======================================================
    // ELEMENTS
    // ======================================================

    const sidebar =
        document.getElementById("sidebar");

    const sidebarOverlay =
        document.getElementById("sidebarOverlay");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const newChatButton =
        document.getElementById("newChatButton");

    const chatHistory =
        document.getElementById("chatHistory");

    const messages =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    const chatScroll =
        document.getElementById("chatScroll");

    const typing =
        document.getElementById("typing");

    const composer =
        document.getElementById("composer");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const micButton =
        document.getElementById("micButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const recordingPanel =
        document.getElementById("recordingPanel");

    const recordingTime =
        document.getElementById("recordingTime");

    const stopRecording =
        document.getElementById("stopRecording");

    const cancelRecording =
        document.getElementById("cancelRecording");


    // ======================================================
    // HELPERS
    // ======================================================

    async function api(
        url,
        options = {}
    ) {

        options.headers = {
            ...(options.headers || {}),
            "X-CSRF-Token": csrfToken
        };

        const response =
            await fetch(url, options);

        const data =
            await response.json()
                .catch(() => ({}));

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Something went wrong."
            );
        }

        return data;
    }


    function escapeHtml(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // Simple Markdown renderer
    function renderMarkdown(text) {

        let html =
            escapeHtml(text);

        html = html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );

        html = html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );

        html = html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

        html = html.replace(
            /^### (.*)$/gm,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /^## (.*)$/gm,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /^# (.*)$/gm,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /\n/g,
            "<br>"
        );

        return html;
    }


    function scrollToBottom() {

        requestAnimationFrame(() => {

            chatScroll.scrollTop =
                chatScroll.scrollHeight;

        });
    }


    function closeMobileSidebar() {

        sidebar.classList.remove("open");

        sidebarOverlay.classList.remove(
            "show"
        );
    }


    // ======================================================
    // MOBILE MENU
    // ======================================================

    mobileMenu.addEventListener(
        "click",
        () => {

            sidebar.classList.add(
                "open"
            );

            sidebarOverlay.classList.add(
                "show"
            );

        }
    );


    sidebarOverlay.addEventListener(
        "click",
        closeMobileSidebar
    );


    // ======================================================
    // ADD MESSAGE
    // ======================================================

    function addMessage(
        role,
        content
    ) {

        if (welcome) {
            welcome.style.display =
                "none";
        }

        const message =
            document.createElement("div");

        message.className =
            "message";

        const isUser =
            role === "user";

        message.innerHTML = `

            <div class="avatar ${isUser ? "user" : "ai"}">
                ${isUser ? "You" : "A"}
            </div>

            <div class="message-body">

                <div class="message-name">
                    ${isUser ? "You" : "AskOra"}
                </div>

                <div class="message-content">
                    ${isUser
                        ? escapeHtml(content)
                            .replace(/\n/g, "<br>")
                        : renderMarkdown(content)
                    }
                </div>

            </div>
        `;

        messages.insertBefore(
            message,
            typing
        );

        scrollToBottom();
    }


    // ======================================================
    // LOAD CHATS
    // ======================================================

    async function loadChats() {

        try {

            const data =
                await api("/api/chats");

            chatHistory.innerHTML = "";

            if (!data.chats.length) {

                await createFirstChat();

                return;
            }

            data.chats.forEach(
                chat => {

                    addChatToSidebar(
                        chat
                    );

                }
            );

            if (!currentChatId) {

                await selectChat(
                    data.chats[0].id
                );

            }

        } catch (error) {

            console.error(error);

        }
    }


    // ======================================================
    // SIDEBAR CHAT
    // ======================================================

    function addChatToSidebar(chat) {

        const item =
            document.createElement("div");

        item.className =
            "chat-item";

        item.dataset.chatId =
            chat.id;

        item.innerHTML = `

            <div
                class="chat-item-content"
                title="${escapeHtml(chat.title)}"
            >
                <div class="chat-item-title">
                    ${escapeHtml(chat.title)}
                </div>
            </div>

            <button
                class="delete-chat"
                title="Delete chat"
                aria-label="Delete chat"
            >
                ×
            </button>
        `;

        const deleteButton =
            item.querySelector(
                ".delete-chat"
            );

        deleteButton.addEventListener(
            "click",
            async (event) => {

                event.stopPropagation();

                await deleteChat(
                    chat.id
                );

            }
        );

        item.addEventListener(
            "click",
            () => {

                selectChat(
                    chat.id
                );

                closeMobileSidebar();

            }
        );

        chatHistory.appendChild(
            item
        );
    }


    // ======================================================
    // CREATE FIRST CHAT
    // ======================================================

    async function createFirstChat() {

        try {

            const data =
                await api(
                    "/api/chats",
                    {
                        method: "POST"
                    }
                );

            chatHistory.innerHTML = "";

            addChatToSidebar(
                data.chat
            );

            currentChatId =
                data.chat.id;

            setActiveChat();

        } catch (error) {

            console.error(error);

        }
    }


    // ======================================================
    // NEW CHAT
    // ======================================================

    newChatButton.addEventListener(
        "click",
        async () => {

            try {

                const data =
                    await api(
                        "/api/chats",
                        {
                            method: "POST"
                        }
                    );

                addChatToSidebar(
                    data.chat
                );

                await selectChat(
                    data.chat.id
                );

                closeMobileSidebar();

            } catch (error) {

                alert(error.message);

            }

        }
    );


    // ======================================================
    // SELECT CHAT
    // ======================================================

    async function selectChat(chatId) {

        currentChatId =
            chatId;

        setActiveChat();

        messages
            .querySelectorAll(".message")
            .forEach(
                element => element.remove()
            );

        welcome.style.display =
            "none";

        typing.classList.remove(
            "show"
        );

        try {

            const data =
                await api(
                    `/api/chats/${chatId}/messages`
                );

            if (!data.messages.length) {

                welcome.style.display =
                    "flex";

            }

            data.messages.forEach(
                message => {

                    addMessage(
                        message.role,
                        message.content
                    );

                }
            );

            scrollToBottom();

        } catch (error) {

            console.error(error);

        }
    }


    // ======================================================
    // ACTIVE CHAT
    // ======================================================

    function setActiveChat() {

        document
            .querySelectorAll(".chat-item")
            .forEach(item => {

                item.classList.toggle(
                    "active",
                    String(
                        item.dataset.chatId
                    ) === String(
                        currentChatId
                    )
                );

            });

    }


    // ======================================================
    // DELETE CHAT
    // ======================================================

    async function deleteChat(
        chatId
    ) {

        const confirmed =
            confirm(
                "Delete this chat? This cannot be undone."
            );

        if (!confirmed) {
            return;
        }

        try {

            await api(
                `/api/chats/${chatId}`,
                {
                    method: "DELETE"
                }
            );

            const item =
                document.querySelector(
                    `.chat-item[data-chat-id="${chatId}"]`
                );

            if (item) {
                item.remove();
            }

            if (
                String(chatId) ===
                String(currentChatId)
            ) {

                currentChatId =
                    null;

                messages
                    .querySelectorAll(
                        ".message"
                    )
                    .forEach(
                        element =>
                            element.remove()
                    );

                welcome.style.display =
                    "flex";

                const remaining =
                    document.querySelector(
                        ".chat-item"
                    );

                if (remaining) {

                    await selectChat(
                        remaining.dataset.chatId
                    );

                } else {

                    await createFirstChat();

                }

            }

        } catch (error) {

            alert(error.message);

        }
    }


    // ======================================================
    // SEND MESSAGE
    // ======================================================

    composer.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const text =
                messageInput.value.trim();

            if (!text) {
                return;
            }

            messageInput.value = "";

            resizeTextarea();

            addMessage(
                "user",
                text
            );

            typing.classList.add(
                "show"
            );

            sendButton.disabled =
                true;

            scrollToBottom();

            try {

                const data =
                    await api(
                        "/api/chat",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                message: text,
                                chat_id:
                                    currentChatId
                            })
                        }
                    );

                currentChatId =
                    data.chat_id;

                typing.classList.remove(
                    "show"
                );

                addMessage(
                    "assistant",
                    data.answer
                );

                await refreshSidebar();

            } catch (error) {

                typing.classList.remove(
                    "show"
                );

                addMessage(
                    "assistant",
                    "Sorry, something went wrong. Please try again."
                );

                console.error(error);

            } finally {

                sendButton.disabled =
                    false;

                messageInput.focus();

            }

        }
    );


    // ======================================================
    // REFRESH SIDEBAR
    // ======================================================

    async function refreshSidebar() {

        try {

            const data =
                await api("/api/chats");

            chatHistory.innerHTML = "";

            data.chats.forEach(
                chat => {

                    addChatToSidebar(
                        chat
                    );

                }
            );

            setActiveChat();

        } catch (error) {

            console.error(error);

        }
    }


    // ======================================================
    // TEXTAREA
    // ======================================================

    function resizeTextarea() {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                180
            ) + "px";
    }


    messageInput.addEventListener(
        "input",
        resizeTextarea
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                composer.requestSubmit();

            }

        }
    );


    // ======================================================
    // VOICE
    // ======================================================

    micButton.addEventListener(
        "click",
        startRecording
    );


    async function startRecording() {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            alert(
                "Your browser does not support voice recording."
            );

            return;
        }

        try {

            const stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio: true
                    });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(stream);

            mediaRecorder.ondataavailable =
                event => {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                };

            mediaRecorder.onstop =
                async () => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    "audio/webm"
                            }
                        );

                    await sendVoice(
                        blob
                    );

                };

            mediaRecorder.start();

            recordingStartedAt =
                Date.now();

            recordingPanel.classList.add(
                "show"
            );

            updateRecordingTimer();

            recordingTimer =
                setInterval(
                    updateRecordingTimer,
                    1000
                );

        } catch (error) {

            alert(
                "Microphone permission is required to use voice."
            );

            console.error(error);

        }

    }


    function updateRecordingTimer() {

        if (!recordingStartedAt) {
            return;
        }

        const elapsed =
            Math.floor(
                (
                    Date.now() -
                    recordingStartedAt
                ) / 1000
            );

        const minutes =
            String(
                Math.floor(
                    elapsed / 60
                )
            ).padStart(2, "0");

        const seconds =
            String(
                elapsed % 60
            ).padStart(2, "0");

        recordingTime.textContent =
            `${minutes}:${seconds}`;
    }


    stopRecording.addEventListener(
        "click",
        () => {

            if (
                mediaRecorder &&
                mediaRecorder.state !==
                    "inactive"
            ) {

                mediaRecorder.stop();

            }

            stopRecording.disabled =
                true;

            clearInterval(
                recordingTimer
            );

        }
    );


    cancelRecording.addEventListener(
        "click",
        () => {

            if (
                mediaRecorder &&
                mediaRecorder.state !==
                    "inactive"
            ) {

                mediaRecorder.onstop =
                    null;

                mediaRecorder.stop();

            }

            if (mediaRecorder) {

                if (
                    mediaRecorder.stream
                ) {

                    mediaRecorder.stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }

            }

            audioChunks = [];

            mediaRecorder = null;

            recordingPanel.classList.remove(
                "show"
            );

            clearInterval(
                recordingTimer
            );

            recordingTime.textContent =
                "00:00";

            stopRecording.disabled =
                false;

        }
    );


    async function sendVoice(
        blob
    ) {

        recordingPanel.classList.remove(
            "show"
        );

        clearInterval(
            recordingTimer
        );

        recordingTime.textContent =
            "00:00";

        stopRecording.disabled =
            false;

        typing.classList.add(
            "show"
        );

        const formData =
            new FormData();

        formData.append(
            "audio",
            blob,
            "recording.webm"
        );

        if (currentChatId) {

            formData.append(
                "chat_id",
                currentChatId
            );

        }

        try {

            const response =
                await fetch(
                    "/api/voice",
                    {
                        method: "POST",
                        headers: {
                            "X-CSRF-Token":
                                csrfToken
                        },
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Voice processing failed."
                );

            }

            currentChatId =
                data.chat_id;

            addMessage(
                "user",
                data.transcription
            );

            addMessage(
                "assistant",
                data.answer
            );

            await refreshSidebar();

        } catch (error) {

            addMessage(
                "assistant",
                "Sorry, I couldn't process that voice message."
            );

            console.error(error);

        } finally {

            typing.classList.remove(
                "show"
            );

            mediaRecorder =
                null;

            audioChunks = [];

        }

    }


    // ======================================================
    // LOGOUT
    // ======================================================

    logoutButton.addEventListener(
        "click",
        async () => {

            try {

                const response =
                    await fetch(
                        "/logout",
                        {
                            method: "POST",
                            headers: {
                                "X-CSRF-Token":
                                    csrfToken
                            }
                        }
                    );

                window.location.href =
                    "/login";

            } catch (error) {

                console.error(error);

            }

        }
    );


    // ======================================================
    // START
    // ======================================================

    loadChats();

    messageInput.focus();

</script>

</body>
</html>
