<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra — Ask. Get answers.</title>

    <meta
        name="description"
        content="AskOra is a fast and simple AI assistant. Ask questions, get answers, and keep your conversations organized."
    >

    <style>
        :root {
            --deep-space: #080B18;
            --midnight: #10152B;
            --panel: #0D1224;
            --panel-2: #12182D;
            --blue: #3B82F6;
            --violet: #7C3AED;
            --white: #F5F7FF;
            --gray: #9CA3AF;
            --gray-2: #6B7280;
            --border: rgba(255,255,255,.08);
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--deep-space);
            color: var(--white);
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           APP LAYOUT
        ========================= */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(59,130,246,.08),
                    transparent 30%
                ),
                var(--deep-space);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(13,18,36,.96);
            border-right: 1px solid var(--border);
            z-index: 50;
        }

        .sidebar-top {
            padding: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,.22),
                    rgba(124,58,237,.28)
                );
            border: 1px solid rgba(255,255,255,.09);
            box-shadow:
                0 0 25px rgba(59,130,246,.12);
            font-weight: 800;
            color: #fff;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .brand-tagline {
            color: var(--gray);
            font-size: 11px;
            margin-top: 1px;
        }

        .new-chat-button {
            width: 100%;
            height: 42px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 11px;
            background: #171E38;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 650;
            transition: .18s ease;
        }

        .new-chat-button:hover {
            background: #1C2544;
            border-color: rgba(255,255,255,.14);
        }

        .search-wrap {
            padding: 0 18px 12px;
        }

        .search-input {
            width: 100%;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0A0F20;
            color: var(--white);
            outline: none;
            padding: 0 12px;
            font-size: 13px;
        }

        .search-input:focus {
            border-color: rgba(59,130,246,.55);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px 14px;
        }

        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-thumb,
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.08);
            border-radius: 20px;
        }

        .chat-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 11px;
            border-radius: 9px;
            color: #D9DEEA;
            background: transparent;
            border: 0;
            text-align: left;
            margin-bottom: 2px;
            transition: .15s ease;
        }

        .chat-item:hover {
            background: rgba(255,255,255,.045);
        }

        .chat-item.active {
            background: #171E38;
        }

        .chat-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-size: 13px;
        }

        .chat-delete {
            width: 25px;
            height: 25px;
            border: 0;
            background: transparent;
            color: var(--gray-2);
            border-radius: 7px;
            opacity: 0;
            transition: .15s ease;
            flex-shrink: 0;
        }

        .chat-item:hover .chat-delete {
            opacity: 1;
        }

        .chat-delete:hover {
            background: rgba(239,68,68,.12);
            color: #F87171;
        }

        .sidebar-bottom {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .side-button {
            width: 100%;
            min-height: 38px;
            padding: 8px 11px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #C9D0DF;
            text-align: left;
            transition: .15s ease;
            margin-bottom: 3px;
        }

        .side-button:hover {
            background: rgba(255,255,255,.05);
            color: white;
        }

        .account-box {
            margin-top: 8px;
            padding: 10px 11px;
            border-radius: 10px;
            background: #0A0F20;
            border: 1px solid var(--border);
        }

        .account-name {
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-email {
            color: var(--gray);
            font-size: 11px;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,11,24,.88);
            backdrop-filter: blur(14px);
            position: relative;
            z-index: 20;
        }

        .mobile-menu {
            display: none;
            width: 36px;
            height: 36px;
            border: 0;
            background: transparent;
            color: var(--white);
            font-size: 21px;
            margin-right: 8px;
        }

        .topbar-info {
            min-width: 0;
        }

        .topbar-title {
            font-size: 15px;
            font-weight: 800;
        }

        .topbar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #86EFAC;
            font-size: 11px;
            margin-top: 2px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #22C55E;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34,197,94,.7);
        }

        .topbar-right {
            margin-left: auto;
            color: var(--gray);
            font-size: 11px;
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px 170px;
        }

        .messages-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .welcome {
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 10px;
        }

        .welcome-logo {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,.25),
                    rgba(124,58,237,.32)
                );
            border: 1px solid rgba(255,255,255,.1);
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 18px;
            box-shadow:
                0 0 45px rgba(59,130,246,.11);
        }

        .welcome h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -.045em;
        }

        .welcome p {
            color: var(--gray);
            max-width: 500px;
            line-height: 1.6;
            margin: 10px auto 0;
            font-size: 14px;
        }

        .message {
            display: flex;
            width: 100%;
            margin: 0 auto 24px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: min(720px, 88%);
            line-height: 1.65;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #18213B;
            border: 1px solid rgba(255,255,255,.06);
            padding: 10px 14px;
            border-radius: 16px 16px 5px 16px;
            color: #F4F6FC;
        }

        .message.assistant .message-content {
            color: #E6EAF3;
            padding: 3px 0;
        }

        .message-content p {
            margin: 0 0 10px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3 {
            margin: 18px 0 8px;
            line-height: 1.3;
        }

        .message-content ul,
        .message-content ol {
            margin: 8px 0 12px 20px;
        }

        .message-content li {
            margin: 4px 0;
        }

        .message-content code {
            background: rgba(255,255,255,.07);
            padding: 2px 5px;
            border-radius: 5px;
            font-size: .92em;
        }

        .message-content pre {
            overflow-x: auto;
            background: #090D1B;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px;
            margin: 12px 0;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
        }

        .message-content blockquote {
            border-left: 3px solid var(--blue);
            padding-left: 12px;
            color: #B7C0D4;
            margin: 12px 0;
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-wrap {
            position: absolute;
            left: 270px;
            right: 0;
            bottom: 0;
            padding: 18px 20px 20px;
            pointer-events: none;
            background:
                linear-gradient(
                    to top,
                    rgba(8,11,24,1) 20%,
                    rgba(8,11,24,.93) 55%,
                    transparent
                );
        }

        .composer {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            pointer-events: auto;
        }

        .composer-inner {
            display: flex;
            align-items: flex-end;
            gap: 7px;
            min-height: 58px;
            padding: 8px;
            border-radius: 17px;
            background: #11172C;
            border: 1px solid rgba(255,255,255,.09);
            box-shadow:
                0 12px 40px rgba(0,0,0,.25);
        }

        .composer textarea {
            flex: 1;
            min-width: 0;
            min-height: 40px;
            max-height: 170px;
            resize: none;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--white);
            padding: 10px 6px;
            line-height: 1.45;
            font-size: 14px;
        }

        .composer textarea::placeholder {
            color: #737B8D;
        }

        /* =========================
           CHATGPT STYLE MICROPHONE
        ========================= */

        .icon-button {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #AAB2C3;
            font-size: 18px;
            transition: .18s ease;
        }

        .icon-button:hover {
            background: #1A2038;
            color: #F5F7FF;
            transform: scale(1.04);
        }

        .icon-button.recording {
            background: #EF4444;
            color: white;
            box-shadow:
                0 0 0 5px rgba(239,68,68,.12);
            animation: micPulse 1.2s infinite;
        }

        @keyframes micPulse {
            0%,
            100% {
                box-shadow:
                    0 0 0 4px rgba(239,68,68,.10);
            }

            50% {
                box-shadow:
                    0 0 0 9px rgba(239,68,68,.04);
            }
        }

        .send-button {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: var(--white);
            color: #0A0F20;
            transition: .18s ease;
        }

        .send-button:hover {
            transform: scale(1.04);
            background: white;
        }

        .send-button:disabled {
            opacity: .35;
            cursor: default;
            transform: none;
        }

        .composer-hint {
            text-align: center;
            color: #687084;
            font-size: 10px;
            margin-top: 8px;
        }

        /* =========================
           RECORDING BAR
        ========================= */

        .recording {
            align-items: center;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EF4444;
            margin-left: 7px;
            box-shadow: 0 0 12px rgba(239,68,68,.6);
            animation: recordingDot 1s infinite;
        }

        @keyframes recordingDot {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        .recording-time {
            font-variant-numeric: tabular-nums;
            color: #FCA5A5;
            font-size: 13px;
            font-weight: 700;
            min-width: 42px;
        }

        .recording-label {
            color: var(--gray);
            font-size: 13px;
            flex: 1;
        }

        .cancel-recording {
            border: 0;
            background: transparent;
            color: #9CA3AF;
            padding: 8px 10px;
        }

        .cancel-recording:hover {
            color: white;
        }

        .recording-stop {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #EF4444;
            color: white;
            display: grid;
            place-items: center;
        }

        .recording-stop:hover {
            background: #DC2626;
        }

        /* =========================
           LOADING
        ========================= */

        .typing {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 0;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8791A7;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: .45;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* =========================
           MOBILE OVERLAY
        ========================= */

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 40;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                transition: left .22s ease;
                box-shadow: 20px 0 50px rgba(0,0,0,.25);
            }

            .sidebar.open {
                left: 0;
            }

            .sidebar-overlay.open {
                display: block;
            }

            .mobile-menu {
                display: grid;
                place-items: center;
            }

            .composer-wrap {
                left: 0;
                padding-left: 12px;
                padding-right: 12px;
            }

            .topbar {
                padding: 0 12px;
            }

            .topbar-right {
                display: none;
            }

            .messages {
                padding-left: 13px;
                padding-right: 13px;
                padding-bottom: 165px;
            }

            .message-content {
                max-width: 94%;
            }

            .composer-hint {
                display: none;
            }
        }

        @media (max-width: 450px) {
            .composer-inner {
                border-radius: 15px;
            }

            .composer textarea {
                font-size: 13px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .welcome p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <div class="brand-logo">A</div>

                <div class="brand-text">
                    <div class="brand-name">AskOra</div>
                    <div class="brand-tagline">
                        Advanced AI, made simple.
                    </div>
                </div>
            </div>

            <button
                class="new-chat-button"
                onclick="createNewChat()"
            >
                ＋ New chat
            </button>

        </div>

        <div class="search-wrap">
            <input
                class="search-input"
                id="chatSearch"
                type="text"
                placeholder="Search chats..."
                oninput="renderChats()"
            >
        </div>

        <div
            class="chat-list"
            id="chatList"
        ></div>

        <div class="sidebar-bottom">

            <!-- ADMIN BUTTON -->
            <button
                class="side-button"
                id="adminButton"
                style="display:none"
                onclick="window.location.href='/admin'"
            >
                ⚙ Admin dashboard
            </button>

            <button
                class="side-button"
                onclick="logout()"
            >
                ↪ Log out
            </button>

            <button
                class="side-button"
                onclick="deleteAccount()"
            >
                🗑 Delete account
            </button>

            <div class="account-box">

                <div
                    class="account-name"
                    id="accountName"
                >
                    Account
                </div>

                <div
                    class="account-email"
                    id="accountEmail"
                >
                    —
                </div>

            </div>

        </div>

    </aside>

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="closeSidebar()"
    ></div>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <button
                class="mobile-menu"
                onclick="toggleSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="topbar-info">

                <div class="topbar-title">
                    AskOra
                </div>

                <div class="topbar-status">
                    <span class="online-dot"></span>
                    Online
                    <span>·</span>
                    Ask. Get answers.
                </div>

            </div>

            <div class="topbar-right">
                Advanced AI, made simple.
            </div>

        </header>

        <!-- MESSAGES -->
        <section
            class="messages"
            id="messages"
        >

            <div
                class="messages-inner"
                id="messagesInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>
                        How can I help?
                    </h1>

                    <p>
                        Ask anything. Get clear, useful answers from
                        AskOra — your simple AI assistant.
                    </p>

                </div>

            </div>

        </section>

        <!-- COMPOSER -->
        <div class="composer-wrap">

            <div class="composer">

                <!-- NORMAL COMPOSER -->
                <div
                    class="composer-inner"
                    id="composerNormal"
                >

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message AskOra..."
                        oninput="autoResize(this)"
                        onkeydown="handleInputKeydown(event)"
                    ></textarea>

                    <!-- CHATGPT STYLE MIC -->
                    <button
                        class="icon-button"
                        id="micButton"
                        type="button"
                        title="Voice input"
                        onclick="startRecording()"
                        aria-label="Voice input"
                    >

                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect
                                x="9"
                                y="2"
                                width="6"
                                height="12"
                                rx="3"
                            ></rect>

                            <path
                                d="M5 10a7 7 0 0 0 14 0"
                            ></path>

                            <line
                                x1="12"
                                y1="19"
                                x2="12"
                                y2="22"
                            ></line>

                            <line
                                x1="8"
                                y1="22"
                                x2="16"
                                y2="22"
                            ></line>
                        </svg>

                    </button>

                    <button
                        class="send-button"
                        id="sendButton"
                        type="button"
                        onclick="sendMessage()"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </div>

                <!-- RECORDING COMPOSER -->
                <div
                    class="composer-inner recording"
                    id="recordingBar"
                    style="display:none"
                >

                    <span class="recording-dot"></span>

                    <span
                        class="recording-time"
                        id="recordingTime"
                    >
                        00:00
                    </span>

                    <span class="recording-label">
                        Listening...
                    </span>

                    <button
                        class="cancel-recording"
                        type="button"
                        onclick="cancelRecording()"
                    >
                        Cancel
                    </button>

                    <button
                        class="recording-stop"
                        type="button"
                        onclick="stopRecording()"
                        aria-label="Stop recording"
                    >
                        ■
                    </button>

                </div>

                <div class="composer-hint">
                    AskOra can make mistakes. Check important information.
                </div>

            </div>

        </div>

    </main>

</div>

<script>
    const CSRF = {{ (csrf_token or "")|tojson }};

    let currentUser = null;
    let chats = [];
    let currentChatId = null;

    let mediaRecorder = null;
    let audioChunks = [];

    let recordingTimer = null;
    let recordingSeconds = 0;


    /* =========================
       API HELPER
    ========================= */

    async function apiFetch(url, options = {}) {

        options.headers = options.headers || {};

        if (CSRF) {
            options.headers["X-CSRFToken"] = CSRF;
        }

        const response = await fetch(url, options);

        let data = {};

        try {
            data = await response.json();
        } catch (error) {
            data = {};
        }

        if (!response.ok) {
            throw new Error(
                data.error ||
                data.message ||
                "Something went wrong."
            );
        }

        return data;
    }


    /* =========================
       INIT
    ========================= */

    async function initApp() {

        try {

            const response =
                await fetch("/api/me");

            const data =
                await response.json();

            if (
                !data.authenticated ||
                !data.user
            ) {
                window.location.href = "/login";
                return;
            }

            currentUser = data.user;

            /* ADMIN BUTTON */
            const adminButton =
                document.getElementById("adminButton");

            if (
                adminButton &&
                currentUser.is_admin === true
            ) {
                adminButton.style.display = "block";
            }

            document.getElementById("accountName")
                .textContent =
                currentUser.username || "Account";

            document.getElementById("accountEmail")
                .textContent =
                currentUser.email || "—";

            await loadChats();

            if (!chats.length) {
                await createNewChat();
            }

            renderChats();

            if (currentChatId) {
                await loadMessages(currentChatId);
            }

        } catch (error) {

            console.error(error);

            window.location.href = "/login";
        }
    }


    /* =========================
       CHATS
    ========================= */

    async function loadChats() {

        const data =
            await apiFetch("/api/chats");

        chats = data.chats || [];

        if (
            currentChatId &&
            !chats.some(
                chat => chat.id === currentChatId
            )
        ) {
            currentChatId = null;
        }
    }


    function renderChats() {

        const list =
            document.getElementById("chatList");

        const search =
            document
                .getElementById("chatSearch")
                .value
                .trim()
                .toLowerCase();

        list.innerHTML = "";

        const filtered =
            chats.filter(chat =>
                (chat.title || "New chat")
                    .toLowerCase()
                    .includes(search)
            );

        filtered.forEach(chat => {

            const item =
                document.createElement("button");

            item.className =
                "chat-item" +
                (
                    chat.id === currentChatId
                        ? " active"
                        : ""
                );

            item.onclick = () =>
                openChat(chat.id);

            const title =
                document.createElement("span");

            title.className =
                "chat-item-title";

            title.textContent =
                chat.title || "New chat";

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "chat-delete";

            deleteButton.type = "button";

            deleteButton.textContent = "×";

            deleteButton.title =
                "Delete chat";

            deleteButton.onclick =
                async event => {

                    event.stopPropagation();

                    await deleteChat(chat.id);
                };

            item.appendChild(title);
            item.appendChild(deleteButton);

            list.appendChild(item);
        });
    }


    async function createNewChat() {

        try {

            const data =
                await apiFetch(
                    "/api/chats",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            title: "New chat"
                        })
                    }
                );

            currentChatId =
                data.chat.id;

            chats.unshift(data.chat);

            renderChats();

            clearMessages();

            closeSidebar();

            document
                .getElementById("messageInput")
                .focus();

        } catch (error) {

            alert(error.message);
        }
    }


    async function openChat(chatId) {

        currentChatId =
            chatId;

        renderChats();

        await loadMessages(chatId);

        closeSidebar();
    }


    async function deleteChat(chatId) {

        const confirmed =
            confirm(
                "Delete this conversation?"
            );

        if (!confirmed) {
            return;
        }

        try {

            await apiFetch(
                `/api/chats/${chatId}`,
                {
                    method: "DELETE"
                }
            );

            chats =
                chats.filter(
                    chat => chat.id !== chatId
                );

            if (currentChatId === chatId) {

                currentChatId =
                    chats.length
                        ? chats[0].id
                        : null;

                clearMessages();

                if (currentChatId) {
                    await loadMessages(currentChatId);
                }
            }

            renderChats();

        } catch (error) {

            alert(error.message);
        }
    }


    /* =========================
       MESSAGES
    ========================= */

    function clearMessages() {

        const inner =
            document.getElementById(
                "messagesInner"
            );

        inner.innerHTML = "";

        const welcome =
            document.createElement("div");

        welcome.className =
            "welcome";

        welcome.id =
            "welcome";

        welcome.innerHTML = `
            <div class="welcome-logo">A</div>
            <h1>How can I help?</h1>
            <p>
                Ask anything. Get clear, useful answers
                from AskOra — your simple AI assistant.
            </p>
        `;

        inner.appendChild(welcome);
    }


    async function loadMessages(chatId) {

        clearMessages();

        try {

            const data =
                await apiFetch(
                    `/api/chats/${chatId}/messages`
                );

            const messages =
                data.messages || [];

            if (!messages.length) {
                return;
            }

            const welcome =
                document.getElementById("welcome");

            if (welcome) {
                welcome.remove();
            }

            messages.forEach(message => {

                appendMessage(
                    message.role,
                    message.content
                );
            });

            scrollToBottom();

        } catch (error) {

            console.error(error);
        }
    }


    function appendMessage(role, content) {

        const inner =
            document.getElementById(
                "messagesInner"
            );

        const wrapper =
            document.createElement("div");

        wrapper.className =
            `message ${role}`;

        const messageContent =
            document.createElement("div");

        messageContent.className =
            "message-content";

        if (role === "assistant") {

            messageContent.innerHTML =
                formatMarkdown(content);

        } else {

            messageContent.textContent =
                content;
        }

        wrapper.appendChild(
            messageContent
        );

        inner.appendChild(wrapper);

        return wrapper;
    }


    /* =========================
       MARKDOWN
    ========================= */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;
    }


    function formatMarkdown(text) {

        if (!text) {
            return "";
        }

        let html =
            escapeHtml(text);

        const codeBlocks = [];

        html =
            html.replace(
                /```([\s\S]*?)```/g,
                function(match, code) {

                    const index =
                        codeBlocks.length;

                    codeBlocks.push(code);

                    return `___CODEBLOCK_${index}___`;
                }
            );

        html =
            html.replace(
                /^### (.*)$/gm,
                "<h3>$1</h3>"
            );

        html =
            html.replace(
                /^## (.*)$/gm,
                "<h2>$1</h2>"
            );

        html =
            html.replace(
                /^# (.*)$/gm,
                "<h1>$1</h1>"
            );

        html =
            html.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );

        html =
            html.replace(
                /`([^`]+)`/g,
                "<code>$1</code>"
            );

        html =
            html.replace(
                /^\- (.*)$/gm,
                "<li>$1</li>"
            );

        html =
            html.replace(
                /(<li>.*<\/li>)/gs,
                "<ul>$1</ul>"
            );

        html =
            html.replace(
                /^> (.*)$/gm,
                "<blockquote>$1</blockquote>"
            );

        html =
            html.replace(
                /\n/g,
                "<br>"
            );

        codeBlocks.forEach(
            (code, index) => {

                const safeCode =
                    escapeHtml(code.trim());

                html =
                    html.replace(
                        `___CODEBLOCK_${index}___`,
                        `<pre><code>${safeCode}</code></pre>`
                    );
            }
        );

        return html;
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );

        const button =
            document.getElementById(
                "sendButton"
            );

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        if (!currentChatId) {

            await createNewChat();

            if (!currentChatId) {
                return;
            }
        }

        input.value = "";
        input.style.height = "auto";

        button.disabled = true;

        const welcome =
            document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }

        appendMessage(
            "user",
            message
        );

        scrollToBottom();

        const loading =
            appendMessage(
                "assistant",
                ""
            );

        loading
            .querySelector(".message-content")
            .innerHTML = `
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

        scrollToBottom();

        try {

            const data =
                await apiFetch(
                    "/api/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            chat_id:
                                currentChatId,
                            message:
                                message
                        })
                    }
                );

            loading
                .querySelector(".message-content")
                .innerHTML =
                formatMarkdown(
                    data.answer || ""
                );

            if (data.title) {

                const chat =
                    chats.find(
                        item =>
                            item.id ===
                            currentChatId
                    );

                if (chat) {
                    chat.title =
                        data.title;
                }

                renderChats();
            }

            scrollToBottom();

        } catch (error) {

            loading
                .querySelector(".message-content")
                .textContent =
                "⚠️ " + error.message;

        } finally {

            button.disabled = false;

            input.focus();
        }
    }


    /* =========================
       KEYBOARD
    ========================= */

    function handleInputKeydown(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();

            sendMessage();
        }
    }


    function autoResize(textarea) {

        textarea.style.height =
            "auto";

        textarea.style.height =
            Math.min(
                textarea.scrollHeight,
                170
            ) + "px";
    }


    /* =========================
       VOICE RECORDING
    ========================= */

    async function startRecording() {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            alert(
                "Voice recording is not supported on this device/browser."
            );

            return;
        }

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {
            return;
        }

        try {

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(stream);

            mediaRecorder.ondataavailable =
                event => {

                    if (event.data.size > 0) {
                        audioChunks.push(
                            event.data
                        );
                    }
                };

            mediaRecorder.onstop =
                async () => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                    if (
                        audioChunks.length
                    ) {
                        await sendRecording();
                    }
                };

            mediaRecorder.start();

            /* MIC RECORDING STATE */
            const micButton =
                document.getElementById(
                    "micButton"
                );

            if (micButton) {
                micButton.classList.add(
                    "recording"
                );
            }

            recordingSeconds = 0;

            updateRecordingTime();

            recordingTimer =
                setInterval(
                    () => {

                        recordingSeconds++;

                        updateRecordingTime();

                    },
                    1000
                );

            document
                .getElementById(
                    "composerNormal"
                )
                .style.display = "none";

            document
                .getElementById(
                    "recordingBar"
                )
                .style.display = "flex";

        } catch (error) {

            console.error(error);

            alert(
                "Microphone permission was denied or unavailable."
            );
        }
    }


    function updateRecordingTime() {

        const minutes =
            Math.floor(
                recordingSeconds / 60
            );

        const seconds =
            recordingSeconds % 60;

        document
            .getElementById(
                "recordingTime"
            )
            .textContent =
            `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }


    function stopRecording() {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {
            mediaRecorder.stop();
        }

        clearInterval(
            recordingTimer
        );

        recordingTimer = null;

        const micButton =
            document.getElementById(
                "micButton"
            );

        if (micButton) {
            micButton.classList.remove(
                "recording"
            );
        }

        document
            .getElementById(
                "recordingBar"
            )
            .style.display = "none";

        document
            .getElementById(
                "composerNormal"
            )
            .style.display = "flex";
    }


    function cancelRecording() {

        if (mediaRecorder) {

            mediaRecorder.onstop = null;

            if (
                mediaRecorder.state !==
                "inactive"
            ) {
                mediaRecorder.stop();
            }

            mediaRecorder = null;
        }

        audioChunks = [];

        clearInterval(
            recordingTimer
        );

        recordingTimer = null;

        recordingSeconds = 0;

        const micButton =
            document.getElementById(
                "micButton"
            );

        if (micButton) {
            micButton.classList.remove(
                "recording"
            );
        }

        document
            .getElementById(
                "recordingBar"
            )
            .style.display = "none";

        document
            .getElementById(
                "composerNormal"
            )
            .style.display = "flex";
    }


    async function sendRecording() {

        if (!audioChunks.length) {
            return;
        }

        const blob =
            new Blob(
                audioChunks,
                {
                    type: "audio/webm"
                }
            );

        audioChunks = [];

        const loading =
            appendMessage(
                "assistant",
                ""
            );

        loading
            .querySelector(".message-content")
            .innerHTML = `
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

        scrollToBottom();

        try {

            const formData =
                new FormData();

            formData.append(
                "audio",
                blob,
                "recording.webm"
            );

            const response =
                await fetch(
                    "/api/voice",
                    {
                        method: "POST",
                        headers: CSRF
                            ? {
                                "X-CSRFToken":
                                    CSRF
                            }
                            : {},
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Voice transcription failed."
                );
            }

            const text =
                (data.text || "").trim();

            if (!text) {
                throw new Error(
                    "I couldn't understand the recording."
                );
            }

            loading.remove();

            const input =
                document.getElementById(
                    "messageInput"
                );

            input.value = text;

            autoResize(input);

            await sendMessage();

        } catch (error) {

            loading
                .querySelector(".message-content")
                .textContent =
                "⚠️ " + error.message;
        }
    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

        const messages =
            document.getElementById(
                "messages"
            );

        requestAnimationFrame(
            () => {
                messages.scrollTop =
                    messages.scrollHeight;
            }
        );
    }


    /* =========================
       SIDEBAR
    ========================= */

    function toggleSidebar() {

        document
            .getElementById("sidebar")
            .classList.toggle("open");

        document
            .getElementById("sidebarOverlay")
            .classList.toggle("open");
    }


    function closeSidebar() {

        document
            .getElementById("sidebar")
            .classList.remove("open");

        document
            .getElementById("sidebarOverlay")
            .classList.remove("open");
    }


    /* =========================
       LOGOUT
    ========================= */

    async function logout() {

        try {

            await apiFetch(
                "/logout",
                {
                    method: "POST"
                }
            );

        } catch (error) {
            console.error(error);
        }

        window.location.href =
            "/login";
    }


    /* =========================
       DELETE ACCOUNT
    ========================= */

    async function deleteAccount() {

        const confirmed =
            confirm(
                "Delete your AskOra account and all of your AskOra conversations? This cannot be undone."
            );

        if (!confirmed) {
            return;
        }

        const secondConfirm =
            prompt(
                'Type DELETE to confirm.'
            );

        if (
            secondConfirm !==
            "DELETE"
        ) {
            return;
        }

        try {

            await apiFetch(
                "/api/account/delete",
                {
                    method: "POST"
                }
            );

            window.location.href =
                "/login";

        } catch (error) {

            alert(error.message);
        }
    }


    /* =========================
       START
    ========================= */

    initApp();
</script>
