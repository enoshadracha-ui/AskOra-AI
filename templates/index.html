<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra — Ask. Get answers.</title>

    <meta
        name="description"
        content="AskOra — Advanced AI, made simple."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --space: #080B18;
            --midnight: #10152B;
            --panel: #11172D;
            --panel-2: #151B34;
            --blue: #3B82F6;
            --violet: #7C3AED;
            --white: #F5F7FF;
            --gray: #9CA3AF;
            --gray-2: #687087;
            --border: rgba(255,255,255,.08);
            --danger: #EF4444;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(59,130,246,.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 20% 90%,
                    rgba(124,58,237,.08),
                    transparent 30%
                ),
                var(--space);

            color: var(--white);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 270px;
            height: 100%;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            background: rgba(8,11,24,.96);

            border-right: 1px solid var(--border);

            z-index: 20;
        }

        .sidebar-header {
            padding: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 18px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );

            box-shadow:
                0 0 24px rgba(59,130,246,.24);

            color: white;
            font-size: 18px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .new-chat-button {
            width: 100%;
            min-height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,.18),
                    rgba(124,58,237,.16)
                );

            color: var(--white);

            transition: .18s ease;
        }

        .new-chat-button:hover {
            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,.28),
                    rgba(124,58,237,.24)
                );

            transform: translateY(-1px);
        }

        .search-box {
            margin: 0 18px 14px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 40px;

            padding: 0 12px 0 37px;

            border: 1px solid var(--border);

            border-radius: 10px;

            outline: none;

            background: rgba(255,255,255,.045);

            color: var(--white);
        }

        .search-box input::placeholder {
            color: var(--gray-2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--gray);
            font-size: 15px;
        }

        .chat-history-label {
            padding: 0 18px 9px;

            color: var(--gray-2);

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 12px;
        }

        .chat-list::-webkit-scrollbar {
            width: 5px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.10);
            border-radius: 10px;
        }

        .chat-item {
            width: 100%;
            min-height: 43px;

            display: flex;
            align-items: center;

            padding: 7px 8px 7px 11px;

            border-radius: 9px;

            color: #C8CDDA;

            transition: .15s ease;

            margin-bottom: 3px;
        }

        .chat-item:hover {
            background: rgba(255,255,255,.055);
            color: white;
        }

        .chat-item.active {
            background: rgba(59,130,246,.12);
            color: white;
        }

        .chat-item-title {
            flex: 1;
            min-width: 0;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            font-size: 13px;
        }

        .delete-chat {
            width: 27px;
            height: 27px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #697188;

            opacity: 0;

            transition: .15s ease;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        .delete-chat:hover {
            background: rgba(239,68,68,.12);
            color: #F87171;
        }

        .sidebar-bottom {
            padding: 10px;
            border-top: 1px solid var(--border);
        }

        .side-button {
            width: 100%;
            min-height: 39px;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 0 10px;

            border: 0;
            border-radius: 9px;

            background: transparent;

            color: #B8C0D2;

            text-align: left;

            font-size: 13px;

            transition: .15s ease;
        }

        .side-button:hover {
            background: rgba(255,255,255,.05);
            color: white;
        }

        .side-button.danger:hover {
            color: #F87171;
            background: rgba(239,68,68,.08);
        }

        .account-card {
            margin: 7px 4px 4px;

            padding: 10px;

            border: 1px solid var(--border);

            border-radius: 11px;

            background: rgba(255,255,255,.025);
        }

        .account-name {
            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-email {
            margin-top: 3px;

            color: var(--gray-2);

            font-size: 11px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: rgba(8,11,24,.62);
        }

        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            height: 66px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            border-bottom: 1px solid var(--border);

            background: rgba(8,11,24,.82);

            backdrop-filter: blur(18px);

            position: relative;
            z-index: 10;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .mobile-menu {
            display: none;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 9px;

            background: rgba(255,255,255,.05);

            color: white;
        }

        .top-brand {
            min-width: 0;
        }

        .top-brand-name {
            font-weight: 800;
            font-size: 16px;
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-top: 2px;

            color: #8F98AA;
            font-size: 11px;
        }

        .online-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #22C55E;

            box-shadow:
                0 0 8px rgba(34,197,94,.55);
        }

        .top-tagline {
            color: var(--gray-2);
            font-size: 12px;
        }

        /* =====================================================
           CHAT AREA
        ===================================================== */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 34px 20px 160px;
        }

        .messages::-webkit-scrollbar {
            width: 7px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.08);
            border-radius: 10px;
        }

        .messages-inner {
            width: min(850px, 100%);
            margin: 0 auto;
        }

        .welcome {
            min-height: calc(100vh - 220px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px 10px;
        }

        .welcome-logo {
            width: 62px;
            height: 62px;

            display: grid;
            place-items: center;

            border-radius: 19px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );

            box-shadow:
                0 0 40px rgba(59,130,246,.22);

            font-size: 27px;
            font-weight: 900;

            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: clamp(27px, 5vw, 40px);

            letter-spacing: -1.2px;

            margin-bottom: 9px;
        }

        .welcome p {
            max-width: 500px;

            color: var(--gray);

            line-height: 1.65;

            font-size: 14px;
        }

        .welcome-sub {
            margin-top: 5px;
            color: #727B91 !important;
        }

        .message {
            display: flex;
            gap: 14px;

            margin-bottom: 28px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 9px;

            font-size: 12px;
            font-weight: 800;
        }

        .assistant .message-avatar {
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
        }

        .user .message-avatar {
            background: #252C43;
            color: #CBD3E4;
        }

        .message-body {
            min-width: 0;
            max-width: min(720px, 85%);
        }

        .user .message-body {
            order: -1;
        }

        .message-content {
            color: #E8EBF4;

            font-size: 14px;
            line-height: 1.7;

            overflow-wrap: anywhere;
        }

        .user .message-content {
            padding: 10px 14px;

            border-radius: 16px 16px 4px 16px;

            background: #202840;

            color: #F3F5FB;
        }

        .assistant .message-content {
            padding-top: 1px;
        }

        .message-content p {
            margin: 0 0 10px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content ul,
        .message-content ol {
            margin: 8px 0 12px 22px;
        }

        .message-content li {
            margin-bottom: 5px;
        }

        .message-content strong {
            color: #FFFFFF;
        }

        .message-content code {
            padding: 2px 5px;

            border-radius: 5px;

            background: rgba(255,255,255,.08);

            color: #C9D7FF;

            font-size: 12px;
        }

        .message-content pre {
            overflow-x: auto;

            margin: 12px 0;

            padding: 14px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: #0A0F20;
        }

        .message-content pre code {
            padding: 0;
            background: transparent;
            color: #DDE5FF;
        }

        .message-content blockquote {
            margin: 10px 0;

            padding: 7px 13px;

            border-left: 3px solid var(--blue);

            color: #AEB7CB;
        }

        .message-content a {
            color: #70A7FF;
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-wrap {
            position: absolute;
            left: 270px;
            right: 0;
            bottom: 0;

            padding: 12px 20px 20px;

            background:
                linear-gradient(
                    to top,
                    var(--space) 65%,
                    transparent
                );

            z-index: 15;
        }

        .composer {
            width: min(850px, 100%);
            margin: 0 auto;

            display: flex;
            align-items: flex-end;
            gap: 6px;

            padding: 7px 8px 7px 12px;

            border: 1px solid rgba(255,255,255,.10);

            border-radius: 17px;

            background: rgba(16,21,43,.94);

            box-shadow:
                0 15px 45px rgba(0,0,0,.32);

            backdrop-filter: blur(18px);
        }

        #messageInput {
            flex: 1;

            min-height: 38px;
            max-height: 160px;

            resize: none;

            border: 0;
            outline: 0;

            padding: 8px 5px;

            background: transparent;

            color: var(--white);

            line-height: 1.45;

            font-size: 14px;
        }

        #messageInput::placeholder {
            color: #707A91;
        }

        .icon-button {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 0;
            border-radius: 50%;

            background: transparent;

            color: #AAB2C3;

            font-size: 18px;

            transition: .18s ease;
        }

        .icon-button:hover {
            background: #1A2038;
            color: #F5F7FF;
            transform: scale(1.04);
        }

        .icon-button.recording {
            background: #EF4444;
            color: white;

            box-shadow:
                0 0 0 5px rgba(239,68,68,.12);

            animation: micPulse 1.2s infinite;
        }

        @keyframes micPulse {
            0%,
            100% {
                box-shadow:
                    0 0 0 5px rgba(239,68,68,.12);
            }

            50% {
                box-shadow:
                    0 0 0 9px rgba(239,68,68,.04);
            }
        }

        .send-button {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 0;
            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );

            color: white;

            transition: .18s ease;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .composer-hint {
            width: min(850px, 100%);
            margin: 7px auto 0;

            text-align: center;

            color: #596279;

            font-size: 10px;
        }

        /* =====================================================
           RECORDING
        ===================================================== */

        .recording-bar {
            position: absolute;

            left: 50%;
            bottom: 85px;

            transform: translateX(-50%);

            display: none;
            align-items: center;
            gap: 11px;

            padding: 9px 13px;

            border: 1px solid rgba(239,68,68,.22);

            border-radius: 12px;

            background: rgba(25,15,25,.96);

            color: #F5F7FF;

            box-shadow:
                0 10px 35px rgba(0,0,0,.3);

            z-index: 30;
        }

        .recording-bar.active {
            display: flex;
        }

        .recording-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #EF4444;

            animation: recordingBlink 1s infinite;
        }

        @keyframes recordingBlink {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        .recording-time {
            min-width: 40px;

            font-size: 12px;
            font-weight: 700;
        }

        .cancel-recording {
            border: 0;

            background: transparent;

            color: #AAB2C3;

            font-size: 12px;
        }

        .cancel-recording:hover {
            color: white;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;

            padding-top: 5px;
        }

        .typing span {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #8C96AC;

            animation: typingDot 1.1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes typingDot {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: .45;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* =====================================================
           MOBILE OVERLAY
        ===================================================== */

        .sidebar-overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.55);

            z-index: 19;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            right: 18px;
            bottom: 18px;

            max-width: 320px;

            padding: 11px 14px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: #171D33;

            color: #F5F7FF;

            font-size: 12px;

            box-shadow:
                0 10px 35px rgba(0,0,0,.35);

            opacity: 0;

            transform: translateY(10px);

            pointer-events: none;

            transition: .2s ease;

            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;

                transition: left .22s ease;

                z-index: 20;
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-menu {
                display: grid;
                place-items: center;
            }

            .composer-wrap {
                left: 0;
            }

            .topbar {
                padding: 0 14px;
            }

            .messages {
                padding: 25px 13px 155px;
            }

            .message-body {
                max-width: 88%;
            }

            .top-tagline {
                display: none;
            }
        }

        @media (max-width: 500px) {

            .brand-name {
                font-size: 17px;
            }

            .welcome h1 {
                font-size: 28px;
            }

            .welcome p {
                font-size: 13px;
            }

            .composer-wrap {
                padding: 9px 9px 13px;
            }

            .composer-hint {
                display: none;
            }

            .message {
                gap: 9px;
                margin-bottom: 22px;
            }

            .message-avatar {
                width: 27px;
                height: 27px;
                border-radius: 8px;
            }

            .message-content {
                font-size: 13.5px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-logo">A</div>

                <div class="brand-name">
                    AskOra
                </div>

            </div>

            <button
                class="new-chat-button"
                id="newChatButton"
                type="button"
            >
                <span>＋</span>
                <span>New chat</span>
            </button>

        </div>

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search chats..."
                autocomplete="off"
            >

        </div>

        <div class="chat-history-label">
            Chat history
        </div>

        <div
            class="chat-list"
            id="chatList"
        ></div>

        <div class="sidebar-bottom">

            <button
                class="side-button"
                id="adminButton"
                style="display:none"
                type="button"
            >
                ⚙
                <span>Admin dashboard</span>
            </button>

            <button
                class="side-button danger"
                id="deleteAccountButton"
                type="button"
            >
                🗑
                <span>Delete account</span>
            </button>

            <button
                class="side-button"
                id="logoutButton"
                type="button"
            >
                ↪
                <span>Log out</span>
            </button>

            <div
                class="account-card"
                id="accountCard"
            >

                <div
                    class="account-name"
                    id="accountName"
                >
                    Account
                </div>

                <div
                    class="account-email"
                    id="accountEmail"
                >
                    —
                </div>

            </div>

        </div>

    </aside>

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>

    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>

                <div class="top-brand">

                    <div class="top-brand-name">
                        AskOra
                    </div>

                    <div class="top-status">

                        <span class="online-dot"></span>

                        <span>Online</span>

                    </div>

                </div>

            </div>

            <div class="top-tagline">
                Ask. Get answers.
            </div>

        </header>

        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
        >

            <div
                class="messages-inner"
                id="messagesInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>
                        What can I help you with?
                    </h1>

                    <p>
                        Ask questions, learn something new,
                        brainstorm ideas, or get help with
                        whatever you're working on.
                    </p>

                    <p class="welcome-sub">
                        Advanced AI, made simple.
                    </p>

                </div>

            </div>

        </section>

        <!-- RECORDING -->

        <div
            class="recording-bar"
            id="recordingBar"
        >

            <span class="recording-dot"></span>

            <span>Recording</span>

            <span
                class="recording-time"
                id="recordingTime"
            >
                0:00
            </span>

            <button
                class="cancel-recording"
                id="cancelRecording"
                type="button"
            >
                Cancel
            </button>

        </div>

        <!-- COMPOSER -->

        <div class="composer-wrap">

            <div class="composer">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message AskOra..."
                    autocomplete="off"
                ></textarea>

                <button
                    class="icon-button"
                    id="micButton"
                    type="button"
                    aria-label="Voice input"

<script>
    /* =========================================================
       STATE
    ========================================================= */

    let CSRF = "";
    let currentUser = null;
    let chats = [];
    let currentChatId = null;

    let isSending = false;

    let mediaRecorder = null;
    let audioChunks = [];

    let recordingStartedAt = null;
    let recordingTimer = null;
    let recordingCancelled = false;

    let appInitialized = false;
    let redirectingToLogin = false;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const sidebar =
        document.getElementById("sidebar");

    const sidebarOverlay =
        document.getElementById("sidebarOverlay");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const newChatButton =
        document.getElementById("newChatButton");

    const searchInput =
        document.getElementById("searchInput");

    const chatList =
        document.getElementById("chatList");

    const messages =
        document.getElementById("messages");

    const messagesInner =
        document.getElementById("messagesInner");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const micButton =
        document.getElementById("micButton");

    const recordingBar =
        document.getElementById("recordingBar");

    const recordingTime =
        document.getElementById("recordingTime");

    const cancelRecording =
        document.getElementById("cancelRecording");

    const accountName =
        document.getElementById("accountName");

    const accountEmail =
        document.getElementById("accountEmail");

    const adminButton =
        document.getElementById("adminButton");

    const deleteAccountButton =
        document.getElementById("deleteAccountButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const toast =
        document.getElementById("toast");


    /* =========================================================
       TOAST
    ========================================================= */

    let toastTimer = null;

    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer =
            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 2800);
    }


    /* =========================================================
       LOGIN REDIRECT
       IMPORTANT: only redirect once.
    ========================================================= */

    function redirectToLogin() {

        if (redirectingToLogin) {
            return;
        }

        redirectingToLogin = true;

        window.location.replace(
            "/login"
        );
    }


    /* =========================================================
       API
    ========================================================= */

    async function apiFetch(
        url,
        options = {}
    ) {

        const fetchOptions = {
            ...options,
            credentials: "same-origin",
            cache: "no-store"
        };

        fetchOptions.headers = {
            ...(options.headers || {}),
            "Accept": "application/json"
        };

        if (CSRF) {

            fetchOptions.headers[
                "X-CSRF-Token"
            ] = CSRF;
        }


        const response =
            await fetch(
                url,
                fetchOptions
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch {

            data = {};
        }


        if (response.status === 401) {

            redirectToLogin();

            return null;
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Something went wrong."
            );
        }


        return data;
    }


    /* =========================================================
       INIT
       FIXED AUTH FLOW
    ========================================================= */

    async function init() {

        if (appInitialized) {
            return;
        }

        appInitialized = true;

        try {

            const response =
                await fetch(
                    "/api/me",
                    {
                        method: "GET",
                        credentials: "same-origin",
                        cache: "no-store",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            if (response.status === 401) {

                redirectToLogin();

                return;
            }


            if (!response.ok) {

                throw new Error(
                    "Authentication check failed."
                );
            }


            const data =
                await response.json();


            if (
                !data.authenticated ||
                !data.user
            ) {

                redirectToLogin();

                return;
            }


            CSRF =
                data.csrf_token || "";


            currentUser =
                data.user;


            updateAccountUI();


            await loadChats();


            await createOrLoadInitialChat();


            messageInput.focus();


        } catch (error) {

            console.error(
                "AskOra initialization error:",
                error
            );

            showToast(
                "Unable to load AskOra. Please refresh once."
            );
        }
    }


    /* =========================================================
       ACCOUNT UI
    ========================================================= */

    function updateAccountUI() {

        if (!currentUser) {
            return;
        }


        accountName.textContent =
            "@" +
            currentUser.username;


        accountEmail.textContent =
            currentUser.email ||
            "—";


        if (
            currentUser.is_admin === true
        ) {

            adminButton.style.display =
                "flex";

        } else {

            adminButton.style.display =
                "none";
        }
    }


    /* =========================================================
       LOAD CHATS
    ========================================================= */

    async function loadChats() {

        const data =
            await apiFetch(
                "/api/chats"
            );


        if (!data) {
            return;
        }


        chats =
            data.chats || [];


        renderChatList();
    }


    /* =========================================================
       CHAT LIST
    ========================================================= */

    function renderChatList() {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        chatList.innerHTML =
            "";


        const filtered =
            chats.filter(chat => {

                if (!query) {
                    return true;
                }


                return (
                    chat.title || ""
                )
                    .toLowerCase()
                    .includes(query);
            });


        if (!filtered.length) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.style.padding =
                "15px 10px";


            empty.style.color =
                "#687087";


            empty.style.fontSize =
                "12px";


            empty.textContent =
                query
                    ? "No chats found."
                    : "No previous chats.";


            chatList.appendChild(
                empty
            );


            return;
        }


        filtered.forEach(chat => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "chat-item" +
                (
                    Number(chat.id) ===
                    Number(currentChatId)
                        ? " active"
                        : ""
                );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "chat-item-title";


            title.textContent =
                chat.title ||
                "New chat";


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "delete-chat";


            deleteButton.type =
                "button";


            deleteButton.title =
                "Delete chat";


            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    await deleteChat(
                        chat.id
                    );
                }
            );


            item.appendChild(
                title
            );


            item.appendChild(
                deleteButton
            );


            item.addEventListener(
                "click",
                () => {

                    openChat(
                        chat.id
                    );

                    closeSidebar();
                }
            );


            chatList.appendChild(
                item
            );

        });
    }


    /* =========================================================
       CREATE INITIAL CHAT
    ========================================================= */

    async function createOrLoadInitialChat() {

        if (chats.length) {

            await openChat(
                chats[0].id
            );

            return;
        }


        await createNewChat();
    }


    /* =========================================================
       CREATE NEW CHAT
    ========================================================= */

    async function createNewChat() {

        try {

            const data =
                await apiFetch(
                    "/api/chats",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                title:
                                    "New chat"
                            })
                    }
                );


            if (!data) {
                return;
            }


            const chat =
                data.chat;


            if (!chat) {

                throw new Error(
                    "Could not create a new chat."
                );
            }


            chats.unshift(
                chat
            );


            currentChatId =
                chat.id;


            renderChatList();


            renderWelcome();


            messageInput.focus();


            closeSidebar();


        } catch (error) {

            console.error(error);


            showToast(
                error.message
            );
        }
    }


    /* =========================================================
       OPEN CHAT
    ========================================================= */

    async function openChat(
        chatId
    ) {

        currentChatId =
            Number(chatId);


        renderChatList();


        try {

            const data =
                await apiFetch(
                    `/api/chats/${chatId}/messages`
                );


            if (!data) {
                return;
            }


            messagesInner.innerHTML =
                "";


            const chatMessages =
                data.messages || [];


            if (!chatMessages.length) {

                renderWelcome();

                return;
            }


            chatMessages.forEach(
                message => {

                    appendMessage(
                        message.role,
                        message.content
                    );
                }
            );


            scrollToBottom();


        } catch (error) {

            console.error(error);


            showToast(
                error.message
            );
        }
    }


    /* =========================================================
       WELCOME
    ========================================================= */

    function renderWelcome() {

        messagesInner.innerHTML = `
            <div class="welcome">
                <div class="welcome-logo">A</div>

                <h1>
                    What can I help you with?
                </h1>

                <p>
                    Ask questions, learn something new,
                    brainstorm ideas, or get help with
                    whatever you're working on.
                </p>

                <p class="welcome-sub">
                    Advanced AI, made simple.
                </p>
            </div>
        `;
    }


    /* =========================================================
       APPEND MESSAGE
    ========================================================= */

    function appendMessage(
        role,
        content
    ) {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message " +
            (
                role === "user"
                    ? "user"
                    : "assistant"
            );


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "message-avatar";


        avatar.textContent =
            role === "user"
                ? "You"
                : "A";


        const body =
            document.createElement(
                "div"
            );


        body.className =
            "message-body";


        const contentDiv =
            document.createElement(
                "div"
            );


        contentDiv.className =
            "message-content";


        if (
            role === "assistant"
        ) {

            contentDiv.innerHTML =
                renderMarkdown(
                    content
                );

        } else {

            contentDiv.textContent =
                content;
        }


        body.appendChild(
            contentDiv
        );


        wrapper.appendChild(
            avatar
        );


        wrapper.appendChild(
            body
        );


        messagesInner.appendChild(

    /* =========================================================
       TYPING
    ========================================================= */

    function showTyping() {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message assistant";


        wrapper.id =
            "typingMessage";


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "message-avatar";


        avatar.textContent =
            "A";


        const body =
            document.createElement(
                "div"
            );


        body.className =
            "message-body";


        body.innerHTML = `
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;


        wrapper.appendChild(
            avatar
        );


        wrapper.appendChild(
            body
        );


        messagesInner.appendChild(
            wrapper
        );


        scrollToBottom();
    }


    function removeTyping() {

        const typing =
            document.getElementById(
                "typingMessage"
            );


        if (typing) {
            typing.remove();
        }
    }


    /* =========================================================
       MARKDOWN
    ========================================================= */

    function escapeHtml(
        text
    ) {

        return String(text)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    function renderInline(
        text
    ) {

        let html =
            escapeHtml(
                text
            );


        html =
            html.replace(
                /`([^`]+)`/g,
                "<code>$1</code>"
            );


        html =
            html.replace(
                /\*\*([^*]+)\*\*/g,
                "<strong>$1</strong>"
            );


        html =
            html.replace(
                /__([^_]+)__/g,
                "<strong>$1</strong>"
            );


        html =
            html.replace(
                /\*([^*]+)\*/g,
                "<em>$1</em>"
            );


        html =
            html.replace(
                /_([^_]+)_/g,
                "<em>$1</em>"
            );


        html =
            html.replace(
                /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );


        return html;
    }


    function renderMarkdown(
        markdown
    ) {

        if (!markdown) {
            return "";
        }


        const lines =
            String(markdown)
                .replace(
                    /\r\n/g,
                    "\n"
                )
                .split("\n");


        let html = "";

        let inCodeBlock =
            false;

        let codeBuffer = [];


        for (
            let i = 0;
            i < lines.length;
            i++
        ) {

            const line =
                lines[i];


            if (
                line.trim().startsWith(
                    "```"
                )
            ) {

                if (!inCodeBlock) {

                    inCodeBlock =
                        true;

                    codeBuffer = [];

                } else {

                    inCodeBlock =
                        false;

                    html +=
                        "<pre><code>" +
                        escapeHtml(
                            codeBuffer.join(
                                "\n"
                            )
                        ) +
                        "</code></pre>";

                    codeBuffer = [];
                }

                continue;
            }


            if (inCodeBlock) {

                codeBuffer.push(
                    line
                );

                continue;
            }


            if (!line.trim()) {
                continue;
            }


            if (
                line.startsWith(
                    "### "
                )
            ) {

                html +=
                    "<p><strong>" +
                    renderInline(
                        line.slice(4)
                    ) +
                    "</strong></p>";

                continue;
            }


            if (
                line.startsWith(
                    "## "
                )
            ) {

                html +=
                    "<p><strong>" +
                    renderInline(
                        line.slice(3)
                    ) +
                    "</strong></p>";

                continue;
            }


            if (
                line.startsWith(
                    "# "
                )
            ) {

                html +=
                    "<p><strong>" +
                    renderInline(
                        line.slice(2)
                    ) +
                    "</strong></p>";

                continue;
            }


            if (
                line.startsWith(
                    "> "
                )
            ) {

                html +=
                    "<blockquote>" +
                    renderInline(
                        line.slice(2)
                    ) +
                    "</blockquote>";

                continue;
            }


            if (
                /^[-*]\s+/.test(
                    line
                )
            ) {

                html +=
                    "<p>• " +
                    renderInline(
                        line.replace(
                            /^[-*]\s+/,
                            ""
                        )
                    ) +
                    "</p>";

                continue;
            }


            html +=
                "<p>" +
                renderInline(
                    line
                ) +
                "</p>";
        }


        if (inCodeBlock) {

            html +=
                "<pre><code>" +
                escapeHtml(
                    codeBuffer.join(
                        "\n"
                    )
                ) +
                "</code></pre>";
        }


        return html;
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage(
        textOverride = null
    ) {

        if (isSending) {
            return;
        }


        const text =
            (
                textOverride !== null
                    ? textOverride
                    : messageInput.value
            ).trim();


        if (!text) {
            return;
        }


        if (!currentChatId) {

            await createNewChat();


            if (!currentChatId) {
                return;
            }
        }


        isSending =
            true;


        sendButton.disabled =
            true;


        if (
            textOverride === null
        ) {

            messageInput.value =
                "";

            autoResize();
        }


        const existingWelcome =
            messagesInner.querySelector(
                ".welcome"
            );


        if (existingWelcome) {
            existingWelcome.remove();
        }


        appendMessage(
            "user",
            text
        );


        scrollToBottom();


        showTyping();


        try {

            const data =
                await apiFetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                chat_id:
                                    currentChatId,

                                message:
                                    text
                            })
                    }
                );


            removeTyping();


            if (!data) {
                return;
            }


            appendMessage(
                "assistant",
                data.answer
            );


            if (data.title) {

                const chat =
                    chats.find(
                        item =>
                            Number(item.id) ===
                            Number(currentChatId)
                    );


                if (chat) {

                    chat.title =
                        data.title;
                }
            }


            await loadChats();


            scrollToBottom();


        } catch (error) {

            removeTyping();


            appendMessage(
                "assistant",
                "⚠️ " +
                error.message
            );


            scrollToBottom();


        } finally {

            isSending =
                false;


            sendButton.disabled =
                false;


            messageInput.focus();
        }
    }


    /* =========================================================
       DELETE CHAT
    ========================================================= */

    async function deleteChat(
        chatId
    ) {

        const confirmed =
            confirm(
                "Delete this chat?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const data =
                await apiFetch(
                    `/api/chats/${chatId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!data) {
                return;
            }


            chats =
                chats.filter(
                    chat =>
                        Number(chat.id) !==
                        Number(chatId)
                );


            if (
                Number(currentChatId) ===
                Number(chatId)
            ) {

                if (chats.length) {

                    await openChat(
                        chats[0].id
                    );

                } else {

                    currentChatId =
                        null;

                    renderChatList();

                    await createNewChat();
                }

            } else {

                renderChatList();
            }


        } catch (error) {

            showToast(
                error.message
            );
        }
    }


    /* =========================================================
       VOICE
    ========================================================= */

    async function startRecording() {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showToast(
                "Voice recording is not supported on this device."
            );

            return;
        }


        try {

            const stream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        audio: true
                    }
                );


            audioChunks = [];


            recordingCancelled =
                false;


            mediaRecorder =
                new MediaRecorder(
                    stream
                );


            mediaRecorder.ondataavailable =
                event => {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );
                    }
                };


            mediaRecorder.onstop =
                async () => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );


                    stopRecordingUI();


                    if (
                        recordingCancelled
                    ) {

                        audioChunks = [];

                        return;
                    }


                    if (
                        !audioChunks.length
                    ) {

                        showToast(
                            "No audio was recorded."
                        );

                        return;
                    }


                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "audio/webm"
                            }
                        );


                    await sendVoice(
                        blob
                    );
                };


            mediaRecorder.start();


            startRecordingUI();


        } catch (error) {

            console.error(error);


            showToast(
                "Microphone permission was not granted."
            );
        }
    }


    function stopRecording() {

        if (
            mediaRecorder &&
            mediaRecorder.state !==
                "inactive"
        ) {

            mediaRecorder.stop();
        }
    }


    function cancelRecordingNow() {

        recordingCancelled =
            true;


        stopRecording();
    }


    function startRecordingUI() {

        micButton.classList.add(
            "recording"
        );


        recordingBar.classList.add(
            "active"
        );


        recordingStartedAt =
            Date.now();


        recordingTime.textContent =
            "0:00";


        clearInterval(
            recordingTimer
        );


        recordingTimer =
            setInterval(
                updateRecordingTimer,
                250
            );
    }


    function updateRecordingTimer() {

        if (!recordingStartedAt) {
            return;
        }


        const elapsed =
            Math.floor(
                (
                    Date.now() -
                    recordingStartedAt
                ) / 1000
            );


        const minutes =
            Math.floor(
                elapsed / 60
            );


        const seconds =
            elapsed % 60;


        recordingTime.textContent =
            `${minutes}:${String(seconds).padStart(2, "0")}`;
    }


    function stopRecordingUI() {

        micButton.classList.remove(
            "recording"
        );


        recordingBar.classList.remove(
            "active"
        );


        clearInterval(
            recordingTimer
        );


        recordingTimer =
            null;


        recordingStartedAt =
            null;
    }


    async function sendVoice(
        blob
    ) {

        try {

            showToast(
                "Transcribing voice..."
            );


            const formData =
                new FormData();


            formData.append(
                "audio",
                blob,
                "recording.webm"
            );


            const response =
                await fetch(
                    "/api/voice",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        cache:
                            "no-store",

                        headers:
                            CSRF
                                ? {
                                    "X-CSRF-Token":
                                        CSRF,

                                    "Accept":
                                        "application/json"
                                }
                                : {
                                    "Accept":
                                        "application/json"
                                },

                        body:
                            formData
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                data = {};
            }


            if (
                response.status === 401
            ) {

                redirectToLogin();

                return;
            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Voice transcription failed."
                );
            }


            const text =
                (
                    data.text ||
                    ""
                ).trim();


            if (!text) {

                showToast(
                    "I couldn't understand the recording."
                );

                return;
            }


            messageInput.value =
                text;


            autoResize();


            await sendMessage();


        } catch (error) {

            console.error(error);


            showToast(
                error.message
            );
        }
    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    function logout() {

        window.location.replace(
            "/logout"
        );
    }


    /* =========================================================
       DELETE ACCOUNT
    ========================================================= */

    async function deleteAccount() {

        const confirmed =
            confirm(
                "Delete your AskOra account and all of your AskOra chats? This cannot be undone."
            );


        if (!confirmed) {
            return;
        }


        try {

            const data =
                await apiFetch(
                    "/api/account/delete",
                    {
                        method: "POST"
                    }
                );


            if (
                data &&
                data.ok
            ) {

                window.location.replace(
                    "/login"
                );
            }


        } catch (error) {

            showToast(
                error.message
            );
        }
    }


    /* =========================================================
       MOBILE SIDEBAR
    ========================================================= */

    function openSidebar() {

        sidebar.classList.add(
            "open"
        );


        sidebarOverlay.classList.add(
            "active"
        );
    }


    function closeSidebar() {

        sidebar.classList.remove(
            "open"
        );


        sidebarOverlay.classList.remove(
            "active"
        );
    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom() {

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;
            }
        );
    }


    /* =========================================================
       TEXTAREA RESIZE
    ========================================================= */

    function autoResize() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                160
            ) + "px";
    }


    /* =========================================================
       EVENTS
    ========================================================= */

    newChatButton.addEventListener(
        "click",
        createNewChat
    );


    searchInput.addEventListener(
        "input",
        renderChatList
    );


    mobileMenu.addEventListener(
        "click",
        openSidebar
    );


    sidebarOverlay.addEventListener(
        "click",
        closeSidebar
    );


    sendButton.addEventListener(
        "click",
        () => sendMessage()
    );


    micButton.addEventListener(
        "click",
        () => {

            if (
                mediaRecorder &&
                mediaRecorder.state ===
                    "recording"
            ) {

                stopRecording();

            } else {

                startRecording();
            }
        }
    );


    cancelRecording.addEventListener(
        "click",
        cancelRecordingNow
    );


    deleteAccountButton.addEventListener(
        "click",
        deleteAccount
    );


    logoutButton.addEventListener(
        "click",
        logout
    );


    adminButton.addEventListener(
        "click",
        () => {

            window.location.href =
                "/admin";
        }
    );


    messageInput.addEventListener(
        "input",
        autoResize
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    /* =========================================================
       START APP
    ========================================================= */

    init();

</script>

</body>
</html>
