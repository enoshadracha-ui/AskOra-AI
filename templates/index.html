<script>

const csrfToken = "{{ csrf_token }}";

let chats = [];
let currentChatId = null;

const sidebar =
document.getElementById("sidebar");

const chatList =
document.getElementById("chatList");

const messages =
document.getElementById("messages");

const messagesInner =
document.getElementById("messagesInner");

const welcome =
document.getElementById("welcome");

const input =
document.getElementById("messageInput");

const composer =
document.getElementById("composer");

const headerChatTitle =
document.getElementById("headerChatTitle");

const loadingScreen =
document.getElementById("loadingScreen");

const recordingBox =
document.getElementById("recordingBox");

const recordingTime =
document.getElementById("recordingTime");

const searchChats =
document.getElementById("searchChats");


// ========================================================
// API
// ========================================================

async function api(
    url,
    options = {}
){

    options.headers =
        options.headers || {};

    options.headers[
        "X-CSRF-Token"
    ] = csrfToken;

    const response =
        await fetch(
            url,
            options
        );

    let data;

    try{
        data = await response.json();
    }catch{
        data = {
            ok:false,
            error:"Unexpected server response."
        };
    }

    if(!response.ok){
        throw new Error(
            data.error ||
            "Something went wrong."
        );
    }

    return data;
}


// ========================================================
// ESCAPE
// ========================================================

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// ========================================================
// MARKDOWN
// ========================================================

function renderMarkdown(text){

    if(
        typeof marked === "undefined"
        ||
        typeof DOMPurify === "undefined"
    ){
        return escapeHtml(text)
            .replace(/\n/g,"<br>");
    }

    marked.setOptions({
        breaks:true,
        gfm:true
    });

    let html =
        marked.parse(text);

    html =
        DOMPurify.sanitize(
            html,
            {
                FORBID_TAGS:["img"],
                FORBID_ATTR:[
                    "src",
                    "srcset"
                ]
            }
        );

    return html;
}


// ========================================================
// MESSAGE
// ========================================================

function addMessage(
    role,
    content
){

    if(welcome){
        welcome.style.display =
            "none";
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;

    const avatar =
        role === "user"
        ? "{{ user.username[0]|upper }}"
        : "A";

    wrapper.innerHTML = `
        <div class="message-avatar">
            ${escapeHtml(avatar)}
        </div>

        <div class="message-body">
            ${
                role === "assistant"
                ? renderMarkdown(content)
                : escapeHtml(content)
                    .replace(/\n/g,"<br>")
            }
        </div>
    `;

    messagesInner.appendChild(
        wrapper
    );

    scrollToBottom();
}


// ========================================================
// TYPING
// ========================================================

function showTyping(){

    const typing =
        document.createElement("div");

    typing.id =
        "typingIndicator";

    typing.className =
        "message assistant";

    typing.innerHTML = `
        <div class="message-avatar">A</div>

        <div class="message-body">
            <div class="typing show">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    `;

    messagesInner.appendChild(
        typing
    );

    scrollToBottom();
}


function hideTyping(){

    const typing =
        document.getElementById(
            "typingIndicator"
        );

    if(typing){
        typing.remove();
    }
}


// ========================================================
// SCROLL
// ========================================================

function scrollToBottom(){

    setTimeout(() => {

        messages.scrollTop =
            messages.scrollHeight;

    },20);
}


// ========================================================
// LOAD CHATS
// ========================================================

async function loadChats(){

    try{

        const data =
            await api(
                "/api/chats"
            );

        chats =
            data.chats || [];

        renderChatList();

        if(
            !currentChatId
            &&
            chats.length
        ){

            await openChat(
                chats[0].id
            );

        }else if(
            !currentChatId
        ){

            const data =
                await api(
                    "/api/chats",
                    {
                        method:"POST"
                    }
                );

            chats.unshift(
                data.chat
            );

            currentChatId =
                data.chat.id;

            headerChatTitle.textContent =
                "New chat";

        }

    }catch(error){

        console.error(error);

    }
}


// ========================================================
// CHAT LIST
// ========================================================

function renderChatList(){

    const query =
        searchChats.value
            .trim()
            .toLowerCase();

    chatList.innerHTML = "";

    const filtered =
        chats.filter(chat =>
            chat.title
                .toLowerCase()
                .includes(query)
        );

    filtered.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            "chat-item";

        if(
            Number(chat.id)
            ===
            Number(currentChatId)
        ){
            item.classList.add(
                "active"
            );
        }

        const open =
            document.createElement("button");

        open.className =
            "chat-open";

        open.textContent =
            chat.title || "New chat";

        open.onclick =
            () => openChat(chat.id);

        const del =
            document.createElement("button");

        del.className =
            "chat-delete";

        del.title =
            "Delete chat";

        del.textContent =
            "×";

        del.onclick =
            event => {

                event.stopPropagation();

                deleteChat(
                    chat.id
                );
            };

        item.appendChild(open);
        item.appendChild(del);

        chatList.appendChild(item);

    });
}


// ========================================================
// OPEN CHAT
// ========================================================

async function openChat(chatId){

    currentChatId =
        Number(chatId);

    const chat =
        chats.find(
            c =>
                Number(c.id)
                ===
                Number(chatId)
        );

    headerChatTitle.textContent =
        chat
        ? chat.title
        : "New chat";

    messagesInner.innerHTML = "";

    try{

        const data =
            await api(
                `/api/chats/${chatId}/messages`
            );

        if(
            !data.messages.length
        ){

            messagesInner.innerHTML = `
                <div class="welcome">
                    <div class="welcome-logo">A</div>
                    <h1>How can I help?</h1>
                    <p>Ask anything. Get clear answers.</p>
                </div>
            `;

        }else{

            data.messages.forEach(
                message => {

                    addMessage(
                        message.role,
                        message.content
                    );

                }
            );

        }

        renderChatList();

        );

        scrollToBottom();

    }catch(error){

        alert(error.message);

    }
}

async function createNewChat(){

    try{

        const data =
            await api(
                "/api/chats",
                {
                    method:"POST"
                }
            );

        chats.unshift(
            data.chat
        );

        currentChatId =
            data.chat.id;

        headerChatTitle.textContent =
            "New chat";

        messagesInner.innerHTML = `
            <div class="welcome">
                <div class="welcome-logo">A</div>
                <h1>How can I help?</h1>
                <p>Ask anything. Get clear answers.</p>
            </div>
        `;

        renderChatList();

        input.focus();

    }catch(error){

        alert(error.message);

    }
}


// ========================================================
// DELETE CHAT
// ========================================================

async function deleteChat(chatId){

    const confirmed =
        confirm(
            "Delete this chat permanently?"
        );

    if(!confirmed){
        return;
    }

    try{

        await api(
            `/api/chats/${chatId}`,
            {
                method:"DELETE"
            }
        );

        chats =
            chats.filter(
                chat =>
                    Number(chat.id)
                    !==
                    Number(chatId)
            );

        if(
            Number(currentChatId)
            ===
            Number(chatId)
        ){

            currentChatId = null;

            if(chats.length){

                await openChat(
                    chats[0].id
                );

            }else{

                await createNewChat();

            }

        }else{

            renderChatList();

        }

    }catch(error){

        alert(error.message);

    }
}

// ========================================================
// VOICE
// ========================================================

let mediaRecorder = null;
let audioChunks = [];
let recordingStarted = 0;
let recordingTimer = null;


function updateRecordingTime(){

    const seconds =
        Math.floor(
            (
                Date.now()
                -
                recordingStarted
            ) / 1000
        );

    const minutes =
        String(
            Math.floor(seconds / 60)
        ).padStart(2,"0");

    const remaining =
        String(
            seconds % 60
        ).padStart(2,"0");

    recordingTime.textContent =
        `${minutes}:${remaining}`;
}


async function startRecording(){

    if(
        !navigator.mediaDevices
        ||
        !navigator.mediaDevices.getUserMedia
    ){

        alert(
            "Voice recording is not supported by this browser."
        );

        return;
    }

    try{

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });

        mediaRecorder =
            new MediaRecorder(
                stream
            );

        audioChunks = [];

        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }
            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                clearInterval(
                    recordingTimer
                );

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                if(blob.size > 0){

                    await sendVoice(
                        blob
                    );

                }

            };

        mediaRecorder.start();

        recordingStarted =
            Date.now();

        recordingTime.textContent =
            "00:00";

        recordingBox.classList.add(
            "show"
        );

        recordingTimer =
            setInterval(
                updateRecordingTime,
                1000
            );

    }catch(error){

        alert(
            "Microphone permission was denied or unavailable."
        );

    }
}


function stopRecording(){

    if(
        mediaRecorder
        &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.stop();

    }

    recordingBox.classList.remove(
        "show"
    );
}


function cancelRecording(){

    if(
        mediaRecorder
        &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.onstop = null;

        mediaRecorder.stop();

        if(
            mediaRecorder.stream
        ){

            mediaRecorder.stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }

    audioChunks = [];

    clearInterval(
        recordingTimer
    );

    recordingBox.classList.remove(
        "show"
    );
}


async function sendVoice(blob){

    showTyping();

    const form =
        new FormData();

    form.append(
        "audio",
        blob,
        "recording.webm"
    );

    if(currentChatId){

        form.append(
            "chat_id",
            currentChatId
        );

    }

    try{

        const data =
            await api(
                "/api/voice",
                {
                    method:"POST",
                    body:form
                }
            );

        hideTyping();

        currentChatId =
            data.chat_id;

        addMessage(
            "user",
            data.transcription
        );

        addMessage(
            "assistant",
            data.answer
        );

        await loadChats();

    }catch(error){

        hideTyping();

        addMessage(
            "assistant",
            "⚠️ " + error.message
        );

    }
}


document

    );

        stopRecording

document

    .addEventListener(
