<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AskOra — Ask. Get answers.</title>

    <meta name="description" content="AskOra is your simple, fast and friendly AI assistant.">

    <style>
        :root {
            --bg:#080b18;
            --panel:#10152b;
            --panel-2:#141a33;
            --border:rgba(255,255,255,.08);
            --text:#f5f7ff;
            --muted:#9ca3af;
            --blue:#3b82f6;
            --violet:#7c3aed;
            --danger:#ef4444;
            --success:#22c55e;
            --shadow:0 20px 60px rgba(0,0,0,.35);
        }

        * {
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html,body {
            width:100%;
            height:100%;
            overflow:hidden;
        }

        body {
            font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:
                radial-gradient(circle at top right,rgba(124,58,237,.12),transparent 30%),
                radial-gradient(circle at bottom left,rgba(59,130,246,.10),transparent 30%),
                var(--bg);
            color:var(--text);
        }

        button,input,textarea {
            font:inherit;
        }

        button {
            cursor:pointer;
        }

        .app {
            width:100%;
            height:100%;
            display:flex;
        }

        /* SIDEBAR */

        .sidebar {
            width:280px;
            height:100%;
            flex-shrink:0;
            display:flex;
            flex-direction:column;
            background:rgba(10,14,30,.96);
            border-right:1px solid var(--border);
            position:relative;
            z-index:50;
        }

        .brand {
            padding:20px;
            display:flex;
            align-items:center;
            gap:12px;
            border-bottom:1px solid var(--border);
        }

        .logo,.welcome-logo {
            display:grid;
            place-items:center;
            font-weight:900;
            background:linear-gradient(135deg,var(--blue),var(--violet));
            box-shadow:0 8px 25px rgba(59,130,246,.25);
        }

        .logo {
            width:40px;
            height:40px;
            border-radius:12px;
            font-size:22px;
        }

        .brand-name {
            font-size:18px;
            font-weight:800;
        }

        .brand-subtitle {
            color:var(--muted);
            font-size:11px;
            margin-top:2px;
        }

        .sidebar-content {
            flex:1;
            min-height:0;
            padding:14px;
            display:flex;
            flex-direction:column;
        }

        .new-chat-btn {
            width:100%;
            border:1px solid rgba(59,130,246,.35);
            background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(124,58,237,.18));
            color:var(--text);
            border-radius:12px;
            padding:12px 14px;
            font-weight:700;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        .new-chat-btn:hover {
            border-color:rgba(59,130,246,.65);
        }

        .search-box {
            margin-top:12px;
            position:relative;
        }

        .search-box input {
            width:100%;
            border:1px solid var(--border);
            background:rgba(255,255,255,.035);
            color:var(--text);
            outline:none;
            border-radius:10px;
            padding:10px 12px 10px 36px;
        }

        .search-box span {
            position:absolute;
            left:12px;
            top:50%;
            transform:translateY(-50%);
            color:var(--muted);
        }

        .section-title {
            margin:18px 4px 8px;
            color:var(--muted);
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:.08em;
            font-weight:700;
        }

        .chat-list {
            flex:1;
            min-height:0;
            overflow-y:auto;
            padding-right:3px;
        }

        .chat-item {
            width:100%;
            display:flex;
            align-items:center;
            gap:8px;
            border:1px solid transparent;
            background:transparent;
            color:var(--text);
            border-radius:10px;
            padding:10px;
            margin-bottom:4px;
        }

        .chat-item:hover {
            background:rgba(255,255,255,.045);
        }

        .chat-item.active {
            background:rgba(59,130,246,.10);
            border-color:rgba(59,130,246,.18);
        }

        .chat-open {
            flex:1;
            min-width:0;
            border:none;
            background:none;
            color:inherit;
            text-align:left;
        }

        .chat-item-title {
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            font-size:13px;
        }

        .chat-delete {
            opacity:0;
            border:none;
            background:transparent;
            color:var(--muted);
            padding:4px;
        }

        .chat-item:hover .chat-delete {
            opacity:1;
        }

        .chat-delete:hover {
            color:var(--danger);
        }

        .sidebar-bottom {
            border-top:1px solid var(--border);
            padding:12px;
        }

        .account-card {
            background:rgba(255,255,255,.035);
            border:1px solid var(--border);
            border-radius:12px;
            padding:11px;
            margin-bottom:10px;
        }

        .account-name {
            font-weight:700;
            font-size:13px;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .account-email {
            color:var(--muted);
            font-size:11px;
            margin-top:3px;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .bottom-actions {
            display:grid;
            gap:5px;
        }

        .side-action {
            width:100%;
            padding:9px 10px;
            border:none;
            background:transparent;
            color:var(--muted);
            border-radius:9px;
            text-align:left;
        }

        .side-action:hover {
            background:rgba(255,255,255,.04);
            color:var(--text);
        }

        .side-action.danger:hover {
            color:var(--danger);
        }

        /* MAIN */

        .main {
            flex:1;
            min-width:0;
            height:100%;
            display:flex;
            flex-direction:column;
        }

        .topbar {
            height:68px;
            flex-shrink:0;
            display:flex;
            align-items:center;
            gap:12px;
            padding:0 20px;
            background:rgba(8,11,24,.88);
            backdrop-filter:blur(18px);
            border-bottom:1px solid var(--border);
            z-index:20;
        }

        .mobile-menu {
            display:none;
            border:none;
            background:transparent;
            color:var(--text);
            font-size:22px;
        }

        .topbar-title {
            font-weight:800;
            font-size:16px;
        }

        .topbar-subtitle {
            color:var(--muted);
            font-size:11px;
            margin-top:2px;
        }

        .online {
            margin-left:auto;
            display:flex;
            align-items:center;
            gap:6px;
            color:var(--muted);
            font-size:12px;
        }

        .online-dot {
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--success);
            box-shadow:0 0 10px rgba(34,197,94,.7);
        }

        /* MESSAGES */

        .messages {
            flex:1;
            min-height:0;
            overflow-y:auto;
            padding:30px 20px 140px;
        }

        .messages-inner {
            width:min(900px,100%);
            margin:0 auto;
        }

        .welcome {
            min-height:calc(100vh - 230px);
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:40px 20px;
        }

        .welcome-inner {
            max-width:620px;
        }

        .welcome-logo {
            width:68px;
            height:68px;
            border-radius:20px;
            margin:0 auto 20px;
            font-size:34px;
        }

        .welcome h1 {
            font-size:clamp(28px,5vw,44px);
            line-height:1.1;
            margin-bottom:12px;
        }

        .welcome p {
            color:var(--muted);
            line-height:1.6;
            font-size:15px;
        }

        .message {
            display:flex;
            gap:12px;
            margin-bottom:22px;
            animation:messageIn .2s ease;
        }

        @keyframes messageIn {
            from {
                opacity:0;
                transform:translateY(4px);
            }
            to {
                opacity:1;
                transform:translateY(0);
            }
        }

        .message.user {
            justify-content:flex-end;
        }

        .avatar {
            width:34px;
            height:34px;
            flex-shrink:0;
            border-radius:10px;
            display:grid;
            place-items:center;
            font-size:14px;
            font-weight:800;
            background:var(--panel-2);
            border:1px solid var(--border);
        }

        .message.user .avatar {
            order:2;
            background:linear-gradient(135deg,var(--blue),var(--violet));
        }

        .bubble {
            max-width:min(760px,82%);
            border-radius:15px;
            padding:12px 15px;
            line-height:1.6;
            font-size:14px;
            overflow-wrap:anywhere;
        }

        .message.assistant .bubble {
            background:rgba(255,255,255,.035);
            border:1px solid var(--border);
        }

        .message.user .bubble {
            background:linear-gradient(135deg,rgba(59,130,246,.20),rgba(124,58,237,.20));
            border:1px solid rgba(59,130,246,.20);
        }

        .bubble p {
            margin-bottom:9px;
        }

        .bubble p:last-child {
            margin-bottom:0;
        }

        .bubble ul,.bubble ol {
            margin:7px 0 9px 20px;
        }

        .bubble li {
            margin:4px 0;
        }

        .bubble code {
            background:rgba(0,0,0,.25);
            padding:2px 5px;
            border-radius:5px;
            font-size:.9em;
        }

        .bubble pre {
            margin:10px 0;
            padding:12px;
            overflow-x:auto;
            background:#070a14;
            border:1px solid var(--border);
            border-radius:9px;
        }

        .bubble pre code {
            background:transparent;
            padding:0;
        }

        .typing {
            display:inline-flex;
            gap:4px;
            align-items:center;
        }

        .typing span {
            width:6px;
            height:6px;
            border-radius:50%;
            background:var(--muted);
            animation:typing .9s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay:.15s;
        }

        .typing span:nth-child(3) {
            animation-delay:.3s;
        }

        @keyframes typing {
            0%,60%,100% {
                opacity:.25;
                transform:translateY(0);
            }
            30% {
                opacity:1;
                transform:translateY(-3px);
            }
        }

        /* COMPOSER */

        .composer-wrap {
            position:fixed;
            left:280px;
            right:0;
            bottom:0;
            padding:16px 20px 20px;
            background:linear-gradient(to top,rgba(8,11,24,1) 50%,rgba(8,11,24,0));
            z-index:30;
        }

        .composer {
            width:min(900px,100%);
            margin:0 auto;
            background:rgba(16,21,43,.96);
            border:1px solid var(--border);
            border-radius:18px;
            box-shadow:var(--shadow);
            padding:9px;
        }

        #normalComposer {
            width:100%;
            display:flex;
            align-items:flex-end;
            gap:8px;
        }

        .composer textarea {
            flex:1;
            min-width:0;
            max-height:160px;
            resize:none;
            border:none;
            outline:none;
            background:transparent;
            color:var(--text);
            padding:10px;
            line-height:1.45;
        }

        .composer textarea::placeholder {
            color:#687086;
        }

        .icon-btn,.send-btn {
            width:42px;
            height:42px;
            flex-shrink:0;
            border-radius:12px;
            display:grid;
            place-items:center;
        }

        .icon-btn {
            border:1px solid transparent;
            background:transparent;
            color:var(--muted);
            font-size:19px;
        }

        .icon-btn:hover {
            background:rgba(255,255,255,.05);
            color:var(--text);
        }

        /* MODERN MICROPHONE */

        #micButton.recording-ready {
            color:#fff;
            background:linear-gradient(135deg,var(--blue),var(--violet));
            box-shadow:0 0 22px rgba(59,130,246,.25);
        }

        .recording {
            display:none;
            width:100%;
            align-items:center;
            gap:12px;
            min-height:54px;
            padding:7px 8px;
        }

        .recording.active {
            display:flex;
        }

        .recording-icon {
            width:40px;
            height:40px;
            flex-shrink:0;
            display:grid;
            place-items:center;
            border-radius:50%;
            color:#fff;
            background:linear-gradient(135deg,var(--blue),var(--violet));
            box-shadow:0 0 25px rgba(59,130,246,.3);
            animation:micGlow 1.4s infinite;
        }

        @keyframes micGlow {
            0%,100% {
                box-shadow:0 0 10px rgba(59,130,246,.25);
            }
            50% {
                box-shadow:0 0 25px rgba(124,58,237,.65);
            }
        }

        .recording-info {
            min-width:75px;
        }

        .recording-label {
            font-size:12px;
            font-weight:700;
        }

        .recording-time {
            color:var(--muted);
            font-size:11px;
            margin-top:2px;
        }

        .wave {
            flex:1;
            height:34px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:3px;
            overflow:hidden;
        }

        .wave span {
            width:3px;
            height:8px;
            border-radius:5px;
            background:linear-gradient(to top,var(--blue),var(--violet));
            animation:wave 1s ease-in-out infinite;
        }

        .wave span:nth-child(1){animation-delay:.05s}
        .wave span:nth-child(2){animation-delay:.15s}
        .wave span:nth-child(3){animation-delay:.25s}
        .wave span:nth-child(4){animation-delay:.35s}
        .wave span:nth-child(5){animation-delay:.45s}
        .wave span:nth-child(6){animation-delay:.55s}
        .wave span:nth-child(7){animation-delay:.65s}
        .wave span:nth-child(8){animation-delay:.75s}
        .wave span:nth-child(9){animation-delay:.65s}
        .wave span:nth-child(10){animation-delay:.55s}
        .wave span:nth-child(11){animation-delay:.45s}
        .wave span:nth-child(12){animation-delay:.35s}

        @keyframes wave {
            0%,100% {
                height:7px;
                opacity:.45;
            }
            50% {
                height:28px;
                opacity:1;
            }
        }

        .recording-stop,.recording-cancel {
            border:none;
            border-radius:10px;
            padding:9px 12px;
            font-size:12px;
            font-weight:700;
        }

        .recording-stop {
            background:linear-gradient(135deg,var(--blue),var(--violet));
            color:#fff;
        }

        .recording-cancel {
            background:rgba(255,255,255,.06);
            color:var(--muted);
        }

        .send-btn {
            border:none;
            color:#fff;
            background:linear-gradient(135deg,var(--blue),var(--violet));
            font-size:17px;
        }

        .send-btn:disabled,.icon-btn:disabled {
            opacity:.45;
            cursor:not-allowed;
        }

        /* TOAST */

        .toast {
            position:fixed;
            left:50%;
            bottom:95px;
            transform:translateX(-50%) translateY(15px);
            opacity:0;
            pointer-events:none;
            background:#171c32;
            border:1px solid var(--border);
            color:var(--text);
            padding:10px 15px;
            border-radius:10px;
            box-shadow:var(--shadow);
            font-size:13px;
            z-index:100;
            transition:.2s;
        }

        .toast.show {
            opacity:1;
            transform:translateX(-50%) translateY(0);
        }

        .mobile-overlay {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.55);
            z-index:40;
        }

        @media(max-width:800px) {

            .sidebar {
                position:fixed;
                left:0;
                top:0;
                bottom:0;
                transform:translateX(-100%);
                transition:transform .22s ease;
            }

            .sidebar.open {
                transform:translateX(0);
            }

            .mobile-overlay.open {
                display:block;
            }

            .mobile-menu {
                display:block;
            }

            .composer-wrap {
                left:0;
                padding:10px;
            }

            .topbar {
                padding:0 14px;
            }

            .messages {
                padding:20px 12px 125px;
            }

            .bubble {
                max-width:88%;
            }
        }

        @media(max-width:500px) {

            .online {
                display:none;
            }

            .welcome h1 {
                font-size:30px;
            }

            .welcome p {
                font-size:14px;
            }

            .bubble {
                font-size:13px;
            }

            .wave {
                display:none;
            }

            .recording {
                gap:7px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div id="mobileOverlay"
         class="mobile-overlay"
         onclick="closeSidebar()"></div>

    <aside id="sidebar" class="sidebar">

        <div class="brand">
            <div class="logo">A</div>

            <div>
                <div class="brand-name">AskOra</div>
                <div class="brand-subtitle">Ask. Get answers.</div>
            </div>
        </div>

        <div class="sidebar-content">

            <button class="new-chat-btn"
                    onclick="createNewChat()">
                <span>＋</span>
                <span>New Chat</span>
            </button>

            <div class="search-box">
                <span>⌕</span>

                <input id="chatSearch"
                       type="text"
                       placeholder="Search chats..."
                       autocomplete="off">
            </div>

            <div class="section-title">
                Previous chats
            </div>

            <div id="chatList"
                 class="chat-list"></div>

        </div>

        <div class="sidebar-bottom">

            <div class="account-card">

                <div id="accountName"
                     class="account-name">
                    Loading...
                </div>

                <div id="accountEmail"
                     class="account-email">
                    Loading...
                </div>

            </div>

            <div class="bottom-actions">

                <button id="adminButton"
                        class="side-action"
                        style="display:none"
                        onclick="window.location.href='/admin'">
                    ⚙️ Admin Dashboard
                </button>

                <button class="side-action"
                        onclick="logoutUser()">
                    🚪 Logout
                </button>

                <button class="side-action danger"
                        onclick="deleteAccount()">
                    🗑️ Delete account
                </button>

            </div>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <button class="mobile-menu"
                    onclick="toggleSidebar()">
                ☰
            </button>

            <div>
                <div class="topbar-title">AskOra</div>
                <div class="topbar-subtitle">
                    Ask. Get answers.
                </div>
            </div>

            <div class="online">
                <span class="online-dot"></span>
                <span>Online</span>
            </div>

        </header>

        <section id="messages"
                 class="messages">

            <div id="messagesInner"
                 class="messages-inner">

                <div id="welcome"
                     class="welcome">

                    <div class="welcome-inner">

                        <div class="welcome-logo">A</div>

                        <h1>How can I help?</h1>

                        <p>
                            Ask me anything. Get clear,
                            useful answers with AskOra.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- COMPOSER -->

<div class="composer-wrap">

    <div class="composer">

        <div id="normalComposer">

            <textarea id="messageInput"
                      rows="1"
                      placeholder="Ask AskOra anything..."
                      autocomplete="off"></textarea>

            <button id="micButton"
                    class="icon-btn recording-ready"
                    title="Voice input"
                    type="button"
                    onclick="startRecording()">
                🎙️
            </button>

            <button id="sendButton"
                    class="send-btn"
                    type="button"
                    onclick="sendMessage()">
                ➤
            </button>

        </div>


        <!-- MODERN RECORDING UI -->

        <div id="recordingBar"
             class="recording">

            <div class="recording-icon">
                🎙️
            </div>

            <div class="recording-info">

                <div class="recording-label">
                    Listening...
                </div>

                <div id="recordingTime"
                     class="recording-time">
                    00:00
                </div>

            </div>

            <div class="wave">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <button class="recording-cancel"
                    type="button"
                    onclick="cancelRecording()">
                Cancel
            </button>

            <button class="recording-stop"
                    type="button"
                    onclick="stopRecording()">
                Send
            </button>

        </div>

    </div>

</div>


<div id="toast"
     class="toast"></div>


<script>
"use strict";

let CSRF = "";
let currentUser = null;
let chats = [];
let currentChatId = null;
let isSending = false;
let isInitializing = false;

let mediaRecorder = null;
let mediaStream = null;
let recordedChunks = [];
let recordingStartedAt = null;
let recordingTimer = null;


function $(id) {
    return document.getElementById(id);
}


function showToast(message) {

    const toast = $("toast");

    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2800);
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* MARKDOWN */

function renderMarkdown(text) {

    let html = escapeHtml(text);

    html = html.replace(
        /```([\s\S]*?)```/g,
        (_, code) =>
            "<pre><code>" +
            code.trim() +
            "</code></pre>"
    );

    html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );

    html = html.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^## (.*)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^# (.*)$/gm,
        "<h2>$1</h2>"
    );

    html = html.replace(
        /^\s*[-*] (.*)$/gm,
        "<li>$1</li>"
    );

    html = html.replace(
        /(<li>.*<\/li>)/gs,
        "<ul>$1</ul>"
    );

    html = html.replace(
        /\n{2,}/g,
        "</p><p>"
    );

    html = html.replace(/\n/g, "<br>");

    return "<p>" + html + "</p>";
}


/* API */

async function apiFetch(url, options = {}) {

    const config = {
        credentials: "same-origin",
        ...options,
        headers: {
            ...(options.headers || {})
        }
    };

    if (CSRF) {
        config.headers["X-CSRF-Token"] = CSRF;
    }

    const response =
        await fetch(url, config);

    if (response.status === 401) {
        throw new Error("AUTH_REQUIRED");
    }

    return response;
}


/* AUTH */

async function checkAuthentication() {

    try {

        const response =
            await fetch("/api/me", {
                credentials:"same-origin",
                cache:"no-store",
                headers:{
                    "Accept":"application/json"
                }
            });

        if (!response.ok) {
            return false;
        }

        const data =
            await response.json();

        if (
            data.authenticated === true &&
            data.user
        ) {

            CSRF =
                data.csrf_token || "";

            currentUser =
                data.user;

            return true;
        }

        return false;

    } catch (error) {

        console.error(error);

        return false;
    }
}


function updateAccountUI() {

    if (!currentUser) return;

    $("accountName").textContent =
        currentUser.username || "User";

    $("accountEmail").textContent =
        currentUser.email || "";

    $("adminButton").style.display =
        currentUser.is_admin
            ? "block"
            : "none";
}


/* HISTORY */

async function loadChats() {

    const response =
        await apiFetch("/api/chats");

    if (!response.ok) {
        throw new Error(
            "Unable to load chats."
        );
    }

    const data =
        await response.json();

    chats =
        Array.isArray(data.chats)
            ? data.chats
            : [];

    renderChatList();
}


function renderChatList(filter = "") {

    const list = $("chatList");

    if (!list) return;

    const search =
        filter.trim().toLowerCase();

    /*
       Empty "New conversation" chats are
       deliberately hidden from History.

       They only become History items after
       the user sends the first message and
       the backend gives them a real title.
    */

    const filtered =
        chats.filter(chat => {

            const title =
                String(chat.title || "").trim();

            const isEmpty =
                !title ||
                title.toLowerCase() ===
                "new conversation" ||
                title.toLowerCase() ===
                "new chat";

            if (isEmpty) {
                return false;
            }

            if (!search) {
                return true;
            }

            return title
                .toLowerCase()
                .includes(search);
        });

    if (!filtered.length) {

        list.innerHTML = `
            <div style="
                color:#687086;
                font-size:12px;
                padding:12px 8px;
            ">
                No previous chats yet.
            </div>
        `;

        return;
    }

    list.innerHTML =
        filtered.map(chat => {

            const active =
                Number(chat.id) ===
                Number(currentChatId);

            return `
                <div class="chat-item ${active ? "active" : ""}">

                    <button
                        class="chat-open"
                        onclick="openChat(${chat.id})"
                    >
                        <div class="chat-item-title">
                            ${escapeHtml(
                                chat.title ||
                                "Conversation"
                            )}
                        </div>
                    </button>

                    <button
                        class="chat-delete"
                        title="Delete chat"
                        onclick="
                            event.stopPropagation();
                            deleteChat(${chat.id});
                        "
                    >
                        ×
                    </button>

                </div>
            `;

        }).join("");
}


/* NEW CHAT */

async function createNewChat(closeMobile = true) {

    try {

        const response =
            await apiFetch(
                "/api/chats",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        title:"New conversation"
                    })
                }
            );

        if (!response.ok) {
            throw new Error(
                "Unable to create chat."
            );
        }

        const data =
            await response.json();

        if (!data.chat) {
            throw new Error(
                "Invalid chat response."
            );
        }

        chats.unshift(data.chat);

        currentChatId =
            data.chat.id;

        clearMessages();

        renderChatList();

        if (closeMobile) {
            closeSidebar();
        }

        return data.chat;

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Unable to create chat."
        );
    }
}


/*
   IMPORTANT:

   Every time the website loads,
   AskOra creates a NEW empty chat.

   Previous conversations remain in History.
*/

async function createOrLoadInitialChat() {

    await createNewChat(false);
}


/* OPEN HISTORY CHAT */

async function openChat(
    chatId,
    closeMobileMenu = true
) {

    try {

        currentChatId =
            chatId;

        renderChatList();

        const response =
            await apiFetch(
                `/api/chats/${chatId}/messages`
            );

        if (!response.ok) {
            throw new Error(
                "Unable to load conversation."
            );
        }

        const data =
            await response.json();

        clearMessages();

        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        if (!messages.length) {
            showWelcome();
        } else {

            messages.forEach(message => {

                addMessage(
                    message.role,
                    message.content
                );

            });
        }

        scrollToBottom();

        if (closeMobileMenu) {
            closeSidebar();
        }

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Unable to load chat."
        );
    }
}


/* DELETE HISTORY */

async function deleteChat(chatId) {

    if (!confirm(
        "Delete this conversation?"
    )) {
        return;
    }

    try {

        const response =
            await apiFetch(
                `/api/chats/${chatId}`,
                {
                    method:"DELETE"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Unable to delete chat."
            );
        }

        chats =
            chats.filter(
                chat =>
                    Number(chat.id) !==
                    Number(chatId)
            );

        if (
            Number(currentChatId) ===
            Number(chatId)
        ) {

            currentChatId = null;

            await createNewChat(false);
        }

        renderChatList();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Unable to delete chat."
        );
    }
}


/* MESSAGE UI */

function clearMessages() {

    $("messagesInner").innerHTML = "";

}


function showWelcome() {

    $("messagesInner").innerHTML = `
        <div class="welcome">

            <div class="welcome-inner">

                <div class="welcome-logo">
                    A
                </div>

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask me anything. Get clear,
                    useful answers with AskOra.
                </p>

            </div>

        </div>
    `;
}


function addMessage(role, content) {

    const welcome =
        $("welcome");

    if (welcome) {
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "U"
            : "A";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    if (role === "assistant") {

        bubble.innerHTML =
            renderMarkdown(content);

    } else {

        bubble.textContent =
            content;
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    $("messagesInner")
        .appendChild(wrapper);

    scrollToBottom();

    return wrapper;
}


function addTypingMessage() {

    const welcome =
        $("welcome");

    if (welcome) {
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.id =
        "typingMessage";

    wrapper.className =
        "message assistant";

    wrapper.innerHTML = `
        <div class="avatar">A</div>

        <div class="bubble">

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    $("messagesInner")
        .appendChild(wrapper);

    scrollToBottom();

    return wrapper;
}


function scrollToBottom() {

    const messages =
        $("messages");

    if (!messages) return;

    requestAnimationFrame(() => {
        messages.scrollTop =
            messages.scrollHeight;
    });
}


/* SEND TEXT */

async function sendMessage() {

    if (isSending) return;

    const input =
        $("messageInput");

    const message =
        input.value.trim();

    if (!message) return;

    if (!currentChatId) {

        await createNewChat(false);

        if (!currentChatId) {
            return;
        }
    }

    isSending = true;

    $("sendButton").disabled = true;
    $("micButton").disabled = true;

    input.value = "";

    resizeTextarea();

    addMessage(
        "user",
        message
    );

    const typing =
        addTypingMessage();

    try {

        const response =
            await apiFetch(
                "/api/chat",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        chat_id:
                            currentChatId,
                        message:
                            message
                    })
                }
            );

        if (!response.ok) {
            throw new Error(
                "Unable to get a response."
            );
        }

        const data =
            await response.json();

        typing.remove();

        addMessage(
            "assistant",
            data.answer ||
            data.response ||
            "I couldn't generate a response."
        );

        /*
           Backend should return the updated
           chat with the first question as
           its title.
        */

        if (data.chat) {

            const index =
                chats.findIndex(
                    chat =>
                        Number(chat.id) ===
                        Number(data.chat.id)
                );

            if (index >= 0) {
                chats[index] =
                    data.chat;
            } else {
                chats.unshift(
                    data.chat
                );
            }

        } else {

            /*
               Fallback for older backend:
               reload History from PostgreSQL.
            */

            await loadChats();
        }

        renderChatList();

    } catch (error) {

        console.error(error);

        if (typing) {
            typing.remove();
        }

        addMessage(
            "assistant",
            "Sorry, something went wrong while generating the response."
        );

    } finally {

        isSending = false;

        $("sendButton").disabled =
            false;

        $("micButton").disabled =
            false;

        input.focus();
    }
}


/* TEXTAREA */

function resizeTextarea() {

    const input =
        $("messageInput");

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            160
        ) + "px";
}


/* VOICE */

async function startRecording() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showToast(
            "Voice recording is not supported on this device."
        );

        return;
    }

    if (mediaRecorder) return;

    try {

        mediaStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        recordedChunks = [];

        mediaRecorder =
            new MediaRecorder(
                mediaStream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {
                    recordedChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async () => {

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                cleanupRecording();

                await sendVoice(blob);
            };

        mediaRecorder.start();

        recordingStartedAt =
            Date.now();

        $("normalComposer")
            .style.display = "none";

        $("recordingBar")
            .classList.add("active");

        updateRecordingTimer();

        recordingTimer =
            setInterval(
                updateRecordingTimer,
                500
            );

    } catch (error) {

        console.error(error);

        cleanupRecording();

        showToast(
            "Microphone permission was not granted."
        );
    }
}


function updateRecordingTimer() {

    if (!recordingStartedAt)
        return;

    const elapsed =
        Math.floor(
            (Date.now() -
                recordingStartedAt) /
            1000
        );

    const minutes =
        String(
            Math.floor(elapsed / 60)
        ).padStart(2,"0");

    const seconds =
        String(
            elapsed % 60
        ).padStart(2,"0");

    $("recordingTime")
        .textContent =
        `${minutes}:${seconds}`;
}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ) {

        mediaRecorder.stop();
    }
}


function cancelRecording() {

    if (mediaRecorder) {

        mediaRecorder.onstop =
            null;

        if (
            mediaRecorder.state !==
            "inactive"
        ) {
            mediaRecorder.stop();
        }
    }

    cleanupRecording();
}


function cleanupRecording() {

    clearInterval(
        recordingTimer
    );

    recordingTimer = null;
    recordingStartedAt = null;

    if (mediaStream) {

        mediaStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }

    mediaStream = null;
    mediaRecorder = null;
    recordedChunks = [];

    $("normalComposer")
        .style.display = "flex";

    $("recordingBar")
        .classList.remove("active");
}


async function sendVoice(blob) {

    if (!blob || !blob.size) {

        showToast(
            "No recording was captured."
        );

        return;
    }

    if (!currentChatId) {

        await createNewChat(false);

        if (!currentChatId) return;
    }

    const typing =
        addTypingMessage();

    try {

        const formData =
            new FormData();

        formData.append(
            "audio",
            blob,
            "voice.webm"
        );

        formData.append(
            "chat_id",
            String(currentChatId)
        );

        const response =
            await apiFetch(
                "/api/voice",
                {
                    method:"POST",
                    body:formData
                }
            );

        if (!response.ok) {
            throw new Error(
                "Voice request failed."
            );
        }

        const data =
            await response.json();

        typing.remove();

        if (data.transcript) {

            addMessage(
                "user",
                data.transcript
            );
        }

        addMessage(
            "assistant",
            data.answer ||
            "I couldn't process that voice message."
        );

        if (data.chat) {

            const index =
                chats.findIndex(
                    chat =>
                        Number(chat.id) ===
                        Number(data.chat.id)
                );

            if (index >= 0) {

                chats[index] =
                    data.chat;

            } else {

                chats.unshift(
                    data.chat
                );
            }

        } else {

            await loadChats();
        }

        renderChatList();

    } catch (error) {

        console.error(error);

        if (typing) {
            typing.remove();
        }

        addMessage(
            "assistant",
            "Sorry, I couldn't process your voice message."
        );
    }
}


/* SIDEBAR */

function toggleSidebar() {

    $("sidebar")
        .classList.toggle("open");

    $("mobileOverlay")
        .classList.toggle("open");
}


function closeSidebar() {

    $("sidebar")
        .classList.remove("open");

    $("mobileOverlay")
        .classList.remove("open");
}


/* SEARCH */

$("chatSearch").addEventListener(
    "input",
    event => {
        renderChatList(
            event.target.value
        );
    }
);


/* KEYBOARD */

$("messageInput").addEventListener(
    "input",
    resizeTextarea
);


$("messageInput").addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* INIT */

async function init() {

    if (isInitializing) {
        return;
    }

    isInitializing = true;

    try {

        const authenticated =
            await checkAuthentication();

        if (!authenticated) {

            window.location.replace(
                "/login"
            );

            return;
        }

        updateAccountUI();

        await loadChats();

        /*
           ALWAYS create a fresh chat when
           AskOra is opened/reloaded.

           Existing conversations remain
           stored in PostgreSQL and appear
           in History after they contain
           a real message.
        */

        await createOrLoadInitialChat();

    } catch (error) {

        console.error(
            "AskOra initialization error:",
            error
        );

        showToast(
            "Unable to load AskOra."
        );

    } finally {

        isInitializing = false;
    }
}


/* START */

document.addEventListener(
    "DOMContentLoaded",
    init
);

</script>
