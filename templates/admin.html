<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>AskOra Admin</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#080B18;
color:#F5F7FF;
font-family:Inter,system-ui,sans-serif;
padding:25px
}

.container{
max-width:1100px;
margin:auto
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:25px
}

h1{
margin:0
}

a{
color:#60A5FA;
text-decoration:none
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px
}

.card{
background:#10152B;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:20px
}

.label{
color:#9CA3AF;
font-size:13px
}

.value{
font-size:28px;
font-weight:800;
margin-top:8px
}

.table-wrap{
margin-top:20px;
overflow:auto
}

table{
width:100%;
border-collapse:collapse
}

th,
td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.08);
text-align:left;
white-space:nowrap
}

th{
color:#9CA3AF;
font-size:13px
}

@media(max-width:800px){

.grid{
grid-template-columns:repeat(2,1fr)
}

}
</style>

</head>

<body>

<div class="container">

<div class="top">

<h1>AskOra Admin</h1>

<a href="/">← Back to AskOra</a>

</div>

<div
class="grid"
id="stats"
>
Loading...
</div>

<div class="card table-wrap">

<h2>Users</h2>

<table>

<thead>

<tr>
<th>Username</th>
<th>Email</th>
<th>First seen</th>
<th>Last seen</th>
</tr>

</thead>

<tbody id="users"></tbody>

</table>

</div>

</div>

<script>

async function loadStats(){

const response =
await fetch(
"/api/admin/stats"
);

const data =
await response.json();

if(!data.ok){

document.getElementById(
"stats"
).textContent =
data.error;

return;

}

const s =
data.stats;

document.getElementById(
"stats"
).innerHTML = `

<div class="card">
<div class="label">Total users</div>
<div class="value">${s.total_users}</div>
</div>

<div class="card">
<div class="label">Users today</div>
<div class="value">${s.users_today}</div>
</div>

<div class="card">
<div class="label">Active today</div>
<div class="value">${s.active_today}</div>
</div>

<div class="card">
<div class="label">Total chats</div>
<div class="value">${s.total_chats}</div>
</div>

<div class="card">
<div class="label">Messages</div>
<div class="value">${s.total_messages}</div>
</div>

`;

const users =
document.getElementById(
"users"
);

users.innerHTML = "";

s.users.forEach(user => {

const row =
document.createElement("tr");

row.innerHTML = `

<td>${escapeHtml(user.username)}</td>

<td>${escapeHtml(user.email || "")}</td>

<td>${user.first_seen || ""}</td>

<td>${user.last_seen || ""}</td>

`;

users.appendChild(row);

});

}

function escapeHtml(value){

const div =
document.createElement("div");

div.textContent =
value ?? "";

return div.innerHTML;

}

loadStats();

</script>

</body>
</html>
