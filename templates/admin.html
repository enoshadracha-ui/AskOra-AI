<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080B18"
    >

    <title>AskOra Admin</title>

    <style>
        :root {
            --space: #080B18;
            --midnight: #10152B;
            --blue: #3B82F6;
            --violet: #7C3AED;
            --white: #F5F7FF;
            --gray: #9CA3AF;
            --border: rgba(255,255,255,.09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--space);
            color: var(--white);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .header {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(16,21,43,.8);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
        }

        .logo {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );
            font-size: 23px;
        }

        .back {
            color: white;
            text-decoration: none;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.04);
            padding: 9px 14px;
            border-radius: 10px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 28px 20px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: var(--gray);
            margin-bottom: 26px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .stat {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: rgba(255,255,255,.04);
        }

        .stat-label {
            color: var(--gray);
            font-size: 13px;
        }

        .stat-value {
            margin-top: 9px;
            font-size: 30px;
            font-weight: 800;
        }

        .panel {
            margin-top: 24px;
            border: 1px solid var(--border);
            border-radius: 17px;
            overflow: hidden;
            background: rgba(255,255,255,.035);
        }

        .panel-title {
            padding: 17px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            white-space: nowrap;
        }

        th {
            color: var(--gray);
            font-weight: 600;
        }

        .error {
            color: #ff8d8d;
            margin-top: 20px;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .header {
                padding: 0 14px;
            }

            .container {
                padding: 22px 12px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">A</div>
        AskOra Admin
    </div>

    <a
        href="/"
        class="back"
    >
        Back to AskOra
    </a>

</header>

<main class="container">

    <h1>Dashboard</h1>

    <div class="subtitle">
        AskOra platform statistics
    </div>

    <section class="stats">

        <div class="stat">
            <div class="stat-label">
                Total users
            </div>

            <div
                id="totalUsers"
                class="stat-value"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Users today
            </div>

            <div
                id="usersToday"
                class="stat-value"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Active today
            </div>

            <div
                id="activeToday"
                class="stat-value"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Total chats
            </div>

            <div
                id="totalChats"
                class="stat-value"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Questions
            </div>

            <div
                id="totalQuestions"
                class="stat-value"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Voice requests
            </div>

            <div
                id="voiceRequests"
                class="stat-value"
            >
                —
            </div>
        </div>

    </section>

    <section class="panel">

        <div class="panel-title">
            Recent users
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Joined</th>
                        <th>Last seen</th>
                    </tr>
                </thead>

                <tbody id="usersTable">
                </tbody>

            </table>

        </div>

    </section>

    <div
        id="error"
        class="error"
    ></div>

</main>

<script>

async function loadDashboard() {

    try {

        const response =
            await fetch(
                "/api/admin/stats"
            );

        const data =
            await response.json();

        if (!data.ok) {
            document.getElementById(
                "error"
            ).textContent =
                data.error ||
                "Unable to load dashboard.";

            return;
        }

        const stats =
            data.stats;

        document.getElementById(
            "totalUsers"
        ).textContent =
            stats.total_users;

        document.getElementById(
            "usersToday"
        ).textContent =
            stats.users_today;

        document.getElementById(
            "activeToday"
        ).textContent =
            stats.active_today;

        document.getElementById(
            "totalChats"
        ).textContent =
            stats.total_chats;

        document.getElementById(
            "totalQuestions"
        ).textContent =
            stats.total_questions;

        document.getElementById(
            "voiceRequests"
        ).textContent =
            stats.voice_requests;

        const table =
            document.getElementById(
                "usersTable"
            );

        table.innerHTML = "";

        (data.recent_users || [])
            .forEach(user => {

                const row =
                    document.createElement(
                        "tr"
                    );

                const joined =
                    new Date(
                        user.first_seen
                    ).toLocaleString();

                const lastSeen =
                    new Date(
                        user.last_seen
                    ).toLocaleString();

                row.innerHTML = `
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                `;

                row.children[0]
                    .textContent =
                    user.username;

                row.children[1]
                    .textContent =
                    user.email;

                row.children[2]
                    .textContent =
                    joined;

                row.children[3]
                    .textContent =
                    lastSeen;

                table.appendChild(row);
            });

    } catch {

        document.getElementById(
            "error"
        ).textContent =
            "Unable to load dashboard.";

    }
}

loadDashboard();

</script>

</body>
</html>
