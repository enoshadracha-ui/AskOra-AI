<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080b18;
            color: #f5f7ff;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            background: #0c1020;
        }

        header a {
            color: #9ca3af;
            text-decoration: none;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-top: 0;
        }

        .muted {
            color: #9ca3af;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(170px, 1fr)
                );
            gap: 14px;
            margin: 25px 0;
        }

        .stat {
            background: #10152b;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            padding: 18px;
        }

        .stat-label {
            color: #9ca3af;
            font-size: 13px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 8px;
        }

        .table-wrap {
            overflow-x: auto;
            background: #10152b;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,.06);
            white-space: nowrap;
        }

        th {
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>

    <strong>
        AskOra Admin
    </strong>

    <a href="/">
        ← Back to AskOra
    </a>

</header>

<main>

    <h1>
        Dashboard
    </h1>

    <div class="muted">
        Welcome, {{ user.username }}
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                Total users
            </div>

            <div
                class="stat-value"
                id="totalUsers"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Users today
            </div>

            <div
                class="stat-value"
                id="usersToday"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Active today
            </div>

            <div
                class="stat-value"
                id="activeToday"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Total chats
            </div>

            <div
                class="stat-value"
                id="totalChats"
            >
                —
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Total messages
            </div>

            <div
                class="stat-value"
                id="totalMessages"
            >
                —
            </div>
        </div>

    </div>

    <h2>
        Users
    </h2>

    <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Chats</th>
                    <th>Messages</th>
                    <th>Last active</th>
                </tr>

            </thead>

            <tbody id="users">
            </tbody>

        </table>

    </div>

</main>


<script>

const csrfToken =
    {{ csrf_token|tojson }};


async function loadStats() {

    const response =
        await fetch(
            "/api/admin/stats",
            {
                headers: {
                    "X-CSRF-Token":
                        csrfToken
                }
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        document.body.innerHTML =
            "<h2 style='padding:30px'>Access denied.</h2>";

        return;
    }

    document.getElementById(
        "totalUsers"
    ).textContent =
        data.stats.total_users;

    document.getElementById(
        "usersToday"
    ).textContent =
        data.stats.users_today;

    document.getElementById(
        "activeToday"
    ).textContent =
        data.stats.active_today;

    document.getElementById(
        "totalChats"
    ).textContent =
        data.stats.total_chats;

    document.getElementById(
        "totalMessages"
    ).textContent =
        data.stats.total_messages;

    const users =
        document.getElementById(
            "users"
        );

    users.innerHTML = "";

    data.users.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `
                <td>
                    ${escapeHtml(user.username)}
                </td>

                <td>
                    ${escapeHtml(user.email || "")}
                </td>

                <td>
                    ${user.chat_count}
                </td>

                <td>
                    ${user.message_count}
                </td>

                <td>
                    ${user.last_seen || ""}
                </td>
            `;

            users.appendChild(row);
        }
    );
}


function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


loadStats();

</script>

</body>
</html>
