<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b18;
            color: #f5f7ff;
            font-family:
                Inter,
                system-ui,
                sans-serif;
            padding: 25px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .header a {
            color: #60a5fa;
            text-decoration: none;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 14px;
            margin-bottom: 25px;
        }

        .card {
            background: #10152b;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            padding: 20px;
        }

        .card-label {
            color: #9ca3af;
            font-size: 12px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 8px;
        }

        .panel {
            background: #10152b;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            text-align: left;
            padding: 11px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            font-size: 13px;
        }

        th {
            color: #9ca3af;
            font-weight: 600;
        }

        .event {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }

        .muted {
            color: #9ca3af;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>
                AskOra Admin
            </h1>

            <div class="muted">
                Dashboard
            </div>
        </div>

        <a href="/">
            ← Back to AskOra
        </a>

    </div>


    <div
        class="cards"
        id="cards"
    >

        <div class="card">
            <div class="card-label">
                Total users
            </div>

            <div
                class="card-value"
                id="totalUsers"
            >
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                Users today
            </div>

            <div
                class="card-value"
                id="usersToday"
            >
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                Active today
            </div>

            <div
                class="card-value"
                id="activeToday"
            >
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                Total chats
            </div>

            <div
                class="card-value"
                id="totalChats"
            >
                —
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                Total messages
            </div>

            <div
                class="card-value"
                id="totalMessages"
            >
                —
            </div>
        </div>

    </div>


    <div class="panel">

        <h2>
            Events
        </h2>

        <div id="events">
            Loading...
        </div>

    </div>


    <div class="panel">

        <h2>
            Users
        </h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Chats</th>
                    <th>Messages</th>
                    <th>Last active</th>
                </tr>

            </thead>

            <tbody id="users">
            </tbody>

        </table>

    </div>

</div>


<script>

const csrfToken =
    "{{ csrf_token }}";


async function loadStats() {

    const response =
        await fetch(
            "/api/admin/stats",
            {
                headers: {
                    "X-CSRF-Token":
                        csrfToken
                }
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error
            || "Could not load dashboard."
        );

        return;
    }

    const stats =
        data.stats;

    document
        .getElementById(
            "totalUsers"
        )
        .textContent =
        stats.total_users;

    document
        .getElementById(
            "usersToday"
        )
        .textContent =
        stats.users_today;

    document
        .getElementById(
            "activeToday"
        )
        .textContent =
        stats.active_today;

    document
        .getElementById(
            "totalChats"
        )
        .textContent =
        stats.total_chats;

    document
        .getElementById(
            "totalMessages"
        )
        .textContent =
        stats.total_messages;


    const events =
        document.getElementById(
            "events"
        );

    events.innerHTML = "";

    data.events.forEach(
        event => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "event";

            row.innerHTML = `
                <span>
                    ${escapeHtml(
                        event.event_type
                    )}
                </span>

                <strong>
                    ${event.count}
                </strong>
            `;

            events.appendChild(row);

        }
    );


    const users =
        document.getElementById(
            "users"
        );

    users.innerHTML = "";

    data.users.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `
                <td>${user.id}</td>

                <td>
                    ${escapeHtml(
                        user.username
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        user.email || ""
                    )}
                </td>

                <td>
                    ${user.chats}
                </td>

                <td>
                    ${user.messages}
                </td>

                <td>
                    ${formatDate(
                        user.last_seen
                    )}
                </td>
            `;

            users.appendChild(row);

        }
    );

}


function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function formatDate(value) {

    if (!value) {
        return "";
    }

    return new Date(value)
        .toLocaleString();

}


loadStats();

setInterval(
    loadStats,
    30000
);

</script>

</body>
</html>
