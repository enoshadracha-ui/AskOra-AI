<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AskOra Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #080B18;

    color: #F5F7FF;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    padding: 25px;
}

.container {
    width: min(900px, 100%);
    margin: auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #9CA3AF;
    margin-bottom: 25px;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 15px;
}

.card {
    padding: 20px;

    border-radius: 18px;

    background: #10152B;

    border: 1px solid rgba(255,255,255,.08);
}

.label {
    color: #9CA3AF;
    font-size: 13px;
}

.value {
    font-size: 30px;
    font-weight: 800;
    margin-top: 7px;
}

a {
    display: inline-block;

    margin-top: 25px;

    color: #60A5FA;

    text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        AskOra Admin
    </h1>

    <div class="subtitle">
        Website statistics
    </div>

    <div
        class="grid"
        id="stats"
    ></div>

    <a href="/">
        ← Back to AskOra
    </a>

</div>


<script>

async function loadStats() {

    const response =
        await fetch("/api/admin/stats");

    const data =
        await response.json();

    if (!data.success) {
        return;
    }

    const items = [

        ["Total Users", data.total_users],

        ["New Users Today", data.new_users_today],

        ["New Users This Week", data.new_users_week],

        ["Active Today", data.active_users_today],

        ["Total Messages", data.total_messages],

        ["Messages Today", data.messages_today],

        ["Text Requests", data.text_requests],

        ["Voice Requests", data.voice_requests],

        ["Total Events", data.total_events],

    ];

    document.getElementById("stats").innerHTML =
        items.map(item => `

            <div class="card">

                <div class="label">
                    ${item[0]}
                </div>

                <div class="value">
                    ${item[1]}
                </div>

            </div>

        `).join("");
}

loadStats();

</script>

</body>
</html>
