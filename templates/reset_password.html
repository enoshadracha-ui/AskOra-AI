<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>New password — AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #080B18;
            color: #F5F7FF;
            font-family: system-ui, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,.1);
            background: #10152B;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #9CA3AF;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            color: white;
            background: rgba(255,255,255,.05);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
        }

        .error {
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 9px;
            color: #fecdd3;
            background: rgba(244,63,94,.1);
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Create new password</h1>

    <p>
        Choose a new password for your AskOra account.
    </p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    {% if token %}

    <form method="POST">

        <label>
            New password
        </label>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >

        <label>
            Confirm password
        </label>

        <input
            type="password"
            name="confirm_password"
            minlength="8"
            required
        >

        <button type="submit">
            Reset password
        </button>

    </form>

    {% endif %}

</div>

</body>
</html>
