<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Create account • AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080b18;
            color: #f5f7ff;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 410px;
            background: #10152b;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 30px;
        }

        .logo {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #3b82f6,
                #7c3aed
            );
            font-weight: 800;
            font-size: 23px;
        }

        h1 {
            margin: 0 0 7px;
        }

        .muted {
            color: #9ca3af;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: #080b18;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #3b82f6,
                #7c3aed
            );
            color: white;
            font-weight: 700;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 14px;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .hint {
            margin-top: 7px;
            font-size: 11px;
            color: #737b90;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        A
    </div>

    <h1>
        Create your AskOra account
    </h1>

    <div class="muted">
        Ask questions, chat, use voice,
        and analyze images.
    </div>

    <form
        method="POST"
        action="/register"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>
            Username
        </label>

        <input
            name="username"
            required
            minlength="3"
            maxlength="32"
            pattern="[A-Za-z0-9_]+"
            autocomplete="username"
            placeholder="your_username"
        >

        <div class="hint">
            3–32 letters, numbers or underscores.
        </div>

        <label>
            Email
        </label>

        <input
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
        >

        <label>
            Password
        </label>

        <input
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
        >

        <button type="submit">
            Create account
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="/login">
            Log in
        </a>
    </div>

</div>

</body>
</html>
