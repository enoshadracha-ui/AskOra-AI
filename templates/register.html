<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create account — AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background:
                radial-gradient(
                    circle at top,
                    rgba(124,58,237,.16),
                    transparent 40%
                ),
                #080B18;
            color: #F5F7FF;
            font-family: system-ui, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(16,21,43,.9);
            box-shadow: 0 25px 80px rgba(0,0,0,.35);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 17px;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
        }

        h1 {
            margin: 0 0 7px;
        }

        .sub {
            color: #9CA3AF;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #c7cede;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            color: white;
            background: rgba(255,255,255,.05);
        }

        input:focus {
            border-color: #3B82F6;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
            cursor: pointer;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #9CA3AF;
        }

        .error {
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 9px;
            color: #fecdd3;
            background: rgba(244,63,94,.1);
            border: 1px solid rgba(244,63,94,.2);
        }

        .hint {
            color: #727c94;
            font-size: 11px;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">A</div>

    <h1>Create your account</h1>

    <div class="sub">
        Start using AskOra for free.
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <label>
            Username
        </label>

        <input
            name="username"
            autocomplete="username"
            required
        >

        <div class="hint">
            3–32 characters.
        </div>

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            autocomplete="email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            autocomplete="new-password"
            required
        >

        <div class="hint">
            At least 8 characters.
        </div>

        <button type="submit">
            Create account
        </button>

    </form>

    <div class="links">
        Already have an account?
        <a href="/login">
            Login
        </a>
    </div>

</div>

</body>
</html>
