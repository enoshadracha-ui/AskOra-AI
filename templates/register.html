
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create account — AskOra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080b18;
            color: #f5f7ff;
            font-family:
                Inter,
                system-ui,
                sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #10152b;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 20px;
            padding: 30px;
            box-shadow:
                0 20px 70px rgba(0,0,0,.4);
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            font-size: 25px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #7c3aed
                );
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: 1px solid rgba(255,255,255,.1);
            background: #0b0f20;
            color: white;
            border-radius: 10px;
            padding: 12px;
            outline: none;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 13px;
            color: white;
            font-weight: 700;
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #7c3aed
                );
        }

        .error {
            background: rgba(239,68,68,.1);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,.2);
            padding: 10px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .bottom {
            margin-top: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .hint {
            color: #6f7890;
            font-size: 11px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">
        A
    </div>

    <h1>
        Create your account
    </h1>

    <div class="subtitle">
        Start using AskOra for free.
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form
        method="POST"
        action="/register"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="your_username"
            autocomplete="username"
            pattern="[a-z0-9_]{3,32}"
            required
        >

        <div class="hint">
            3-32 lowercase letters, numbers or underscores.
        </div>

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit">
            Create account
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="/login">
            Sign in
        </a>
    </div>

</div>

</body>
</html>
