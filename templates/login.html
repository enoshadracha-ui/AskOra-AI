<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background:
                radial-gradient(
                    circle at top,
                    rgba(59,130,246,.16),
                    transparent 40%
                ),
                #080B18;
            color: #F5F7FF;
            font-family:
                Inter,
                system-ui,
                sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px;
            background: rgba(16,21,43,.9);
            box-shadow: 0 25px 80px rgba(0,0,0,.35);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 17px;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
        }

        h1 {
            margin: 0 0 7px;
        }

        .sub {
            color: #9CA3AF;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
            color: #c7cede;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            color: white;
            background: rgba(255,255,255,.05);
        }

        input:focus {
            border-color: #3B82F6;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            background: linear-gradient(
                135deg,
                #3B82F6,
                #7C3AED
            );
            cursor: pointer;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            line-height: 2;
            color: #9CA3AF;
        }

        .error {
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 9px;
            color: #fecdd3;
            background: rgba(244,63,94,.1);
            border: 1px solid rgba(244,63,94,.2);
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">A</div>

    <h1>Welcome back</h1>

    <div class="sub">
        Sign in to your AskOra account.
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <label>
            Username or email
        </label>

        <input
            name="username"
            autocomplete="username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="links">

        <div>
            <a href="/forgot-password">
                Forgot password?
            </a>
        </div>

        <div>
            Don't have an account?
            <a href="/register">
                Create one
            </a>
        </div>

    </div>

</div>

</body>
</html>
