<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — AskOra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080b18;
            color: #f5f7ff;
            font-family:
                Inter,
                system-ui,
                sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #10152b;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 20px;
            padding: 30px;
            box-shadow:
                0 20px 70px rgba(0,0,0,.4);
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            font-size: 25px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #7c3aed
                );
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: 1px solid rgba(255,255,255,.1);
            background: #0b0f20;
            color: white;
            border-radius: 10px;
            padding: 12px;
            outline: none;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 13px;
            color: white;
            font-weight: 700;
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #7c3aed
                );
        }

        .error {
            background: rgba(239,68,68,.1);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,.2);
            padding: 10px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .bottom {
            margin-top: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">
        A
    </div>

    <h1>
        Welcome back
    </h1>

    <div class="subtitle">
        Sign in to continue using AskOra.
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form
        method="POST"
        action="/login"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>
            Username or email
        </label>

        <input
            type="text"
            name="identifier"
            placeholder="Username or email"
            autocomplete="username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Sign in
        </button>

    </form>

    <div class="bottom">
        Don't have an account?
        <a href="/register">
            Create one
        </a>
    </div>

</div>

</body>
</html>
