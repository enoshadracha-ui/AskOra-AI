<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — AskOra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(59, 130, 246, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(124, 58, 237, 0.18),
                    transparent 35%
                ),
                #080B18;

            color: #F5F7FF;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #7C3AED
                );

            box-shadow:
                0 0 35px rgba(59, 130, 246, 0.25),
                0 0 55px rgba(124, 58, 237, 0.15);

            font-size: 32px;
            font-weight: 900;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand p {
            margin-top: 7px;
            color: #9CA3AF;
            font-size: 14px;
        }

        .card {
            padding: 30px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(16, 21, 43, 0.97),
                    rgba(8, 11, 24, 0.97)
                );

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #9CA3AF;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #D7DBE8;

            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius: 12px;

            background: #10152B;
            color: #F5F7FF;

            outline: none;

            font-size: 15px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input::placeholder {
            color: #6B7280;
        }

        input:focus {
            border-color: #3B82F6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .error {
            margin-bottom: 18px;

            padding: 12px 14px;

            border:
                1px solid rgba(239, 68, 68, 0.25);

            border-radius: 10px;

            background:
                rgba(239, 68, 68, 0.10);

            color: #FCA5A5;

            font-size: 13px;
        }

        .login-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #7C3AED
                );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        .login-button:hover {
            transform: translateY(-1px);
        }

        .register {
            margin-top: 22px;

            text-align: center;

            color: #9CA3AF;

            font-size: 14px;
        }

        .register a {
            color: #60A5FA;

            text-decoration: none;

            font-weight: 600;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 22px;

            text-align: center;

            color: #6B7280;

            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }

            .brand h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        A
    </div>

    <div class="brand">
        <h1>AskOra</h1>
        <p>Ask. Get answers.</p>
    </div>

    <div class="card">

        <h2>Welcome back</h2>

        <p class="subtitle">
            Login to continue using AskOra.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="POST"
            action="/login"
        >

            {% if csrf_token %}
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >
            {% endif %}

            <div class="field">

                <label for="login">
                    Username or Email
                </label>

                <input
                    id="login"
                    name="login"
                    type="text"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                class="login-button"
                type="submit"
            >
                Login
            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="/register">
                Create one
            </a>

        </div>

    </div>

    <div class="footer">
        Advanced AI, made simple.
    </div>

</div>

</body>
</html>
