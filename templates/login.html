<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AskOra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(124,58,237,.18), transparent 35%),
                #080B18;
            color: #F5F7FF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #3B82F6, #7C3AED);
            box-shadow: 0 0 40px rgba(59,130,246,.25);
            font-size: 32px;
            font-weight: 900;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
        }

        .brand p {
            margin-top: 7px;
            color: #9CA3AF;
            font-size: 14px;
        }

        .card {
            padding: 30px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            background: rgba(16,21,43,.96);
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #9CA3AF;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #D7DBE8;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;
            background: #10152B;
            color: #F5F7FF;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }

        .error {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid rgba(239,68,68,.25);
            border-radius: 10px;
            background: rgba(239,68,68,.10);
            color: #FCA5A5;
            font-size: 13px;
        }

        button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3B82F6, #7C3AED);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .register {
            margin-top: 22px;
            text-align: center;
            color: #9CA3AF;
            font-size: 14px;
        }

        .register a {
            color: #60A5FA;
            text-decoration: none;
            font-weight: 600;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #6B7280;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">A</div>

    <div class="brand">
        <h1>AskOra</h1>
        <p>Ask. Get answers.</p>
    </div>

    <div class="card">

        <h2>Welcome back</h2>

        <p class="subtitle">
            Login to continue using AskOra.
        </p>

        <div id="error" class="error"></div>

        <form id="loginForm">

            <div class="field">
                <label for="login">
                    Username or Email
                </label>

                <input
                    id="login"
                    type="text"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="loginButton" type="submit">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register">Create one</a>
        </div>

    </div>

    <div class="footer">
        Advanced AI, made simple.
    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const errorBox = document.getElementById("error");

function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    errorBox.style.display = "none";

    const login = document.getElementById("login").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                login: login,
                password: password
            })
        });

        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
            const data = await response.json();

            if (data.ok) {
                window.location.href = "/";
                return;
            }

            showError(data.error || "Invalid username/email or password.");
        } else {
            const text = await response.text();

            if (response.ok) {
                window.location.href = "/";
                return;
            }

            showError("Login failed. Please check your details.");
        }

    } catch (error) {
        console.error("Login error:", error);
        showError("Unable to connect to AskOra. Please try again.");
    }

    button.disabled = false;
    button.textContent = "Login";
});
</script>

</body>
</html>
