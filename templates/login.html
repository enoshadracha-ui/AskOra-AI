<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Login • AskOra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080b18;
            color: #f5f7ff;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 410px;
            background: #10152b;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 80px rgba(0,0,0,.35);
        }

        .logo {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #3b82f6,
                #7c3aed
            );
            font-weight: 800;
            font-size: 23px;
        }

        h1 {
            margin: 0 0 7px;
        }

        .muted {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: #080b18;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #3b82f6,
                #7c3aed
            );
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 14px;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .csrf {
            display: none;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        A
    </div>

    <h1>
        Welcome back
    </h1>

    <div class="muted">
        Log in to continue with AskOra.
    </div>

    <form
        method="POST"
        action="/login"
    >

        <input
            class="csrf"
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>
            Username or email
        </label>

        <input
            name="login"
            required
            autocomplete="username"
            placeholder="Username or email"
        >

        <label>
            Password
        </label>

        <input
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Password"
        >

        <button type="submit">
            Log in
        </button>

    </form>

    <div class="bottom">
        Don't have an account?
        <a href="/register">
            Create one
        </a>
    </div>

</div>

</body>
</html>
