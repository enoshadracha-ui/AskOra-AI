<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in • AskOra</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at top left,rgba(59,130,246,.18),transparent 35%),
radial-gradient(circle at bottom right,rgba(124,58,237,.18),transparent 35%),
#080B18;
color:#F5F7FF;
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.card{
width:100%;
max-width:430px;
padding:32px;
background:rgba(16,21,43,.9);
border:1px solid rgba(255,255,255,.09);
border-radius:24px;
box-shadow:0 25px 80px rgba(0,0,0,.45)
}

.logo{
width:58px;
height:58px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
border-radius:17px;
background:linear-gradient(135deg,#3B82F6,#7C3AED);
font-size:27px;
font-weight:800
}

h1{
margin:0 0 8px;
font-size:28px
}

.subtitle{
margin:0 0 25px;
color:#9CA3AF;
line-height:1.5
}

label{
display:block;
margin:16px 0 7px;
font-size:14px;
font-weight:600
}

input{
width:100%;
height:50px;
padding:0 15px;
border-radius:13px;
border:1px solid rgba(255,255,255,.1);
background:#0B1022;
color:#F5F7FF;
outline:none;
font-size:15px
}

input:focus{
border-color:#3B82F6;
box-shadow:0 0 0 3px rgba(59,130,246,.12)
}

button{
width:100%;
height:52px;
margin-top:24px;
border:0;
border-radius:14px;
background:linear-gradient(135deg,#3B82F6,#7C3AED);
color:white;
font-size:15px;
font-weight:700;
cursor:pointer
}

.error{
padding:13px 14px;
margin-bottom:18px;
border-radius:12px;
background:rgba(239,68,68,.1);
border:1px solid rgba(239,68,68,.25);
color:#FCA5A5;
font-size:14px
}

.bottom{
margin-top:22px;
text-align:center;
color:#9CA3AF;
font-size:14px
}

a{
color:#60A5FA;
text-decoration:none;
font-weight:600
}
</style>
</head>

<body>

<div class="card">

<div class="logo">A</div>

<h1>Welcome back</h1>

<p class="subtitle">
Sign in to continue using AskOra.
</p>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST" action="/login">

<input
type="hidden"
name="csrf_token"
value="{{ csrf_token }}"
>

<label>Username or email</label>

<input
name="username"
type="text"
placeholder="Username or email"
autocomplete="username"
required
>

<label>Password</label>

<input
name="password"
type="password"
placeholder="Your password"
autocomplete="current-password"
required
>

<button type="submit">
Sign in
</button>

</form>

<div class="bottom">
Don't have an account?
<a href="/register">Create one</a>
</div>

</div>

</body>
</html>
